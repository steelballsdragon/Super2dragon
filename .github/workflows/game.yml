# Builds Age of Conquest, runs every test suite, and publishes dist/ to the gh-pages branch (GitHub Pages)
# only when all tests pass. Public link: https://steelballsdragon.github.io/Super2dragon/
name: Test and publish the game

on:
  push:
    branches: [main, claude/last-furnace-game]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs
      - name: Check the committed build matches the sources
        run: git diff --exit-code -- index.html dist/
      - run: node tests/all.mjs
      - name: Publish dist/ to gh-pages
        if: github.event_name == 'push'
        run: |
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
