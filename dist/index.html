// ================================================================ player commands
const INSTANT_CMDS = new Set(['build', 'research', 'train', 'heal']);
function playerCommand(w, cmd, opts = {}) {
  const r = playerCommandRaw(w, cmd, opts);
  // developer mode's instant switch finishes what was just started
  if (r && r.ok && w.devSw?.instant && opts.dev && INSTANT_CMDS.has(cmd.type)) devFinishNow(w);
  if (r && r.ok && w.devSw?.unlimited && opts.dev) devRefill(w);
  return r;
}
function playerCommandRaw(w, cmd, opts) {
  const P = w.govs[PLAYER];
  if (!cmd || typeof cmd !== 'object' || typeof cmd.type !== 'string') return { ok: false, err: 'Bad command.' };
  settle(w, P, w.t);
  const a = cmd;
  switch (a.type) {
    case 'free': return actFree(w, P, String(a.q), String(a.unit || ''));
    case 'collect': return actCollect(w, P, String(a.id));
    case 'build': return actBuild(w, P, String(a.id));
    case 'research': return actResearch(w, P, String(a.id));
    case 'train': return actTrain(w, P, String(a.unit), a.n);
    case 'heal': return actHeal(w, P);
    case 'cancelBuild': {
      if (!P.q.build) return { ok: false, err: 'Nothing is being built.' };
      refund(P, P.q.build.cost, 0.5); P.q.build = null; return { ok: true };
    }
    case 'trade': return actTrade(w, P, a.sell, a.buy, a.amount);
    case 'shield': return actShield(w, P);
    case 'relocate': return actRelocate(w, P, a.x, a.y, false);
    case 'exchange': return actExchange(w, P);
    case 'march': {
      const kind = String(a.kind);
      if (!['attack', 'scout', 'gather', 'reinforce'].includes(kind)) return { ok: false, err: 'Unknown order.' };
      const to = Math.floor(Number(a.to));
      if (kind !== 'scout' && !w.explored[to]) return { ok: false, err: 'You have not explored that place.' };
      return strip(startMarch(w, P, { kind, to, troops: a.troops, c1: a.c1, c2: a.c2 }));
    }
    case 'recall': {
      const m = w.marches.find(x => x.id === a.march && x.owner === PLAYER);
      if (!m) return { ok: false, err: 'That army is not yours.' };
      if (m.kind === 'return') return { ok: false, err: 'That army is already coming home.' };
      if (m.kind === 'rally') return { ok: false, err: 'A rally cannot be recalled once it marches.' };
      if (m.kind === 'rallyjoin' && m.state === 'waiting' && w.rallies.some(r => r.lead === m.id && r.state === 'gathering')) {
        // the leader cancels the whole rally
        const r = w.rallies.find(x => x.lead === m.id);
        for (const p of w.marches.filter(x => x.rally === r.id)) sendHome(w, p);
        r.state = 'done';
        return { ok: true };
      }
      sendHome(w, m);
      return { ok: true };
    }
    case 'rally': return strip(startRally(w, P, { to: Math.floor(Number(a.to)), troops: a.troops, c1: a.c1, c2: a.c2, wait: a.wait }));
    case 'joinRally': return strip(joinRally(w, P, { rally: a.rally, troops: a.troops, c1: a.c1, c2: a.c2 }));
    case 'steward': if (!own(P.cmds, a.cmd)) return { ok: false, err: 'You do not have that commander.' }; P.steward = a.cmd; modsChanged(P); return { ok: true };
    case 'defender': if (!own(P.cmds, a.cmd)) return { ok: false, err: 'You do not have that commander.' }; P.defender = a.cmd; return { ok: true };
    case 'talent': {
      const r = own(P.cmds, a.cmd) ? P.cmds[a.cmd] : null;
      if (!r) return { ok: false, err: 'You do not have that commander.' };
      if (!CMD[a.cmd].talents.includes(a.branch)) return { ok: false, err: 'That talent is not in this commander\'s tree.' };
      if (talentPointsFree(r) <= 0) return { ok: false, err: 'No talent points left. Commanders earn one per level.' };
      if ((r.tal[a.branch] || 0) >= 20) return { ok: false, err: 'That branch is full.' };
      r.tal[a.branch] = (r.tal[a.branch] || 0) + 1;
      return { ok: true };
    }
    case 'resetTalents': {
      const r = own(P.cmds, a.cmd) ? P.cmds[a.cmd] : null;
      if (!r) return { ok: false, err: 'You do not have that commander.' };
      const cost = { gold: 500 * r.lv };
      if (!canAfford(P, cost)) return { ok: false, err: `Resetting costs ${cost.gold.toLocaleString('en-US')} Gold.` };
      pay(P, cost); r.tal = {}; return { ok: true };
    }
    case 'skill': {
      const r = own(P.cmds, a.cmd) ? P.cmds[a.cmd] : null;
      const k = Math.floor(Number(a.skill));
      if (!r) return { ok: false, err: 'You do not have that commander.' };
      if (!(k >= 0 && k <= 3)) return { ok: false, err: 'Unknown skill.' };
      if (r.sk[k] >= 5) return { ok: false, err: 'That skill is at its highest level.' };
      if (k === 3 && r.lv < ULTIMATE_LEVEL) return { ok: false, err: `The ultimate unlocks at level ${ULTIMATE_LEVEL}.` };
      const cost = skillCost(a.cmd, r.sk[k]);
      if (!canAfford(P, cost)) return { ok: false, err: 'Not enough resources.' };
      pay(P, cost); r.sk[k]++; modsChanged(P);
      return { ok: true };
    }
    case 'claimQuest': {
      const q = QUESTS.find(x => x.id === a.id);
      if (!q) return { ok: false, err: 'Unknown quest.' };
      if (w.quests.claimed[q.id]) return { ok: false, err: 'Already claimed.' };
      if (!q.check(P)) return { ok: false, err: 'Not done yet.' };
      w.quests.claimed[q.id] = w.t;
      for (const r in q.reward) P.res[r] += q.reward[r];
      return { ok: true, reward: q.reward };
    }
    case 'apply': {
      const gd = intIn(a.guild, GUILD_COUNT) ? w.guilds[a.guild] : null;
      if (!gd) return { ok: false, err: 'Unknown guild.' };
      if (P.guild >= 0) return { ok: false, err: 'Leave your guild first.' };
      const invited = (P.invites || []).includes(gd.id);
      if (invited && !gd.collapsed && gd.members.length < GUILD_MAX) { joinGuild(w, P, gd.id); P.invites = P.invites.filter(x => x !== gd.id); }
      else { const r = applyToGuild(w, P, gd); if (!r.ok) return r; }
      chronicle(w, 'join', `${P.name} joined ${gd.name} [${gd.tag}].`, { g: [gd.id], p: [PLAYER], x: P.x, y: P.y, imp: 1 });
      w._cv = (w._cv || 0) + 1;
      recomputeTerritory(w);
      return { ok: true };
    }

  if (!Array.isArray(w.guilds) || w.guilds.length !== GUILD_COUNT) p.push(`expected ${GUILD_COUNT} guilds, found ${w.guilds?.length}`);
  if (p.length) return p;

  w.guilds.forEach((gd, gi) => {
    if (gd.members.length > GUILD_MAX) p.push(`${gd.name} has ${gd.members.length} members (max ${GUILD_MAX})`);
    if (!gd.collapsed && !gd.members.includes(gd.leader)) p.push(`${gd.name}'s leader is not a member`);
    for (const id of gd.members) {
      if (inGuild.has(id)) p.push(`governor ${id} is in two guilds`);

      if (!Number.isInteger(g.wounded[u]) || g.wounded[u] < 0) p.push(`governor ${i} has bad wounded ${u}`);
      if (Math.abs((g.away[u] || 0) - away[i][u]) > 0) p.push(`governor ${i} away ${u} is ${g.away[u]} but marches hold ${away[i][u]}`);
    }

// ================================================================ the server (runs in a Web Worker, or on the page as a fallback)
function createServer(host) {

    const after = summaryOf(S.w);
    post({ type: 'offline', minutes, before, after, chronicle: S.w.chron.filter(e => e.n > chron0 && chronVisible(S.w, e) && (e.imp >= 2 || e.p.includes(PLAYER))).slice(-25), reports: S.w.reports.filter(r => r.t > S.w.t - minutes).map(r => ({ id: r.id, title: r.title, t: r.t })) });
  }

    handle(msg) {
      try {
        switch (msg.type) {
          case 'new': {
            const t0 = now();
            S.w = createWorld({ seed: msg.seed, name: msg.name, civ: msg.civ, dev: S.dev, now: now(), scenario: msg.scenario === 'coalition' ? 'coalition' : null });

            return;
          }
          case 'load': {
            const r = deserialize(msg.json);

            S.speed = 1; S.acc = 0;
            const awaySec = Math.max(0, (now() - (S.w.realSavedAt || now())) / 1000);

          }
          case 'cmd': {

            post({ type: 'reply', rid: msg.rid, res });
            if (res.ok) sendFrame();
            return;
          }
          case 'query': {
            if (!S.w) return post({ type: 'reply', rid: msg.rid, res: null });
            const a = msg.args || {};
            let res = null;
            switch (msg.q) {
              case 'inspect': res = inspect(S.w, a.id); break;
              case 'guild': res = guildDetail(S.w, a.id); break;
              case 'rankings': res = rankings(S.w, a.kind); break;
              case 'reports': res = S.w.reports.slice().reverse().map(r => ({ id: r.id, t: r.t, kind: r.kind, title: r.title, read: r.read, won: r.won })); break;
              case 'report': res = S.w.reports.find(r => r.id === a.id) || null; break;
              case 'replay': { const r = S.w.reports.find(x => x.id === a.id); res = r && r.input ? fight(r.input) : null; break; }

              case 'history': res = historyView(S.w); break;
              case 'tile': res = tileView(S.w, a.i); break;
              case 'preview': res = marchPreview(S.w, a); break;
              case 'build': res = BUILDING_KEYS.map(id => ({ id, ...buildCheck(S.w, S.w.govs[PLAYER], id) })); break;
              case 'research': res = TECH_KEYS.map(id => ({ id, ...researchCheck(S.w, S.w.govs[PLAYER], id) })); break;
              case 'train': { const P = S.w.govs[PLAYER]; res = UNIT_KEYS.map(u => ({ u, max: trainBatch(P.b[UNITS[u].building] || 0), check: trainCheck(S.w, P, u, Math.max(1, Math.floor(Number(a[u]) || 1))) })); break; }

              case 'quote': res = { got: tradeQuote(S.w, S.w.govs[PLAYER], a.sell, a.buy, Math.max(0, Math.floor(Number(a.amount) || 0))), price: { ...S.w.market.price } }; break;

// ================================================================ saves: IndexedDB with gzip, browser storage as a fallback
function idb() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(SAVE_DB, 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => { r.result.createObjectStore('saves'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function gzip(text) {
  if (typeof CompressionStream !== 'function') return { enc: 'plain', data: text };
  const s = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  return { enc: 'gzip', data: await new Response(s).blob() };
}
async function gunzip(rec) {
  if (!rec) return null;
  if (rec.enc === 'plain') return rec.data;
  const s = rec.data.stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
U.store = {
  async put(key, json, meta) {
    const rec = { ...(await gzip(json)), meta, at: Date.now() };
    try {
      const db = await idb();
      await new Promise((res, rej) => { const tx = db.transaction('saves', 'readwrite'); tx.objectStore('saves').put(rec, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      db.close();
      U.store.where = 'IndexedDB';
      return true;
    } catch (e) {
      // no IndexedDB (some private windows): keep the newest copy in browser storage, gzipped as base64 if possible
      let data = json, enc = 'plain';
      if (rec.enc === 'gzip') { try { const bytes = new Uint8Array(await rec.data.arrayBuffer()); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); data = btoa(bin); enc = 'gzip64'; } catch (e2) { data = json; enc = 'plain'; } }
      if (LS.set(SAVE_LS + '-' + key, JSON.stringify({ meta, at: Date.now(), enc, data }))) { U.store.where = 'browser storage'; return true; }
      U.store.where = 'nowhere';
      return false;
    }
  },
  async get(key) {
    try {
      const db = await idb();
      const rec = await new Promise((res, rej) => { const tx = db.transaction('saves', 'readonly'); const q = tx.objectStore('saves').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
      db.close();
      if (rec) return { meta: rec.meta, at: rec.at, json: await gunzip(rec) };
    } catch (e) { /* fall through */ }
    try {
      const raw = LS.get(SAVE_LS + '-' + key);
      if (raw) {
        const o = JSON.parse(raw);
        if (o.enc === 'gzip64') { const bin = atob(o.data); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return { meta: o.meta, at: o.at, json: await gunzip({ enc: 'gzip', data: new Blob([bytes]) }) }; }
        return { meta: o.meta, at: o.at, json: o.data ?? o.json };
      }
    } catch (e) { /* unreadable */ }
    return null;
  },
  async remove(key) {
    try { const db = await idb(); await new Promise(res => { const tx = db.transaction('saves', 'readwrite'); tx.objectStore('saves').delete(key); tx.oncomplete = res; tx.onerror = res; }); db.close(); } catch (e) { /* ignore */ }
    LS.remove(SAVE_LS + '-' + key);
  },
  where: 'IndexedDB',
};

// ================================================================ the simulation host
// The engine runs in a Web Worker built from the page's own engine script; if a worker cannot start (some
// sandboxes forbid them) the same server runs on the page in small time slices.
U.host = null;
function makeHost(dev, onMsg) {
  const pending = new Map();
  let rid = 0;
  const handle = m => {
    if (m.type === 'reply') { const p = pending.get(m.rid); if (p) { pending.delete(m.rid); p(m.res); } return; }
    onMsg(m);
  };
  const H = {
    mode: 'none',
    send: null,
    cmd(cmd) { return new Promise(res => { const id = ++rid; pending.set(id, res); H.send({ type: 'cmd', rid: id, cmd }); }); },
    query(q, args) { return new Promise(res => { const id = ++rid; pending.set(id, res); H.send({ type: 'query', rid: id, q, args }); }); },
    post(m) { H.send(m); },
  };
  const inline = () => {
    H.mode = 'page';
    const server = A.createServer({ post: m => setTimeout(() => handle(m), 0), dev, budgetMs: 10 });
    H.send = m => server.handle(m);
    let last = performance.now();
    H.timer = setInterval(() => { const t = performance.now(); server.tick(Math.min(1000, t - last)); last = t; }, 100);
    H.server = server;
  };
  return new Promise(resolve => {
    let worker = null, done = false;
    const fallback = why => { if (done) return; done = true; try { worker?.terminate(); } catch (e) { /* ignore */ } H.why = why; inline(); resolve(H); };
    try {
      if (U.forcePage) throw new Error('page mode requested');
      const src = document.getElementById('aoc-engine')?.textContent;
      if (!src || typeof Worker !== 'function') throw new Error('no worker support');
      const url = URL.createObjectURL(new Blob([src + (window.AOC_GLUE || '')], { type: 'text/javascript' }));
      worker = new Worker(url);
      worker.onmessage = e => {
        const m = e.data;
        if (m.type === 'up' && !done) { done = true; H.mode = 'worker'; H.send = x => worker.postMessage(x); H.worker = worker; resolve(H); return; }
        handle(m);
      };
      worker.onerror = e => { e.preventDefault?.(); if (!done) fallback('worker error'); else onMsg({ type: 'error', err: 'The simulation worker stopped: ' + (e.message || 'unknown error') }); };
      worker.postMessage({ type: 'init', dev });
      setTimeout(() => fallback('worker did not answer'), 3000);
    } catch (e) { fallback(String(e.message || e)); }
  });
}

// ================================================================ state from the simulation
U.F = null;            // latest frame
U.S = { ter: null, seed: 0, fog: null, terr: null, cities: new Map(), visVer: 0, terrVer: 0 };
const listeners = new Set();
U.onFrame = fn => { listeners.add(fn); return () => listeners.delete(fn); };
function onMessage(m) {
  switch (m.type) {
    case 'ready': {
      U.S.seed = m.seed;
      U.S.ter = A.generateTerrain(m.seed).ter;
      U.S.cities = new Map();
      if (U._ready) { const r = U._ready; U._ready = null; r(m); }
      break;
    }
    case 'frame': {
      const f = m.frame;
      if (f.fog) { U.S.fog = f.fog; U.S.visVer++; }
      if (f.terr) { U.S.terr = f.terr; U.S.terrVer++; }
      if (f.cities) { U.S.cities = new Map(f.cities.map(c => [c.id, c])); U.S.cityVer = (U.S.cityVer || 0) + 1; }
      U.F = f;
      for (const n of f.notes || []) showNote(n);
      for (const fn of listeners) { try { fn(f); } catch (e) { console.error('[aoc] frame listener failed', e); } }
      break;
    }
    case 'save': {
      const P = U.F?.player;
      const meta = { name: P?.name, civ: P?.civ, hall: P?.b?.hall, power: P?.power, day: U.F?.day, age: U.F?.age, guild: P && P.guild >= 0 ? U.F.guilds[P.guild]?.tag : null, savedAt: Date.now() };
      U.store.put('main', m.json, meta).then(ok => { U.saveState = ok ? 'saved' : 'failed'; U.lastSave = Date.now(); });
      if (!U.lastBackup || Date.now() - U.lastBackup > 300000) { U.lastBackup = Date.now(); U.store.put('backup', m.json, meta); }
      break;
    }
    case 'progress': U.progress?.(m.pct, m.label); break;
    case 'offline': U.showOffline?.(m); break;
    case 'loadError': if (U._ready) { const r = U._ready; U._ready = null; r(m); } break;
    case 'error': console.error('[aoc] simulation error', m.err); U.lastError = m.err; break;
  }
}
function showNote(n) {
  const pref = U.F?.settings?.notify || 'important';
  if (pref === 'off' && n.imp < 3) return;
  if (pref === 'important' && n.imp < 3) return;
  if (U.F && n.k === 'chronicle' && n.imp < 3) return;
  U.toast(n.text, n.k === 'alert' || n.k === 'sacked' ? 'bad' : n.k === 'age' ? 'good' : 'info');
}

const screens = new Map();

const TABS = [
  { id: 'city', label: 'City', icon: 'city' },
  { id: 'map', label: 'World', icon: 'map' },
  { id: 'army', label: 'Army', icon: 'army' },
  { id: 'guild', label: 'Guild', icon: 'guild' },
  { id: 'intel', label: 'Mail', icon: 'report' },
  { id: 'chron', label: 'History', icon: 'scroll' },
  { id: 'ranks', label: 'Ranks', icon: 'ranks' },
];
U.current = null;
U.go = (id, arg) => {
  const s = screens.get(id);
  if (!s) return;
  const root = document.getElementById('aoc');
  for (const [sid, def] of screens) { if (def.el) def.el.hidden = sid !== id; }
  root.querySelectorAll('.aoc-tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === id ? 'page' : 'false'));
  if (!s.el) { s.el = el(`<section class="aoc-screen aoc-screen-${id}" aria-label="${esc(TABS.find(t => t.id === id)?.label || id)}"></section>`); root.querySelector('.aoc-screens').appendChild(s.el); s.mount?.(s.el); }
  s.el.hidden = false;
  const prev = U.current;
  U.current = id;
  if (prev && prev !== id) screens.get(prev)?.hide?.();
  s.show?.(arg);
  if (U.F) s.update?.(U.F, true);
};

    case 'research': return P.b.academy > 0 ? (U.closeSheets(), U.cityPanel('research')) : city(P.b.hall >= A.BUILDINGS.academy.needHall ? 'academy' : 'hall');

ART.wallSegment = (g, x, y, w, d, stone, h = 20) => {
  const b = box(g, x, y, w, d, h, stone);
  // crenellations along the top front edges
  const n = Math.max(2, Math.round((w + d) * 2));
  const pts = [];
  for (let i = 0; i < n; i++) pts.push(i / n);
  for (const t of pts) {
    if (d > w) { const p = [b.D[0] + (b.A[0] - b.D[0]) * t, b.D[1] + (b.A[1] - b.D[1]) * t]; poly(g, [[p[0] - 3, p[1]], [p[0] + 3, p[1] - 1.5], [p[0] + 3, p[1] - 6.5], [p[0] - 3, p[1] - 5]], shade(stone, 0.95), EDGE); }
    else { const p = [b.A[0] + (b.B[0] - b.A[0]) * t, b.A[1] + (b.B[1] - b.A[1]) * t]; poly(g, [[p[0] - 3, p[1] + 1.5], [p[0] + 3, p[1]], [p[0] + 3, p[1] - 5], [p[0] - 3, p[1] - 3.5]], shade(stone, 0.95), EDGE); }
  }
  return b;
};

};

function drawPine(g, x, y, s = 1) {
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x + 3 * s, y, 7 * s, 3 * s, 0, 0, 7); g.fill();
  g.fillStyle = '#5a3a20'; g.fillRect(x - 1.2 * s, y - 5 * s, 2.4 * s, 5 * s);
  for (let k = 0; k < 3; k++) {
    const w = (9 - k * 2) * s, yy = y - 4 * s - k * 6 * s;
    g.fillStyle = k === 2 ? '#3f7a3a' : k === 1 ? '#356b33' : '#2c5a2b';
    g.beginPath(); g.moveTo(x - w, yy); g.lineTo(x, yy - 10 * s); g.lineTo(x + w, yy); g.closePath(); g.fill();
  }
}
function drawOak(g, x, y, s = 1) {
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x + 3 * s, y, 8 * s, 3.5 * s, 0, 0, 7); g.fill();
  g.fillStyle = '#5a3a20'; g.fillRect(x - 1.5 * s, y - 7 * s, 3 * s, 7 * s);
  for (const [dx, dy, r, c] of [[-4, -11, 6, '#3d6b2e'], [4, -12, 6, '#46782f'], [0, -16, 7, '#4f8636']]) { g.fillStyle = c; g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill(); }
}

    <div class="aoc-dev-grid">${ACTIONS.map(([c, label, note]) => `<button type="button" class="aoc-dev-act" data-dev="${c}"><b>${esc(label)}</b><span>${esc(note)}</span></button>`).join('')}</div>
    <h3 class="aoc-h4">Skip time</h3>
    <div class="aoc-chips">${SKIPS.map(([m, label]) => `<button type="button" class="aoc-btn ghost small" data-skip="${m}">${label}</button>`).join('')}</div>
    <p class="aoc-small aoc-muted">The 16x and 64x speeds sit with the other speeds at the top.</p>

U.devPanel = () => {
  if (!U.dev) return null;
  const sw = U.F?.devSw || { unlimited: false, instant: false };
  const h = U.sheet({
    title: 'Developer', body: panelHtml(sw),
    actions: [{ label: 'Developer mode off', kind: 'red', id: 'aoc-dev-off', onClick: async () => {
      await U.host.cmd({ type: 'dev:unlimited', on: false });
      await U.host.cmd({ type: 'dev:instant', on: false });

      U.toast('Developer mode off', 'info');

  });
  h.body.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.sw) {
      const on = b.getAttribute('aria-checked') !== 'true';
      b.disabled = true;
      const r = await U.run({ type: 'dev:' + b.dataset.sw, on });
      b.disabled = false;
      if (r) { b.setAttribute('aria-checked', on ? 'true' : 'false'); U.toast(`${b.querySelector('b').textContent} ${on ? 'on' : 'off'}.`, 'good'); }
    }
    if (b.dataset.dev) {
      b.disabled = true;
      const a = ACTIONS.find(x => x[0] === b.dataset.dev);
      await U.run({ type: b.dataset.dev, level: 25 }, a[3]);
      b.disabled = false;
    }
    if (b.dataset.skip) {
      b.disabled = true;
      await U.run({ type: 'dev:skip', minutes: Number(b.dataset.skip) }, `Skipped ${b.textContent.replace('+', '')}.`);
      b.disabled = false;
    }
  });
  return h;
};
} catch (e) { console.error('[build] conquest/ui-dev.js failed to load', e); }
})();

/* ===== conquest/ui-guide.js ===== */
;(function () {
'use strict';
try {
/* Age of Conquest guide: a short welcome, then a bouncing gold "Tap" marker that points at the next thing to tap for
   the current goal (the building, the button in its sheet, the map, the camp), instead of pages of instructions. */

const A = window.AOC;
const U = window.AOCUI;
const { esc } = U;

U.welcome = () => {
  const logo = U.LOGO;
  U.sheet({
    title: 'Your city stands',
    body: `<div class="aoc-welcome">${logo ? `<img src="${logo}" alt="" width="160" height="160">` : ''}
      <p class="aoc-p">Six hundred governors, ten guilds, one living world. Tap where the marker points, or Go on the goal at the bottom.</p></div>`,
    actions: [{ label: 'Begin', id: 'aoc-welcome-go', icon: 'play' }],

// ---------------------------------------------------------------- where the hand points
const BUILDING_GOAL = { hall2: 'hall', farm2: 'farm', warehouse: 'warehouse', train: 'barracks', research: 'academy', hall5: 'hall' };

const GUIDED = 9;
const G = { el: null, timer: 0, at: null, focused: '' };
function rectPoint(node) {
  if (!node || !node.isConnected) return null;

  let best = null, bd = Infinity;

  const q = f.quests[qi];

  const sheets = [...document.querySelectorAll('.aoc-sheet-wrap.is-open:not(.is-out)')];
  const sheet = sheets[sheets.length - 1];
  if (sheet) {
    if (sheet.querySelector('#aoc-welcome-go')) return null;
    const go = sheet.querySelector('#aoc-up-go:not(:disabled), #aoc-free:not(:disabled), #aoc-train-go, #aoc-march-go:not(:disabled), [data-tech]:not(:disabled), [data-claim]');
    if (go) return rectPoint(go);
    // a building sheet whose building does what the goal needs
    const bx = q.id === 'train' ? '[data-bx="train"]' : q.id === 'research' ? '[data-bx="research"]' : null;
    if (bx && sheet.querySelector(bx)) return rectPoint(sheet.querySelector(bx));
    const want = MAP_GOAL[q.id];
    if (want) { const b = [...sheet.querySelectorAll('.aoc-sheet-actions .aoc-btn')].find(x => x.textContent.trim().startsWith(want)); if (b) return rectPoint(b); }

    if (U.current !== 'city') return tab('city');
    const H = U.home;

    if (q.id === 'train' && P.q.train.inf) return null;
    if (q.id === 'research' && P.q.research) return null;
    if (q.id === 'research' && !(P.b.academy > 0) && P.b.hall < A.BUILDINGS.academy.needHall) return H.where('hall');
    const p = H.where(bld);
    const r = document.querySelector('.aoc-town-cv')?.getBoundingClientRect();
    if (p && r && (p.x < r.left + 20 || p.x > r.right - 20 || p.y < r.top + 20 || p.y > r.bottom - 20)) {
