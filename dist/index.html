<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Last Furnace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Keep the great furnace burning, grow a snowbound city, recruit heroes and push into the frozen wastes.">
<meta name="theme-color" content="#0b1626">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* ===== core.css ===== */
/* Last Furnace core styles.
   Layout: one phone-width column (HUD band, scrolling screen area, tab bar band) centered over a dark frost
   backdrop; sheets, popups and toasts float inside that column. One deliberate dark look: frost and ember. */
:root {
  color-scheme: dark;

  /* ground */
  --backdrop: #04080e;
  --backdrop-glow: #0d223c;
  --bg: #0a1524;
  --bg-2: #0e1d33;
  --bg-hi: #16324f;

  /* panels and cards (frosted navy) */
  --panel: #13283f;
  --panel-2: #1a3657;
  --panel-3: #23476f;
  --panel-deep: #0b192b;
  --card: #10223a;
  --card-2: #173252;
  --hud-top: #18375c;
  --hud-bot: #0f2440;
  --tab-top: #122a4b;
  --tab-bot: #09162a;

  /* hairlines and highlights */
  --line: rgba(143, 205, 255, 0.22);
  --line-soft: rgba(143, 205, 255, 0.12);
  --line-strong: rgba(170, 222, 255, 0.42);
  --white-a06: rgba(255, 255, 255, 0.06);
  --white-a12: rgba(255, 255, 255, 0.12);
  --white-a20: rgba(255, 255, 255, 0.2);
  --white-a35: rgba(255, 255, 255, 0.35);
  --white-a55: rgba(255, 255, 255, 0.55);
  --black-a15: rgba(0, 0, 0, 0.15);
  --black-a25: rgba(0, 0, 0, 0.25);
  --black-a40: rgba(0, 0, 0, 0.4);
  --black-a55: rgba(0, 0, 0, 0.55);
  --black-a70: rgba(0, 0, 0, 0.7);
  --scrim: rgba(2, 7, 14, 0.68);
  --track: rgba(2, 8, 16, 0.55);
  --chip-bg: rgba(3, 10, 20, 0.55);

  /* text */
  --text: #eef5fc;
  --text-2: #c3d4e6;
  --muted: #8ea6bf;
  --dim: #627a94;

  /* ice (highlight) */
  --ice: #8fd8ff;
  --ice-2: #52b6f0;
  --ice-3: #2b7fbf;
  --ice-glow: rgba(143, 216, 255, 0.35);

  /* buttons */
  --gold: #ffd862;
  --gold-2: #f3a72e;
  --gold-3: #9c5c0e;
  --gold-ink: #2c1a03;
  --green: #84e690;
  --green-2: #31b057;
  --green-3: #1b6a33;
  --green-ink: #05270e;
  --blue: #66bbff;
  --blue-2: #2d79d6;
  --blue-3: #174379;
  --blue-ink: #ffffff;
  --red: #ff4f4b;
  --red-2: #c9262a;
  --red-ink: #ffffff;

  /* furnace */
  --ember: #ff9a45;
  --ember-2: #ff5c1e;
  --ember-3: #9a2f08;
  --ember-glow: rgba(255, 140, 60, 0.4);

  /* state */
  --good: #86e997;
  --bad: #ff7a70;
  --warn: #ffc65c;

  /* rarity */
  --common: #7189a3;
  --common-hi: #3b5372;
  --common-lo: #1f3047;
  --rare: #4fa8ff;
  --rare-hi: #2f70bf;
  --rare-lo: #183c6d;
  --epic: #bd7cff;
  --epic-hi: #7b47c7;
  --epic-lo: #3d2170;
  --legendary: #ffbd45;
  --legendary-hi: #d88a1f;
  --legendary-lo: #713e0b;

  /* resource accents (for text) */
  --meat: #ec7d62;
  --wood: #ddb072;
  --coal: #aab3bf;
  --iron: #c4d2e0;
  --gem: #74e5ff;

  /* type */
  --font-display: "Lilita One", "Trebuchet MS", "Arial Rounded MT Bold", "Arial Black", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;

  /* shape */
  --r-sm: 6px;
  --r: 8px;
  --r-lg: 10px;
  --app-max: 480px;
}

/* ---------- base */
html {
  box-sizing: border-box;
  height: 100%;
  background: var(--backdrop);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background-color: var(--backdrop);
  background-image:
    radial-gradient(70% 45% at 50% 0%, var(--backdrop-glow), transparent 70%),
    radial-gradient(50% 35% at 50% 100%, var(--backdrop-glow), transparent 75%);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
/* paint the safe-area bands above the HUD and below the tab bar in their own colors */
body::before, body::after {
  content: "";
  position: fixed;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
}
body::before { top: 0; height: env(safe-area-inset-top, 0px); background: var(--hud-top); }
body::after { bottom: 0; height: env(safe-area-inset-bottom, 0px); background: var(--tab-bot); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:where(button, input, select, textarea, a, [tabindex]):focus-visible {
  outline: 2px solid var(--ice);
  outline-offset: 2px;
}
:where(button, input, select, textarea, a, [tabindex]):focus:not(:focus-visible) { outline: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { text-wrap: balance; }
svg.ico { display: inline-block; flex: none; vertical-align: middle; overflow: visible; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ---------- app column */
.app {
  position: relative;
  z-index: 1;
  height: 100%;
  width: 100%;
  max-width: var(--app-max);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  background-color: var(--bg);
  background-image:
    radial-gradient(130% 55% at 50% 0%, var(--bg-hi), transparent 62%),
    linear-gradient(180deg, var(--bg-2), var(--bg));
}
@media (min-width: 520px) {
  .app { box-shadow: 0 0 0 1px var(--line), 0 30px 90px var(--black-a70); }
}

/* ---------- HUD */
.hud {
  flex: none;
  position: relative;
  z-index: 5;
  background: linear-gradient(180deg, var(--hud-top), var(--hud-bot));
  border-bottom: 1px solid var(--line);
  box-shadow: 0 6px 16px var(--black-a40), inset 0 -1px 0 var(--white-a06);
}
.hud-inner {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px 7px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}
.hud-main { min-width: 0; display: grid; gap: 4px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.hud-avatar {
  position: relative;
  flex: none;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 2px solid var(--gold-2);
  border-radius: var(--r);
  background: var(--panel-2);
  box-shadow: 0 0 0 1px var(--black-a55), 0 3px 8px var(--black-a40), inset 0 1px 0 var(--white-a35);
}
.hud-avatar-img { display: block; width: 100%; height: 100%; border-radius: var(--r-sm); overflow: hidden; }
.hud-avatar-img svg { display: block; width: 100%; height: 100%; }
.hud-flv {
  position: absolute;
  right: -6px;
  bottom: -6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 20px;
  height: 17px;
  padding: 0 4px 0 2px;
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, var(--ember), var(--ember-2));
  border: 1.5px solid var(--ember-3);
  color: var(--gold-ink);
  font: 11px/1 var(--font-display);
  box-shadow: 0 2px 4px var(--black-a40);
}
.hud-power {
  position: relative;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  font: 16px/1 var(--font-display);
  letter-spacing: 0.01em;
  color: var(--text);
  text-shadow: 0 1px 0 var(--black-a70), 0 0 10px var(--black-a40);
  white-space: nowrap;
}
@media (max-width: 374px) {
  .hud-power { font-size: 15px; }
  .hud-inner { gap: 6px; }
}
.hud-power-label {
  font: 600 10px/1 var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  text-shadow: none;
}
.hud-power-float {
  position: absolute;
  left: 100%;
  top: -2px;
  margin-left: 6px;
  font: 14px/1 var(--font-display);
  color: var(--good);
  pointer-events: none;
  animation: hud-float 1.4s ease-out forwards;
}
@keyframes hud-float {
  from { opacity: 0; transform: translateY(6px); }
  20% { opacity: 1; }
  to { opacity: 0; transform: translateY(-12px); }
}
.hud-gems {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 3px 0 5px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--chip-bg);
  box-shadow: inset 0 1px 0 var(--white-a06);
  font: 14px/1 var(--font-display);
  color: var(--text);
}
.hud-gem-num { min-width: 2ch; text-align: right; }
.hud-plus {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--green), var(--green-2));
  color: var(--green-ink);
  box-shadow: inset 0 1px 0 var(--white-a55), 0 2px 0 var(--green-3);
}
.hud-iconbtn {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 38px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
  box-shadow: inset 0 1px 0 var(--white-a20), 0 2px 6px var(--black-a40);
}
.hud-res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.hud-res .res-chip { height: 22px; min-height: 22px; width: 100%; justify-content: flex-start; padding: 0 5px 0 2px; gap: 2px; font-size: 13px; }
.hud-res .res-chip .res-num { flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.hud-gems:active, .hud-iconbtn:active, .hud-avatar:active, .hud-res .res-chip:active { transform: translateY(1px); }

/* ---------- screens */
.screens { flex: 1 1 auto; min-height: 0; position: relative; }
.screen {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-3) transparent;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen.full-bleed { padding: 0; }

/* ---------- tab bar */
.tabbar {
  flex: none;
  position: relative;
  z-index: 5;
  background: linear-gradient(180deg, var(--tab-top), var(--tab-bot));
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 18px var(--black-a40), inset 0 1px 0 var(--white-a06);
}
.tabbar-inner {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 5px 6px;
  display: grid;
  grid-template-columns: repeat(var(--tabs, 5), minmax(0, 1fr));
  gap: 4px;
}
.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  min-height: 58px;
  padding: 6px 2px 5px;
  border: 0;
  border-radius: var(--r);
  background: transparent;
  color: var(--muted);
  font: 13px/1 var(--font-display);
  letter-spacing: 0.03em;
}
.tab-icon { position: relative; display: grid; place-items: center; width: 32px; height: 30px; transition: transform 0.15s ease; }
.tab-icon svg { filter: saturate(0.35) brightness(0.8); transition: filter 0.15s ease; }
.tab-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-current="page"] {
  color: var(--text);
  background: linear-gradient(180deg, var(--ice-glow), transparent);
  box-shadow: inset 0 1px 0 var(--line-strong), inset 0 0 0 1px var(--line-soft);
}
.tab[aria-current="page"] .tab-icon { transform: translateY(-2px) scale(1.12); }
.tab[aria-current="page"] .tab-icon svg { filter: drop-shadow(0 2px 3px var(--black-a55)); }
.tab[aria-current="page"]::after {
  content: "";
  position: absolute;
  left: 30%;
  right: 30%;
  bottom: 1px;
  height: 3px;
  border-radius: 3px;
  background: var(--ice);
  box-shadow: 0 0 8px var(--ice-glow);
}
.tab .badge-dot { position: absolute; top: -3px; right: -6px; }

/* ---------- badge dot */
.badge-dot {
  display: inline-grid;
  place-items: center;
  min-width: 12px;
  height: 12px;
  padding: 0;
  border-radius: 999px;
  background: var(--red);
  border: 2px solid var(--panel-deep);
  color: var(--red-ink);
  font: 10px/1 var(--font-display);
  box-shadow: 0 1px 3px var(--black-a55);
  pointer-events: none;
}
.badge-dot.has-count { min-width: 18px; height: 18px; padding: 0 4px; }
.badge-dot[hidden] { display: none !important; }

/* ---------- buttons */
.btn {
  --btn-hi: var(--blue);
  --btn-lo: var(--blue-2);
  --btn-edge: var(--blue-3);
  --btn-ink: var(--blue-ink);
  --btn-shade: var(--black-a40);
  appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  margin-bottom: 3px;
  padding: 8px 16px;
  border: 0;
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--btn-hi), var(--btn-lo));
  color: var(--btn-ink);
  font: 16px/1.05 var(--font-display);
  letter-spacing: 0.02em;
  text-align: center;
  text-shadow: 0 1px 0 var(--btn-shade);
  white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--white-a55), inset 0 -2px 0 var(--black-a15), 0 3px 0 var(--btn-edge), 0 5px 10px var(--black-a40);
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s ease;
}
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: inset 0 1px 0 var(--white-a35), inset 0 -1px 0 var(--black-a15), 0 1px 0 var(--btn-edge), 0 2px 4px var(--black-a40);
}
.btn:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
.btn.gold { --btn-hi: var(--gold); --btn-lo: var(--gold-2); --btn-edge: var(--gold-3); --btn-ink: var(--gold-ink); --btn-shade: var(--white-a35); }
.btn.green { --btn-hi: var(--green); --btn-lo: var(--green-2); --btn-edge: var(--green-3); --btn-ink: var(--green-ink); --btn-shade: var(--white-a35); }
.btn.blue { --btn-hi: var(--blue); --btn-lo: var(--blue-2); --btn-edge: var(--blue-3); --btn-ink: var(--blue-ink); --btn-shade: var(--black-a40); }
.btn.red { --btn-hi: var(--red); --btn-lo: var(--red-2); --btn-edge: var(--ember-3); --btn-ink: var(--red-ink); --btn-shade: var(--black-a40); }
.btn.ghost {
  background: var(--white-a06);
  color: var(--text);
  text-shadow: none;
  margin-bottom: 0;
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.btn.ghost:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 0 0 1px var(--line-strong); background: var(--white-a12); }
.btn.small { min-height: 32px; padding: 5px 12px; font-size: 14px; border-radius: 7px; gap: 4px; }
.btn.wide { display: flex; width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] {
  cursor: not-allowed;
  filter: grayscale(0.85) brightness(0.72);
}
.btn .btn-cost { display: inline-flex; align-items: center; gap: 3px; }
.btn .btn-sub { display: block; font: 600 11px/1.1 var(--font-body); letter-spacing: 0; opacity: 0.85; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--white-a06);
  color: var(--text);
}
.icon-btn:active { background: var(--white-a12); }

/* ---------- panels and cards */
.panel {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  box-shadow: inset 0 1px 0 var(--white-a12), inset 0 0 0 1px var(--white-a06), 0 6px 18px var(--black-a40);
  padding: 12px;
}
.card {
  position: relative;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--card-2), var(--card));
  box-shadow: inset 0 1px 0 var(--white-a06);
  padding: 10px;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 8px;
  font: 15px/1.1 var(--font-display);
  letter-spacing: 0.04em;
  color: var(--ice);
  text-transform: uppercase;
}
.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.title-font { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; }
.good-text { color: var(--good); }
.bad-text { color: var(--bad); }

/* ---------- progress */
.progress {
  position: relative;
  height: 12px;
  border-radius: var(--r-sm);
  background: var(--track);
  box-shadow: inset 0 1px 2px var(--black-a55), 0 1px 0 var(--white-a06);
  overflow: hidden;
}
.progress > .bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--ice), var(--ice-2));
  box-shadow: inset 0 1px 0 var(--white-a55);
  transition: width 0.3s linear;
}
.progress.green > .bar { background: linear-gradient(180deg, var(--green), var(--green-2)); }
.progress.gold > .bar { background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
.progress.ember > .bar { background: linear-gradient(180deg, var(--ember), var(--ember-2)); }
.progress > .progress-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 11px/1 var(--font-display);
  color: var(--text);
  text-shadow: 0 1px 1px var(--black-a70);
}

/* ---------- chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 24px;
  padding: 2px 8px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  background: var(--chip-bg);
  color: var(--text);
  font: 13px/1 var(--font-display);
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.res-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  min-height: 24px;
  padding: 2px 8px 2px 3px;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--chip-bg);
  box-shadow: inset 0 1px 0 var(--white-a06);
  color: var(--text);
  font: 14px/1 var(--font-display);
  white-space: nowrap;
}
button.res-chip { cursor: pointer; }
.res-chip.short, .chip.short { color: var(--bad); border-color: var(--bad); }
.cost-list { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- rarity frames (use on tiles and cards; sets --rarity and --rarity-bg) */
.rarity-common { --rarity: var(--common); --rarity-hi: var(--common-hi); --rarity-lo: var(--common-lo); }
.rarity-rare { --rarity: var(--rare); --rarity-hi: var(--rare-hi); --rarity-lo: var(--rare-lo); }
.rarity-epic { --rarity: var(--epic); --rarity-hi: var(--epic-hi); --rarity-lo: var(--epic-lo); }
.rarity-legendary { --rarity: var(--legendary); --rarity-hi: var(--legendary-hi); --rarity-lo: var(--legendary-lo); }
.rarity-common, .rarity-rare, .rarity-epic, .rarity-legendary {
  --rarity-bg: linear-gradient(180deg, var(--rarity-hi), var(--rarity-lo));
  border-color: var(--rarity);
}
.tile.rarity-common, .tile.rarity-rare, .tile.rarity-epic, .tile.rarity-legendary,
.card.rarity-common, .card.rarity-rare, .card.rarity-epic, .card.rarity-legendary { background: var(--rarity-bg); }
.rarity-text { color: var(--rarity, var(--text)); }

/* ---------- item tile (zero-specificity defaults so any .rarity-* class wins) */
:where(.tile) {
  --rarity: var(--common);
  --rarity-hi: var(--common-hi);
  --rarity-lo: var(--common-lo);
}
.tile {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  max-width: 100%;
  padding: 0;
  border: 1.5px solid var(--rarity);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--rarity-hi), var(--rarity-lo));
  box-shadow: inset 0 1px 0 var(--white-a35), inset 0 -10px 16px var(--black-a25), 0 2px 5px var(--black-a40);
  color: var(--text);
}
.tile svg { width: 58%; height: 58%; filter: drop-shadow(0 2px 2px var(--black-a40)); }
.tile .tile-count {
  position: absolute;
  right: 4px;
  bottom: 3px;
  font: 13px/1 var(--font-display);
  color: var(--text);
  text-shadow: 0 0 2px var(--black-a70), 0 1px 0 var(--black-a70), 1px 0 0 var(--black-a70), -1px 0 0 var(--black-a70);
}
button.tile[aria-pressed="true"] { outline: 2px solid var(--ice); outline-offset: 2px; }

/* ---------- segmented control */
.seg {
  display: flex;
  gap: 4px;
  padding: 3px;
  overflow-x: auto;
  scrollbar-width: none;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: var(--chip-bg);
}
.seg::-webkit-scrollbar { display: none; }
.seg > button {
  flex: 1 0 auto;
  min-height: 32px;
  padding: 4px 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--muted);
  font: 13px/1 var(--font-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.seg > button[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
  color: var(--text);
  box-shadow: inset 0 1px 0 var(--white-a20), 0 1px 3px var(--black-a40);
}

/* ---------- overlay layer */
.ui-layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.ui-layer > * { pointer-events: auto; }

/* ---------- sheets */
.sheet-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.sheet-wrap.closing { pointer-events: none; }
.sheet-scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.sheet {
  position: relative;
  display: flex;
  flex-direction: column;
  max-height: 88%;
  min-height: 0;
  border-top: 1px solid var(--line-strong);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: linear-gradient(180deg, var(--panel-2), var(--panel) 120px, var(--bg-2));
  box-shadow: 0 -12px 32px var(--black-a55), inset 0 1px 0 var(--white-a20);
  transform: translateY(102%);
  transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
  outline: none;
}
.sheet::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 50%;
  width: 40px;
  height: 4px;
  margin-left: -20px;
  border-radius: 4px;
  background: var(--line-strong);
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-scrim { opacity: 1; }
.sheet-head {
  flex: none;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 38px;
  align-items: center;
  gap: 6px;
  padding-block: 16px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-title {
  grid-column: 2;
  text-align: center;
  font: 21px/1.1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--text);
  text-shadow: 0 2px 0 var(--black-a40);
}
.sheet-close {
  grid-column: 3;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--white-a06);
  color: var(--text-2);
}
.sheet-close:active { background: var(--white-a12); }
.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-block: 4px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: thin;
  scrollbar-color: var(--panel-3) transparent;
}
.sheet-actions {
  flex: none;
  display: flex;
  gap: 10px;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line-soft);
  background: var(--black-a25);
}
.sheet-actions .btn { flex: 1 1 0; min-width: 0; }
.confirm-msg { color: var(--text-2); line-height: 1.5; text-align: center; padding-block: 4px 8px; }

/* ---------- toasts */
.toast-host {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--hud-h, 100px) + 10px);
  z-index: 900;
  display: grid;
  justify-items: center;
  gap: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none !important;
}
.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 9px 14px 9px 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
  box-shadow: 0 8px 20px var(--black-a55), inset 0 1px 0 var(--white-a20);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.25;
  animation: toast-in 0.2s ease-out;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.out { opacity: 0; transform: translateY(-6px); }
.toast-icon { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: var(--r-sm); background: var(--ice-3); color: var(--blue-ink); }
.toast-good { border-color: var(--green-2); }
.toast-good .toast-icon { background: var(--green-2); color: var(--green-ink); }
.toast-bad { border-color: var(--red-2); }
.toast-bad .toast-icon { background: var(--red-2); color: var(--red-ink); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: none; } }

/* ---------- reward popup */
.reward-wrap {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.reward-wrap .sheet-scrim { opacity: 1; background: var(--scrim); }
.reward-card {
  position: relative;
  width: 100%;
  max-width: 360px;
  max-height: 86%;
  display: flex;
  flex-direction: column;
  padding: 30px 16px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--panel-3), var(--panel) 60%, var(--bg-2));
  box-shadow: 0 20px 50px var(--black-a70), inset 0 1px 0 var(--white-a35);
  animation: reward-in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  outline: none;
}
.reward-rays {
  position: absolute;
  left: 50%;
  top: 0;
  width: 320px;
  height: 320px;
  margin: -160px 0 0 -160px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--ice-glow) 0deg 10deg, transparent 10deg 30deg);
  -webkit-mask: radial-gradient(circle, var(--black-a70) 0 30%, transparent 68%);
  mask: radial-gradient(circle, var(--black-a70) 0 30%, transparent 68%);
  animation: reward-spin 18s linear infinite;
  pointer-events: none;
}
.reward-title {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translate(-50%, -50%);
  padding: 8px 26px;
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  box-shadow: 0 3px 0 var(--gold-3), 0 6px 14px var(--black-a55), inset 0 1px 0 var(--white-a55);
  color: var(--gold-ink);
  font: 21px/1 var(--font-display);
  letter-spacing: 0.03em;
  white-space: nowrap;
  text-shadow: 0 1px 0 var(--white-a35);
}
.reward-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 12px 10px;
  overflow-y: auto;
  padding: 6px 2px 4px;
  min-height: 0;
}
.reward-item { display: grid; justify-items: center; gap: 4px; min-width: 0; }
.reward-item .tile { width: 64px; }
.reward-name {
  max-width: 100%;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--text-2);
  text-align: center;
}
.reward-card .btn { margin-top: 14px; }
@keyframes reward-in { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
@keyframes reward-spin { to { transform: rotate(360deg); } }

/* ---------- bag */
.bag { display: grid; gap: 12px; }
.bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.bag-empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.bag-detail { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.bag-detail .tile { width: 64px; }
.bag-detail-name { font: 18px/1.1 var(--font-display); letter-spacing: 0.01em; }
.bag-detail-owned { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bag-detail-desc { font-size: 14px; color: var(--text-2); margin-top: 6px; line-height: 1.4; }
.bag-use { grid-column: 1 / -1; display: grid; gap: 10px; }
.bag-qty { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px auto; align-items: center; gap: 8px; }
.bag-qty input[type="range"] { width: 100%; accent-color: var(--ice-2); }
.bag-qty-num { min-width: 3ch; text-align: right; font: 16px/1 var(--font-display); }
.bag-actions { display: flex; gap: 8px; }
.bag-actions .btn { flex: 1 1 0; }
.bag-hint { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

/* ---------- speed up */
.spd { display: grid; gap: 12px; }
.spd-head { display: grid; gap: 8px; }
.spd-label { font-weight: 600; color: var(--text-2); font-size: 14px; }
.spd-time { display: flex; align-items: center; gap: 8px; font: 26px/1 var(--font-display); color: var(--text); }
.spd-time .ico { color: var(--ice); }
.spd-hint { font-size: 13px; color: var(--muted); }
.spd-list { display: grid; gap: 8px; }
.spd-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; }
.spd-row .tile { width: 48px; }
.spd-name { font: 15px/1.15 var(--font-display); letter-spacing: 0.01em; }
.spd-owned { font-size: 13px; color: var(--muted); }
.spd-btns { display: flex; gap: 6px; }
.spd-row.is-empty { opacity: 0.55; }
.spd-none { padding: 12px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- resource and missing sheets */
.rsheet { display: grid; gap: 12px; }
.rsheet-top { display: flex; align-items: center; gap: 12px; }
.rsheet-top .tile { width: 64px; flex: none; }
.rsheet-amount { font: 28px/1 var(--font-display); }
.rsheet-desc { font-size: 14px; color: var(--text-2); margin-top: 4px; }
.rsheet-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; }
.rsheet-row .tile { width: 48px; }
.rsheet-row-name { font: 15px/1.15 var(--font-display); }
.rsheet-row-sub { font-size: 13px; color: var(--muted); }
.rsheet-row-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- reduced motion: no ambient or decorative motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .reward-rays { animation: none !important; }
}

/* ===== modules/city.css ===== */
/* Last Furnace city module (owner: city agent): the town view, its overlay chrome and the building sheets. */

/* ---------- town view */
.city-root {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--bg-2);
}
.city-view {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
.city-view.is-dragging { cursor: grabbing; }
.city-canvas { position: absolute; left: 0; top: 0; display: block; }
.city-world {
  position: absolute;
  left: 0;
  top: 0;
  width: 600px;
  height: 900px;
  transform-origin: 0 0;
  will-change: transform;
}
.city-hits, .city-wui { position: absolute; inset: 0; }
.city-wui { pointer-events: none; }
.city-hit {
  position: absolute;
  padding: 0;
  border: 0;
  border-radius: var(--r-lg);
  background: transparent;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.city-hit:focus-visible {
  outline: 3px solid var(--ice);
  outline-offset: -3px;
  background: var(--ice-glow);
}
.city-bui { position: absolute; width: 0; height: 0; }

/* level plate under each building */
.city-plate {
  position: absolute;
  left: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  height: 21px;
  padding: 0 7px 0 2px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, var(--panel-2), var(--panel-deep));
  box-shadow: 0 2px 5px var(--black-a40), inset 0 1px 0 var(--white-a12);
  color: var(--text);
  font: 12px/1 var(--font-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.city-plate-lv {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 17px;
  height: 17px;
  padding: 0 3px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  box-shadow: inset 0 1px 0 var(--white-a55);
  color: var(--gold-ink);
  font: 12px/1 var(--font-display);
}
.city-plate.is-build { border-color: var(--green-2); }
.city-plate.is-build .city-plate-lv { background: linear-gradient(180deg, var(--green), var(--green-2)); color: var(--green-ink); }
.city-plate.is-locked { color: var(--muted); border-color: var(--line); }
.city-plate.is-locked .city-plate-lv { background: var(--panel-3); color: var(--text-2); box-shadow: none; }

/* upgrade-ready arrow */
.city-up {
  position: absolute;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin-left: -14px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, var(--green), var(--green-2));
  border: 2px solid var(--green-ink);
  box-shadow: 0 3px 6px var(--black-a40), inset 0 1px 0 var(--white-a55);
  color: var(--green-ink);
  animation: city-bounce 1.1s ease-in-out infinite;
}

/* build timer over a building (tap to speed up) */
.city-timer {
  position: absolute;
  left: 0;
  transform: translate(-50%, -100%);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 78px;
  height: 28px;
  padding: 0 9px 3px 5px;
  border: 1px solid var(--gold-3);
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, var(--panel-2), var(--panel-deep));
  box-shadow: 0 3px 8px var(--black-a55), inset 0 1px 0 var(--white-a12);
  color: var(--text);
  font: 13px/1 var(--font-display);
  white-space: nowrap;
  overflow: hidden;
  touch-action: none;
}
.city-timer-ico { display: grid; place-items: center; }
.city-timer-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--track); }
.city-timer-bar i { display: block; height: 100%; width: 0; background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
.city-timer.is-free { border-color: var(--green-ink); background: linear-gradient(180deg, var(--green), var(--green-2)); color: var(--green-ink); }
.city-timer.is-free .city-timer-bar { display: none; }
.city-timer:focus-visible, .city-bubble:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

/* collect bubble */
.city-bubble {
  position: absolute;
  left: 0;
  transform: translate(-50%, -100%);
  pointer-events: auto;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 2px solid var(--ice-2);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, var(--text), var(--text-2) 75%);
  box-shadow: 0 4px 10px var(--black-a40), inset 0 -3px 0 var(--black-a15);
  touch-action: none;
  animation: city-bob 1.8s ease-in-out infinite;
}
.city-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  margin-left: -6px;
  border: 6px solid transparent;
  border-top-color: var(--ice-2);
  border-bottom-width: 0;
}
.city-bubble svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 1px var(--black-a40)); }
.city-bubble.is-full { border-color: var(--gold-2); box-shadow: 0 0 0 3px var(--ember-glow), 0 4px 10px var(--black-a40); }
.city-bubble.is-full::after { border-top-color: var(--gold-2); }

/* first-steps pointer */
.city-tap {
  position: absolute;
  left: 0;
  transform: translate(-50%, -100%);
  display: grid;
  justify-items: center;
  gap: 0;
  color: var(--gold);
  filter: drop-shadow(0 2px 2px var(--black-a70));
  animation: city-bounce 0.9s ease-in-out infinite;
}
.city-tap-t {
  padding: 3px 9px;
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  color: var(--gold-ink);
  font: 14px/1 var(--font-display);
}

/* floating feedback (+123, Lv 4) */
.city-float {
  position: absolute;
  transform: translate(-50%, -100%);
  display: flex;
  align-items: center;
  gap: 3px;
  color: var(--text);
  font: 18px/1 var(--font-display);
  white-space: nowrap;
  text-shadow: 0 1px 0 var(--black-a70), 0 0 6px var(--black-a55), 1px 0 0 var(--black-a55), -1px 0 0 var(--black-a55);
  animation: city-float 1.35s ease-out forwards;
}
.city-float.is-level { color: var(--gold); font-size: 22px; }
.city-float.is-small { font-size: 14px; color: var(--good); }

@keyframes city-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@keyframes city-bounce { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
@keyframes city-float {
  0% { opacity: 0; margin-top: 6px; }
  15% { opacity: 1; margin-top: 0; }
  70% { opacity: 1; }
  100% { opacity: 0; margin-top: -26px; }
}
@media (prefers-reduced-motion: reduce) {
  .city-float { animation: none !important; }
}

/* ---------- overlay chrome on top of the town */
.city-over {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.city-top { flex: none; display: grid; gap: 6px; pointer-events: none; }
.city-top > * { pointer-events: auto; }
.city-temp {
  padding: 7px 10px 6px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--panel);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 92%, transparent), color-mix(in srgb, var(--panel-deep) 90%, transparent));
  box-shadow: inset 0 1px 0 var(--white-a12), 0 6px 16px var(--black-a40);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.city-t-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.city-t-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.city-t-ico { display: grid; place-items: center; flex: none; }
.city-t-txt { display: grid; gap: 2px; min-width: 0; }
.city-t-lbl {
  font: 600 10px/1 var(--font-body);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.city-t-val {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  font: 17px/1.05 var(--font-display);
  color: var(--text);
  white-space: nowrap;
}
.city-t-coal.is-bad .city-t-val { color: var(--bad); }
.city-comfort {
  padding: 2px 5px 1px;
  border-radius: 4px;
  font: 11px/1.1 var(--font-display);
  letter-spacing: 0.02em;
  background: var(--panel-3);
  color: var(--text);
}
.city-comfort.is-warm { background: linear-gradient(180deg, var(--ember), var(--ember-2)); color: var(--gold-ink); }
.city-comfort.is-chilly { background: var(--ice-3); color: var(--text); }
.city-comfort.is-cold { background: var(--blue-2); color: var(--blue-ink); }
.city-comfort.is-freezing { background: var(--red-2); color: var(--red-ink); }
.city-t-row2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--line-soft);
}
.city-t-flbl { display: inline-flex; align-items: center; gap: 5px; font: 14px/1 var(--font-display); color: var(--text-2); }
.city-mode { flex: none; padding: 2px; gap: 2px; }
.city-mode > button { min-height: 28px; padding: 3px 11px; font-size: 13px; }
.city-mode > button[data-mode="on"][aria-pressed="true"] { background: linear-gradient(180deg, var(--ember), var(--ember-2)); color: var(--gold-ink); }
.city-mode > button[data-mode="over"][aria-pressed="true"] { background: linear-gradient(180deg, var(--gold), var(--ember-2)); color: var(--gold-ink); box-shadow: 0 0 10px var(--ember-glow), inset 0 1px 0 var(--white-a55); }
.city-mode > button[data-mode="off"][aria-pressed="true"] { background: var(--panel-3); color: var(--text); }

.city-poprow { display: flex; gap: 6px; align-items: center; }
.city-pop {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 34px;
  padding: 0 10px 0 6px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel-deep);
  background: color-mix(in srgb, var(--panel-deep) 86%, transparent);
  box-shadow: inset 0 1px 0 var(--white-a06), 0 4px 10px var(--black-a25);
  color: var(--text);
  font: 15px/1 var(--font-display);
  overflow: hidden;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.city-pop-i { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.city-pop-w { font: 600 11px/1 var(--font-body); color: var(--muted); }
.city-pop-sick.is-bad { color: var(--bad); }
.city-pop-idle { color: var(--text); }
.city-pop-idle .ico { color: var(--muted); }
.city-pop-idle.is-warn { color: var(--warn); }
.city-pop-idle.is-warn .ico { color: var(--warn); }
.city-auto { flex: none; margin-bottom: 3px; }
.city-auto .badge-dot { position: absolute; top: -4px; right: -4px; }
@media (max-width: 400px) {
  .city-pop-i:nth-child(2) .city-pop-w { display: none; }
  .city-pop { gap: 8px; }
}
.city-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 4px 6px 4px 10px;
  border: 1px solid var(--red);
  border-radius: var(--r);
  background: var(--red-2);
  background: color-mix(in srgb, var(--red-2) 88%, transparent);
  box-shadow: 0 4px 12px var(--black-a40);
  color: var(--red-ink);
  font-weight: 700;
  font-size: 13px;
}
.city-alert[hidden] { display: none; }
.city-alert-t { flex: 1 1 auto; min-width: 0; }
.city-alert-btn { flex: none; margin-bottom: 2px; }

.city-mid {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  padding-top: 8px;
  pointer-events: none;
}
.city-left { display: grid; gap: 6px; justify-items: start; pointer-events: none; }
.city-left > * { pointer-events: auto; }
.city-builder {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 88px;
  height: 32px;
  padding: 0 10px 2px 7px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel-deep);
  background: color-mix(in srgb, var(--panel-deep) 86%, transparent);
  box-shadow: inset 0 1px 0 var(--white-a06), 0 4px 10px var(--black-a25);
  color: var(--text);
  overflow: hidden;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.city-builder-time { font: 14px/1 var(--font-display); letter-spacing: 0.01em; color: var(--text); white-space: nowrap; }
.city-builder-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--track); }
.city-builder-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), var(--gold)); }
.city-builder.is-idle { border-color: var(--green-2); }
.city-builder.is-idle .city-builder-time { color: var(--green); }
.city-builder.is-free { border-color: var(--green-2); background: linear-gradient(180deg, var(--green), var(--green-2)); color: var(--green-ink); }
.city-builder.is-free .city-builder-time { color: var(--green-ink); }
.city-builder.is-free .city-builder-bar { display: none; }
.city-builder.is-locked { color: var(--muted); }
.city-builder.is-locked .city-builder-time { color: var(--muted); font-size: 13px; }
.city-builder:active { transform: translateY(1px); }

/* side buttons sit in a row at the top right, like event icons in mobile games, so they stay clear of the
   building labels lower down; extra buttons wrap onto a second row on narrow phones */
.city-side {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-content: flex-start;
  gap: 4px 6px;
  pointer-events: none;
}
.city-side > * { pointer-events: auto; }
.city-sidebtn {
  display: grid;
  justify-items: center;
  gap: 2px;
  width: 48px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font: 10.5px/1.05 var(--font-display);
  letter-spacing: 0.02em;
}
.city-sidebtn-ico {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--panel-3), var(--panel-deep));
  box-shadow: inset 0 1px 0 var(--white-a20), 0 4px 10px var(--black-a40);
}
.city-sidebtn-ico .badge-dot { position: absolute; top: -4px; right: -4px; }
.city-sidebtn-lbl {
  max-width: 52px;
  padding: 1px 4px 2px;
  border-radius: 4px;
  background: var(--black-a55);
  text-align: center;
  text-shadow: 0 1px 0 var(--black-a70), 0 0 4px var(--black-a70), 1px 0 0 var(--black-a55), -1px 0 0 var(--black-a55);
}
.city-sidebtn:active .city-sidebtn-ico { transform: translateY(1px); }

.city-bottom { flex: none; padding-bottom: 10px; pointer-events: none; }
.city-banner { pointer-events: auto; }
.city-banner[hidden] { display: none; }

/* ---------- building sheet */
.city-sheet { display: grid; gap: 12px; }
.city-sh-top { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; }
.city-thumb-wrap {
  width: 120px;
  height: 104px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--panel-deep);
  box-shadow: inset 0 1px 0 var(--white-a12);
  overflow: hidden;
}
.city-thumb { display: block; width: 120px; height: 104px; }
.city-sh-info { min-width: 0; }
.city-sh-lv { display: flex; align-items: center; gap: 4px; font: 25px/1 var(--font-display); letter-spacing: 0.01em; }
.city-lv-arrow { display: grid; place-items: center; color: var(--muted); }
.city-lv-arrow[hidden], .city-lv-next[hidden] { display: none; }
.city-lv-next { color: var(--good); }
.city-sh-desc { margin-top: 6px; font-size: 13.5px; line-height: 1.4; color: var(--text-2); }
.city-sh-prog { display: grid; gap: 8px; padding: 10px 12px; }
.city-sh-prog-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 15px/1.1 var(--font-display); }
.city-sh-prog-time { display: inline-flex; align-items: center; gap: 5px; }
.city-sh-prog-time .ico { color: var(--ice); }
.city-sh-store-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 8px; }
.city-sh-store-amt { font: 19px/1.1 var(--font-display); }
.city-sh-store-rate { font-size: 13px; }
.city-sh-work-row, .city-sh-fur-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.city-sh-work-lbl { font: 15px/1.15 var(--font-display); letter-spacing: 0.01em; }
.city-sh-work-sub { font-size: 12.5px; margin-top: 2px; }
.city-stepper { display: flex; align-items: center; gap: 8px; flex: none; }
.city-stepper .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.city-stepper-n { min-width: 46px; text-align: center; font: 19px/1 var(--font-display); }
.city-sh-fur-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; color: var(--text-2); }
.city-sh-fur-stats b { font: 14px/1 var(--font-display); font-weight: 400; color: var(--text); }
.city-sh-note { font-size: 13px; line-height: 1.4; color: var(--text-2); }
.city-sh-fur .city-sh-note { margin-top: 8px; }
.city-sh-inf { font-size: 14px; color: var(--text-2); }
.city-sh-sec[hidden] { display: none; }
.city-sh-sec .section-title { margin-top: 0; }
.city-effects { display: grid; padding: 2px 12px; }
.city-eff-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
}
.city-eff-row:last-child { border-bottom: 0; }
.city-eff-lbl { color: var(--text-2); }
.city-eff-val { display: inline-flex; align-items: center; gap: 4px; font: 15px/1.1 var(--font-display); text-align: right; }
.city-eff-val .ico { color: var(--muted); }
.city-reqs { display: grid; gap: 6px; }
.city-req { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; font-size: 14px; }
.city-req-ico { display: grid; place-items: center; color: var(--bad); }
.city-req.is-met .city-req-ico { color: var(--good); }
.city-req-txt b { font-family: var(--font-display); font-weight: 400; }
.city-cost-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.city-time { height: 28px; font-size: 14px; }
.city-time .ico { color: var(--ice); }
.city-extra-row { display: flex; flex-wrap: wrap; gap: 8px; }
.city-extra-row .btn { flex: 1 1 auto; }

/* builders busy */
.city-busy { display: grid; gap: 10px; }
.city-busy-list { display: grid; gap: 8px; }
.city-busy-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.city-busy-txt { display: grid; gap: 6px; min-width: 0; }
.city-busy-row .btn { min-width: 84px; }
.city-busy-vip { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.city-busy-sub { font-size: 13px; margin-top: 2px; }

/* survivors */
.city-surv { display: grid; gap: 12px; }
.city-surv-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.city-stat { display: grid; justify-items: center; gap: 3px; padding: 9px 4px; }
.city-stat-n { font: 20px/1 var(--font-display); }
.city-stat-l { font: 600 11px/1 var(--font-body); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.city-cond { display: grid; gap: 10px; }
.city-cond-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; line-height: 1.35; color: var(--text-2); }
.city-cond-row .btn[hidden] { display: none; }
.city-surv-work { display: grid; gap: 6px; }
.city-wrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; }
.city-wrow-txt { min-width: 0; }
.city-wrow-rate { font-size: 12.5px; margin-top: 2px; }

/* ===== modules/military.css ===== */
/* Last Furnace military module styles (owner: military agent).
   Heroes roster, recruit, squad, troops, hero/training/reveal/battle sheets and the Explore screen.
   Every class is prefixed .mil- and every color comes from a core token. */

/* ---------------------------------------------------------------- shared pieces */
.mil-heroes, .mil-explore { display: grid; gap: 10px; }
.mil-view { display: grid; gap: 10px; align-content: start; }
.mil-view[hidden] { display: none; }
.mil-hint { font-size: 13px; line-height: 1.45; color: var(--muted); }

.mil-subtabs > button { position: relative; flex: 1 1 0; }
.mil-subtabs .badge-dot { position: absolute; top: 3px; right: 5px; }

.mil-por {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: radial-gradient(110% 90% at 50% 26%, var(--rarity-hi), var(--rarity-lo) 72%, var(--panel-deep));
  box-shadow: inset 0 0 0 1px var(--black-a25), inset 0 -12px 18px var(--black-a25);
}
.mil-por > svg { display: block; width: 100%; height: 100%; }
.mil-por.is-dim > svg { filter: grayscale(0.9) brightness(0.55); }

.mil-cls {
  position: absolute;
  top: 5px;
  right: 5px;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--panel-deep);
  border: 1.5px solid var(--rarity, var(--line-strong));
  box-shadow: 0 1px 3px var(--black-a55);
}
.mil-lv {
  position: absolute;
  top: 6px;
  left: 6px;
  z-index: 2;
  padding: 3px 5px 2px;
  border-radius: 5px;
  background: var(--black-a55);
  color: var(--text);
  font: 12px/1 var(--font-display);
  letter-spacing: 0.02em;
}
.mil-stars { display: inline-flex; align-items: center; gap: 1px; }
.mil-star { display: inline-grid; line-height: 0; }
.mil-star:not(.on) svg { filter: grayscale(1) brightness(0.42); opacity: 0.8; }

.mil-tierchip {
  display: inline-grid;
  place-items: center;
  min-width: 26px;
  height: 18px;
  padding: 0 5px;
  border-radius: 5px;
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  color: var(--gold-ink);
  font: 12px/1 var(--font-display);
  box-shadow: 0 1px 2px var(--black-a55), inset 0 1px 0 var(--white-a55);
}
.mil-tilepor { display: block; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; }
.tile .mil-tilepor svg { width: 100%; height: 100%; filter: none; }

/* ---------------------------------------------------------------- roster */
.mil-rhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mil-rcount { display: flex; align-items: baseline; gap: 6px; }
.mil-rcount-n { font: 26px/1 var(--font-display); color: var(--text); }
.mil-rcount-of { font-size: 14px; font-weight: 600; color: var(--muted); }
.mil-bookchip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 11px 0 7px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--chip-bg);
  box-shadow: inset 0 1px 0 var(--white-a06);
  color: var(--text);
  font: 15px/1 var(--font-display);
}
.mil-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mil-hcard, .mil-slot {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 3px 3px 0;
  border: 2px solid var(--rarity, var(--line));
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--rarity-hi, var(--panel-3)), var(--rarity-lo, var(--panel-deep)));
  box-shadow: inset 0 1px 0 var(--white-a35), 0 3px 8px var(--black-a40);
  color: var(--text);
  text-align: center;
  font: inherit;
  transition: transform 0.08s ease;
}
.mil-hcard:active, .mil-slot:active { transform: translateY(1px) scale(0.985); }
.mil-hcard-por { position: relative; display: block; }
.mil-hname, .mil-slot-name {
  display: block;
  padding: 5px 2px 6px;
  font: 14px/1.05 var(--font-display);
  letter-spacing: 0.02em;
  text-shadow: 0 1px 0 var(--black-a55);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mil-hcard .mil-stars, .mil-slot .mil-stars {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 28px;
  z-index: 2;
  justify-content: center;
  pointer-events: none;
  filter: drop-shadow(0 1px 1px var(--black-a70));
}
.mil-hcard > .badge-dot { position: absolute; top: -5px; right: -5px; z-index: 3; }
.mil-hcard.is-locked { box-shadow: inset 0 1px 0 var(--white-a12), 0 3px 8px var(--black-a40); }
.mil-hcard.is-locked .mil-por > svg { filter: grayscale(0.92) brightness(0.5); }
.mil-hcard.is-locked .mil-hname { color: var(--text-2); }
.mil-lockico {
  position: absolute;
  left: 50%;
  top: 42%;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  border-radius: 50%;
  background: var(--black-a55);
  color: var(--text-2);
}
.mil-shardline {
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 30px;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px;
}
.mil-shardline .progress { display: block; height: 7px; }
.mil-shardline .bar { display: block; }
.mil-shardnum { font: 11px/1 var(--font-display); color: var(--text); text-shadow: 0 1px 1px var(--black-a70); }
.mil-hcard.rarity-legendary::after, .mil-slot.rarity-legendary::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(105deg, transparent 42%, var(--white-a20) 50%, transparent 58%);
  background-size: 260% 100%;
  background-position: 120% 0;
  animation: mil-sheen 3.6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes mil-sheen { 0%, 55% { background-position: 120% 0; } 100% { background-position: -40% 0; } }

/* ---------------------------------------------------------------- recruit */
.mil-rbanner {
  position: relative;
  overflow: hidden;
  height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  border: 1px solid var(--legendary);
  border-radius: var(--r-lg);
  background: radial-gradient(120% 95% at 50% 8%, var(--legendary-hi), var(--epic-lo) 52%, var(--panel-deep));
  box-shadow: inset 0 1px 0 var(--white-a35), 0 8px 20px var(--black-a40);
}
.mil-rbanner-rays {
  position: absolute;
  left: 50%;
  top: 34%;
  width: 440px;
  height: 440px;
  margin: -220px 0 0 -220px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--white-a12) 0deg 8deg, transparent 8deg 24deg);
  -webkit-mask: radial-gradient(circle, var(--black-a70) 0 18%, transparent 64%);
  mask: radial-gradient(circle, var(--black-a70) 0 18%, transparent 64%);
  animation: mil-spin 36s linear infinite;
  pointer-events: none;
}
@keyframes mil-spin { to { transform: rotate(360deg); } }
.mil-rbanner-art { position: absolute; left: 0; right: 0; top: 12px; height: 128px; }
.mil-rb-hero { position: absolute; left: 50%; top: 14px; width: 92px; }
.mil-rb-hero .mil-por { border: 2px solid var(--rarity); border-radius: var(--r); box-shadow: 0 8px 18px var(--black-a55); }
.mil-rb-hero.is-c { width: 114px; top: 0; margin-left: -57px; z-index: 2; }
.mil-rb-hero.is-c .mil-por { box-shadow: 0 0 0 1px var(--black-a40), 0 0 22px var(--legendary), 0 10px 20px var(--black-a55); }
.mil-rb-hero.is-l { margin-left: -136px; transform: rotate(-9deg); }
.mil-rb-hero.is-r { margin-left: 44px; transform: rotate(9deg); }
.mil-rbanner-text {
  position: relative;
  z-index: 3;
  padding: 18px 14px 12px;
  text-align: center;
  background: linear-gradient(180deg, transparent, var(--black-a70) 70%);
}
.mil-rbanner-title {
  font: 25px/1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--gold);
  text-shadow: 0 2px 0 var(--black-a70), 0 0 14px var(--black-a55);
}
.mil-rbanner-sub { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }

.mil-odot {

/* ---------------------------------------------------------------- squad */

}

.mil-spow { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; }

  display: grid;

}

.mil-sbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mil-stroops { display: grid; gap: 8px; }

/* ---------------------------------------------------------------- troops */

/* ---------------------------------------------------------------- hero sheet */

}

.mil-hs-info { display: grid; gap: 6px; min-width: 0; }

.mil-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.mil-hs-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------------------------------------------------------------- squad picker */

.mil-pick-info { display: grid; gap: 3px; min-width: 0; }
.mil-pick-n { display: block; font: 16px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------------------------------------------------------------- training sheet */
.mil-train { display: grid; gap: 12px; }
.mil-train-top { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
.mil-train-art { position: relative; width: 72px; }
.mil-train-art .mil-tierchip { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); }
.mil-train-info { display: grid; gap: 3px; min-width: 0; }
.mil-train-sub { font-size: 14px; font-weight: 600; color: var(--text-2); }
.mil-train-owned { font: 16px/1.1 var(--font-display); }

.mil-train-meta span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------------------------------------------------------------- recruit reveal */
.mil-reveal-sheet .sheet { background: radial-gradient(120% 60% at 50% 22%, var(--epic-lo), var(--panel-deep) 72%); }
.mil-reveal { position: relative; display: grid; gap: 14px; padding-top: 4px; }
.mil-reveal-rays {
  position: absolute;
  left: 50%;
  top: 130px;
  width: 480px;
  height: 480px;
  margin: -240px 0 0 -240px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--white-a06) 0deg 9deg, transparent 9deg 24deg);
  -webkit-mask: radial-gradient(circle, var(--black-a70) 0 22%, transparent 64%);
  mask: radial-gradient(circle, var(--black-a70) 0 22%, transparent 64%);
  animation: mil-spin 48s linear infinite;
  pointer-events: none;
}
.mil-rgrid { position: relative; display: grid; gap: 8px; }
.mil-reveal.is-multi .mil-rgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.mil-reveal.is-single .mil-rgrid { grid-template-columns: minmax(0, 176px); justify-content: center; padding-block: 10px; }
.mil-rc { position: relative; perspective: 700px; aspect-ratio: 3 / 4.25; }
.mil-reveal.is-multi .mil-rc { aspect-ratio: 3 / 4.7; }
.mil-rc-in {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.3, 0.8, 0.3, 1);
}
.mil-rc.is-flipped .mil-rc-in { transform: rotateY(180deg); }
.mil-reveal.is-instant .mil-rc-in { transition: none; }
.mil-rc-back, .mil-rc-face {
  position: absolute;
  inset: 0;
  border-radius: var(--r);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.mil-rc-back {
  display: grid;
  place-items: center;
  border: 2px solid var(--ice-3);
  background:
    radial-gradient(circle at 50% 50%, var(--panel-3), transparent 60%),
    repeating-linear-gradient(45deg, var(--panel-2) 0 6px, var(--panel) 6px 12px);
  box-shadow: inset 0 0 0 2px var(--panel-deep), inset 0 1px 0 var(--white-a20), 0 4px 10px var(--black-a55);
}
.mil-rc-emblem {
  display: grid;
  place-items: center;
  width: 46%;
  aspect-ratio: 1;
  border: 2px solid var(--gold-2);
  border-radius: 50%;
  background: var(--panel-deep);
  box-shadow: 0 0 10px var(--ember-glow);
}
.mil-rc-emblem svg { width: 60%; height: 60%; }
.mil-rc.is-charging .mil-rc-in { animation: mil-charge 0.62s ease-in-out; }
.mil-rc.is-charging .mil-rc-back { border-color: var(--rarity); box-shadow: inset 0 0 0 2px var(--panel-deep), 0 0 18px var(--rarity), 0 0 36px var(--rarity-hi); }
@keyframes mil-charge {
  0%, 100% { transform: none; }
  20% { transform: translateX(-2px) rotate(-1.5deg); }
  40% { transform: translateX(2px) rotate(1.5deg) scale(1.03); }
  60% { transform: translateX(-2px) rotate(-1deg) scale(1.05); }
  80% { transform: translateX(1px) scale(1.06); }
}
.mil-rc-face {
  display: flex;
  flex-direction: column;
  padding: 3px;
  overflow: hidden;
  transform: rotateY(180deg);
  border: 2px solid var(--rarity);
  background: linear-gradient(180deg, var(--rarity-hi), var(--rarity-lo));
  box-shadow: inset 0 1px 0 var(--white-a35), 0 4px 10px var(--black-a55);
}

.mil-rc.rarity-epic.is-flipped .mil-rc-face { box-shadow: inset 0 1px 0 var(--white-a35), 0 0 12px var(--epic-hi); }

.mil-rc.is-shards .mil-rc-face .mil-por > svg { filter: saturate(0.7) brightness(0.85); }
.mil-rc-shard { position: absolute; right: 5px; top: 5px; z-index: 2; filter: drop-shadow(0 1px 2px var(--black-a70)); }
.mil-rc-tag {
  position: absolute;
  left: 5px;
  top: 5px;
  z-index: 2;
  padding: 3px 5px;
  border-radius: 4px;
  background: var(--black-a70);
  color: var(--text);
  font: 11px/1 var(--font-display);
}
.mil-rc-tag.is-new { background: linear-gradient(180deg, var(--red), var(--red-2)); color: var(--red-ink); }
.mil-rc-name { flex: none; margin-top: auto; padding-top: 3px; font: 13px/1.05 var(--font-display); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 var(--black-a55); }
.mil-rc-kind { flex: none; padding: 2px 0 3px; font: 600 10px/1 var(--font-body); text-align: center; color: var(--text-2); }
.mil-reveal.is-single .mil-rc-name { font-size: 20px; }
.mil-reveal.is-single .mil-rc-kind { font-size: 12px; padding-bottom: 6px; }
.mil-reveal.is-single .mil-rc-tag { font-size: 14px; padding: 4px 7px; }
.mil-rsum {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 4px 0;
  font-size: 14px;
  line-height: 1.35;
  text-align: center;
  color: var(--text-2);
}
.mil-rsum[hidden] { display: none; }
.mil-dotsep::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 4px;
  margin: 0 9px;
  border-radius: 50%;
  background: var(--dim);
  vertical-align: middle;
}
.mil-rbar, .mil-bbar { position: relative; display: flex; gap: 10px; }
.mil-rbar .btn, .mil-bbar .btn { flex: 1 1 0; min-width: 0; }
.mil-rbar .btn[hidden], .mil-bbar .btn[hidden] { display: none; }

/* ---------------------------------------------------------------- explore: idle chest bar */
.mil-idle { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; }

}

}
.mil-idle-chest svg { width: 48px; height: 48px; }
.mil-idle.is-ready .mil-idle-chest { background: radial-gradient(circle at 50% 60%, var(--gold-2), transparent 68%); }
.mil-idle.is-ready .mil-idle-chest svg { animation: mil-bob 1.5s ease-in-out infinite; }
@keyframes mil-bob { 0%, 100% { transform: none; } 50% { transform: translateY(-3px) rotate(-3deg); } }
.mil-idle-info { display: grid; flex: 1 1 auto; gap: 4px; min-width: 0; }

/* ---------------------------------------------------------------- explore: chapter map */
.mil-chead { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 36px; gap: 8px; align-items: center; }
.mil-chead .icon-btn:disabled { opacity: 0.35; cursor: default; }
