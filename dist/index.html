.mil-chead-k { font: 600 11px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ice); }
.mil-chead-n { font: 19px/1.05 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mil-chead-p { padding: 5px 8px; border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: var(--chip-bg); font: 15px/1 var(--font-display); }
.mil-map {
  position: relative;
  width: 100%;
  aspect-ratio: 100 / 72;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: var(--panel-deep);
  box-shadow: inset 0 0 0 1px var(--white-a12), 0 8px 20px var(--black-a40);
}
.mil-map-bg, .mil-map-path { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
.mil-node {
  position: absolute;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  padding: 0;
  border: 3px solid var(--panel-deep);
  border-radius: 50%;
  background: linear-gradient(180deg, var(--panel-3), var(--panel-deep));
  color: var(--muted);
  box-shadow: 0 3px 0 var(--black-a40), 0 5px 10px var(--black-a40), inset 0 1px 0 var(--white-a35);
}
.mil-node-ico { display: grid; place-items: center; width: 100%; height: 100%; overflow: hidden; border-radius: 50%; }
.mil-node.is-done { border-color: var(--green-3); background: linear-gradient(180deg, var(--green), var(--green-2)); color: var(--green-ink); }
.mil-node.is-next { z-index: 2; border-color: var(--gold-3); background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: var(--gold-ink); }
.mil-node.is-next::before {
  content: "";
  position: absolute;
  inset: -10px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  opacity: 0;
  animation: mil-pulse 1.5s ease-out infinite;
  pointer-events: none;
}
@keyframes mil-pulse { 0% { opacity: 0.9; transform: scale(0.75); } 100% { opacity: 0; transform: scale(1.25); } }
.mil-node.is-boss { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
.mil-node.is-boss:not(.is-done) { border-color: var(--red-2); background: radial-gradient(circle at 50% 40%, var(--panel-3), var(--panel-deep)); }
.mil-node.is-boss.is-next { border-color: var(--gold-2); background: radial-gradient(circle at 50% 40%, var(--ember), var(--ember-3)); }
.mil-node-esvg { width: 118%; height: 118%; margin-top: 4px; }
.mil-node.is-boss.is-locked .mil-node-esvg { filter: grayscale(0.7) brightness(0.65); }
.mil-node-lbl {
  position: absolute;
  top: calc(100% + 2px);
  left: 50%;
  transform: translateX(-50%);
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--black-a70);
  color: var(--text);
  font: 12px/1 var(--font-display);
  white-space: nowrap;
  pointer-events: none;
}
.mil-node.is-locked .mil-node-lbl { color: var(--text-2); }

/* ---------------------------------------------------------------- explore: next battle card */
.mil-next { display: grid; gap: 12px; }
.mil-next-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.mil-next-k { font: 600 11px/1.2 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ice); }
.mil-next-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; font: 21px/1.1 var(--font-display); }
.mil-bosschip { padding: 4px 7px; border-radius: 5px; background: linear-gradient(180deg, var(--red), var(--red-2)); color: var(--red-ink); font: 12px/1 var(--font-display); }
.mil-verdict {
  flex: none;
  padding: 5px 8px;
  border: 1px solid currentColor;
  border-radius: var(--r-sm);
  background: var(--chip-bg);
  font: 13px/1 var(--font-display);
  white-space: nowrap;
}
.mil-verdict.is-good { color: var(--good); }
.mil-verdict.is-warn { color: var(--warn); }
.mil-verdict.is-bad { color: var(--bad); }
.mil-vs {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 6px;
  align-items: center;
  padding: 10px 8px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: linear-gradient(90deg, var(--rare-lo), var(--chip-bg) 45%, var(--chip-bg) 55%, var(--ember-3));
}
.mil-vs-side { display: grid; gap: 7px; justify-items: center; min-width: 0; }
.mil-vs-units { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; min-height: 44px; }
.mil-vs-hero { flex: 0 1 38px; min-width: 0; }
.mil-vs-hero .mil-por { border: 1.5px solid var(--rarity); border-radius: var(--r-sm); }
.mil-vs-foe { flex: 0 1 38px; min-width: 0; }
.mil-vs-foe.is-boss { flex-basis: 50px; }
.mil-vs-foe svg { display: block; width: 100%; height: auto; }
.mil-vs-pow { display: inline-flex; align-items: center; gap: 4px; font: 16px/1 var(--font-display); }
.mil-vs-pow.is-ahead b { color: var(--good); }
.mil-vs-mid { font: 22px/1 var(--font-display); color: var(--gold); text-shadow: 0 2px 0 var(--black-a70); }
.mil-next-rw { display: grid; gap: 6px; }
.mil-rwtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.mil-rwtiles .tile .tile-count { font-size: 11px; }
.mil-fight { min-height: 52px; font-size: 21px; gap: 8px; }
.mil-next-done { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; }
.mil-next-done p { margin-top: 4px; font-size: 13px; }

/* ---------------------------------------------------------------- idle sheet */
.mil-idles { display: grid; gap: 10px; }
.mil-idles-top { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; }
.mil-idles-top p { margin-top: 4px; font-size: 13px; line-height: 1.4; }
.mil-idle-chest.is-big { width: 74px; height: 74px; }
.mil-idle-chest.is-big svg { width: 66px; height: 66px; }
.mil-idles-time { font: 22px/1.1 var(--font-display); }
.mil-idles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 10px 8px; }
.mil-idles-book { font-size: 13px; }
.mil-idles-ratenote { margin-top: 8px; font-size: 13px; }

/* ---------------------------------------------------------------- battle */
.mil-battle-sheet .sheet { max-height: 94%; }
.mil-battle { display: grid; gap: 10px; }
.mil-bhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.mil-bside { display: grid; gap: 3px; min-width: 0; }
.mil-bside.is-foe { justify-items: end; text-align: right; }
.mil-bside-k { max-width: 100%; overflow: hidden; font: 600 11px/1.1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.mil-bside-v { display: inline-flex; align-items: center; gap: 4px; font: 19px/1 var(--font-display); }
.mil-bvs { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--chip-bg); border: 1px solid var(--line); }
.mil-arena {
  position: relative;
  height: 250px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: var(--panel-deep);
  box-shadow: inset 0 0 30px var(--black-a40);
}
.mil-arena-bg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.mil-unit { position: absolute; z-index: 1; display: grid; gap: 4px; width: 56px; margin: -34px 0 0 -28px; --dir: 1; --fall: -10deg; }
.mil-unit.is-ally.pos-mid { left: 34%; top: 60%; }
.mil-unit.is-ally.pos-top { left: 17%; top: 36%; }
.mil-unit.is-ally.pos-bot { left: 17%; top: 84%; }
.mil-unit.is-foe { width: 66px; margin: -38px 0 0 -33px; --dir: -1; --fall: 10deg; }
.mil-unit.is-foe.pos-mid { left: 66%; top: 60%; }
.mil-unit.is-foe.pos-top { left: 83%; top: 36%; }
.mil-unit.is-foe.pos-bot { left: 83%; top: 84%; }
.mil-unit.is-foe.is-boss { z-index: 2; width: 88px; margin: -50px 0 0 -44px; }
.mil-unit-fig { position: relative; transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease; }
.mil-unit.is-ally .mil-por { border: 2px solid var(--rarity); border-radius: var(--r-sm); box-shadow: 0 4px 8px var(--black-a55); }
.mil-unit-fig .mil-cls { top: -6px; right: -6px; width: 19px; height: 19px; }
.mil-unit.is-foe .mil-unit-fig svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 3px var(--black-a40)); }
.mil-hp { height: 6px; overflow: hidden; border-radius: 3px; background: var(--black-a55); box-shadow: 0 0 0 1px var(--black-a40); }
.mil-unit.is-foe .mil-hp { width: 56px; justify-self: center; }
.mil-unit.is-foe.is-boss .mil-hp { width: 72px; height: 7px; }
.mil-hp i { display: block; width: 100%; height: 100%; background: linear-gradient(180deg, var(--green), var(--green-2)); transition: width 0.25s ease-out; }
.mil-hp.is-foe i { background: linear-gradient(180deg, var(--red), var(--red-2)); }
.mil-unit.is-dead .mil-unit-fig { opacity: 0.3; filter: grayscale(1); transform: translateY(5px) rotate(var(--fall)); }
.mil-unit.is-dead .mil-hp { opacity: 0.4; }
.mil-unit.is-atk .mil-unit-fig { animation: mil-lunge 0.28s ease-out; }
.mil-unit.is-hit .mil-unit-fig { animation: mil-hit 0.26s ease-out; }
@keyframes mil-lunge { 0%, 100% { transform: none; } 40% { transform: translateX(calc(var(--dir) * 18px)) scale(1.07); } }
@keyframes mil-hit {
  0% { filter: brightness(2.4); }
  30% { transform: translateX(calc(var(--dir) * -6px)); }
  60% { transform: translateX(calc(var(--dir) * 3px)); }
  100% { filter: none; transform: none; }
}
.mil-arena.is-intro .mil-unit.is-ally .mil-unit-fig { animation: mil-in-l 0.42s ease-out both; }
.mil-arena.is-intro .mil-unit.is-foe .mil-unit-fig { animation: mil-in-r 0.42s ease-out both; }
@keyframes mil-in-l { from { opacity: 0; transform: translateX(-46px); } to { opacity: 1; transform: none; } }
@keyframes mil-in-r { from { opacity: 0; transform: translateX(46px); } to { opacity: 1; transform: none; } }
.mil-troopchip { position: absolute; left: 50%; bottom: 6px; z-index: 2; font-size: 12px; transform: translateX(-50%); white-space: nowrap; }
.mil-fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.mil-dmg {
  position: absolute;
  transform: translate(-50%, -100%);
  color: var(--text);
  font: 17px/1 var(--font-display);
  white-space: nowrap;
  text-shadow: 0 2px 0 var(--black-a70), 0 0 4px var(--black-a70), 1px 0 0 var(--black-a70), -1px 0 0 var(--black-a70);
  animation: mil-float 0.85s ease-out forwards;
}
.mil-dmg.is-foe { color: var(--bad); }
.mil-dmg.is-crit { color: var(--gold); font-size: 22px; }
@keyframes mil-float {
  0% { opacity: 0; transform: translate(-50%, -60%) scale(0.7); }
  20% { opacity: 1; transform: translate(-50%, -115%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -230%) scale(1); }
}
.mil-slash {
  position: absolute;
  width: 58px;
  height: 58px;
  margin: -29px 0 0 -29px;
  border-top: 4px solid var(--text);
  border-right: 2px solid transparent;
  border-radius: 50%;
  opacity: 0;
  filter: drop-shadow(0 0 4px var(--ice));
  animation: mil-slash 0.32s ease-out;
}
.mil-slash.is-foe { border-top-color: var(--bad); filter: drop-shadow(0 0 4px var(--red-2)); }
@keyframes mil-slash {
  0% { opacity: 0; transform: rotate(-70deg) scale(0.5); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: rotate(40deg) scale(1.15); }
}
.mil-proj {
  position: absolute;
  width: 24px;
  height: 3px;
  margin: -1.5px 0 0 -12px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--text) 45%, var(--gold));
  box-shadow: 0 0 6px var(--gold);
  transition: transform 0.15s linear;
}
.mil-banner {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: grid;
  place-items: center;
  background: radial-gradient(70% 34% at 50% 50%, var(--black-a70), transparent 75%);
}
.mil-banner[hidden] { display: none; }
.mil-banner-t {
  font: 46px/1 var(--font-display);
  letter-spacing: 0.04em;
  text-shadow: 0 3px 0 var(--black-a70), 0 0 20px var(--black-a55);
  animation: mil-banner 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
}
.mil-banner.is-win .mil-banner-t { color: var(--gold); -webkit-text-stroke: 1.5px var(--gold-3); }
.mil-banner.is-loss .mil-banner-t { color: var(--text-2); -webkit-text-stroke: 1.5px var(--black-a70); }
@keyframes mil-banner { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
.mil-bres { display: grid; gap: 10px; }
.mil-bres[hidden] { display: none; }
.mil-bres-t { font: 19px/1.1 var(--font-display); text-align: center; }
.mil-bres-p { font-size: 14px; line-height: 1.4; text-align: center; color: var(--text-2); }
.mil-bres-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 10px 8px; }
.mil-tips { display: grid; gap: 8px; }
.mil-tip { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; }
.mil-tip-ico { display: grid; place-items: center; }
.mil-tip-t { display: grid; gap: 2px; min-width: 0; font-size: 13px; line-height: 1.3; color: var(--muted); }
.mil-tip-t b { font: 15px/1.1 var(--font-display); font-weight: 400; color: var(--text); }

/* ---------------------------------------------------------------- narrow phones */
@media (max-width: 374px) {
  .mil-grid, .mil-slots { gap: 8px; }
  .mil-hname, .mil-slot-name { font-size: 13px; }
  .mil-rb-hero { width: 84px; }
  .mil-rb-hero.is-c { width: 104px; margin-left: -52px; }
  .mil-rb-hero.is-l { margin-left: -124px; }
  .mil-rb-hero.is-r { margin-left: 40px; }
  .mil-stepper { grid-template-columns: 34px minmax(0, 1fr) 34px 64px; gap: 6px; }
  .mil-spow b { font-size: 15px; }
  .mil-hs-top { grid-template-columns: 96px minmax(0, 1fr); }
}

/* ---------------------------------------------------------------- reduced motion: nothing ambient */
@media (prefers-reduced-motion: reduce) {
  .mil-hcard.rarity-legendary::after, .mil-slot.rarity-legendary::after { display: none; }
  .mil-rbanner-rays, .mil-reveal-rays { animation: none; }
  .mil-node.is-next::before { animation: none; opacity: 0.7; transform: none; }
  .mil-idle.is-ready .mil-idle-chest svg { animation: none; }
  .mil-rc-in { transition: none; }
}

/* ===== modules/shop.css ===== */
/* Shop module (owner: shop agent): Gems, packs, VIP, gem shop and the test-store purchase sheet.
   All colors come from core tokens. Classes are prefixed .shop-. */

.shop { display: grid; gap: 14px; }
.shop-sec { display: grid; gap: 12px; min-width: 0; }
.shop-sec[hidden] { display: none; }

/* ---------- sticky header: title, test ribbon, section switcher */
.shop-top {
  position: sticky;
  top: -14px; /* Chrome measures sticky offsets from the content edge; the screen has 14px top padding */
  z-index: 4;
  display: grid;
  gap: 10px;
  margin: -14px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, var(--bg-hi), var(--bg-2));
  border-bottom: 1px solid var(--line-soft);
  box-shadow: 0 8px 16px var(--black-a40);
}
.shop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.shop-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 24px/1 var(--font-display);
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 var(--black-a55);
}
.shop-ribbon {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 18px 0 11px;
  background: repeating-linear-gradient(135deg, var(--gold) 0 7px, var(--gold-2) 7px 14px);
  color: var(--gold-ink);
  font: 12px/1 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-shadow: 0 1px 0 var(--white-a35);
  clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%);
  border-radius: 4px 0 0 4px;
  filter: drop-shadow(0 2px 2px var(--black-a55));
}
.shop-ribbon[hidden] { display: none; }
.shop-seg > button { position: relative; flex: 1 1 0; min-width: 0; padding-inline: 6px; }
.shop-seg .badge-dot { position: absolute; top: 3px; right: 3px; }

/* ---------- shared bits */
.shop-tag, .shop-value {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  font: 11px/1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.shop-tag { background: var(--ice-3); color: var(--blue-ink); box-shadow: inset 0 1px 0 var(--white-a20); }
.shop-value { background: linear-gradient(180deg, var(--red), var(--red-2)); color: var(--red-ink); box-shadow: inset 0 1px 0 var(--white-a35); }
.shop-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--muted);
}
.shop-note .ico { color: var(--ice); margin-top: 1px; }
.shop-row-title { font: 16px/1.15 var(--font-display); letter-spacing: 0.01em; }
.shop-row-sub { font-size: 13px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.shop-short { color: var(--bad); }
.shop-art { display: block; width: 100%; height: 100%; overflow: visible; }
.shop-svg-num { font: 17px var(--font-display); fill: var(--text); }
.shop-svg-small { font: 9px var(--font-display); letter-spacing: 0.08em; fill: var(--text-2); }
.shop-svg-badge { font: 13px var(--font-display); fill: var(--green-ink); }
.shop-art-box {
  display: grid;
  place-items: center;
  border-radius: var(--r);
  border: 1px solid var(--line-soft);
  background: radial-gradient(circle at 50% 45%, var(--ice-glow), transparent 68%), var(--panel-deep);
  box-shadow: inset 0 1px 0 var(--white-a06), inset 0 -12px 20px var(--black-a25);
}
.shop-items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: 10px 4px;
  padding: 10px 8px;
  border-radius: var(--r);
  background: var(--black-a25);
  border: 1px solid var(--line-soft);
}
.shop-items-grid .reward-item .tile { width: 50px; }
.shop-items-grid .reward-name { font-size: 11px; line-height: 1.15; }
.shop-price { min-width: 116px; }
.shop-price.is-done { filter: none; opacity: 0.8; background: var(--white-a06); color: var(--text-2); text-shadow: none; box-shadow: inset 0 0 0 1px var(--line); }
.shop-flash { animation: shop-flash 1.6s ease-out; }
@keyframes shop-flash {
  0%, 40% { box-shadow: 0 0 0 3px var(--ice), 0 0 24px var(--ice-glow); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ---------- featured starter offer */
.shop-feature {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  grid-template-areas: "art info" "buy buy";
  gap: 10px 12px;
  align-items: center;
  overflow: hidden;
  border-color: var(--ember);
  background:
    radial-gradient(90% 120% at 0% 0%, var(--ember-glow), transparent 60%),
    linear-gradient(180deg, var(--panel-2), var(--panel));
}
.shop-feature-rays {
  position: absolute;
  left: 58px;
  top: 52px;
  width: 220px;
  height: 220px;
  margin: -110px 0 0 -110px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--ember-glow) 0deg 9deg, transparent 9deg 24deg);
  -webkit-mask: radial-gradient(circle, var(--black-a70) 0 25%, transparent 66%);
  mask: radial-gradient(circle, var(--black-a70) 0 25%, transparent 66%);
  animation: shop-spin 24s linear infinite;
  pointer-events: none;
}
.shop-feature-art { grid-area: art; position: relative; width: 92px; height: 92px; }
.shop-feature-info { grid-area: info; position: relative; min-width: 0; }
.shop-feature-title { font: 24px/1.05 var(--font-display); letter-spacing: 0.01em; color: var(--gold); text-shadow: 0 2px 0 var(--black-a55); margin-top: 4px; }
.shop-feature-desc { font-size: 13.5px; line-height: 1.35; color: var(--text-2); margin-top: 3px; }
.shop-feature-buy { grid-area: buy; position: relative; }
.shop-pack-tags { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------- gem packs */
.shop-gem-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.shop-gem {
  --glow: var(--ice-glow);
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 20px 8px 6px;
  overflow: hidden;
  border-color: var(--line);
  background:
    radial-gradient(75% 55% at 50% 32%, var(--glow), transparent 72%),
    linear-gradient(180deg, var(--card-2), var(--card));
  box-shadow: inset 0 1px 0 var(--white-a12), 0 4px 12px var(--black-a40);
}
.shop-gem-t5 { --glow: var(--epic-hi); border-color: var(--epic-hi); }
.shop-gem-t6 {
  --glow: var(--legendary-hi);
  border-color: var(--legendary);
  background:
    radial-gradient(75% 55% at 50% 32%, var(--glow), transparent 72%),
    linear-gradient(180deg, var(--legendary-lo), var(--card));
}
.shop-gem-art { width: 100%; max-width: 128px; aspect-ratio: 120 / 84; }
.shop-gem-amt {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font: 23px/1 var(--font-display);
  letter-spacing: 0.01em;
  text-shadow: 0 2px 0 var(--black-a55);
}
.shop-gem-bonus { min-height: 16px; font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--good); text-align: center; }
.shop-gem .shop-price { min-width: 0; margin-top: 5px; }
.shop-x2 {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  padding: 5px 9px 5px 8px;
  border-radius: var(--r) 0 var(--r) 0;
  background: linear-gradient(180deg, var(--red), var(--red-2));
  color: var(--red-ink);
  font: 15px/1 var(--font-display);
  letter-spacing: 0.02em;
  box-shadow: 0 2px 6px var(--black-a40), inset 0 1px 0 var(--white-a35);
}
.shop-gem-tag {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 1;
  padding: 5px 8px;
  border-radius: 0 var(--r) 0 var(--r);
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  color: var(--gold-ink);
  font: 11px/1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  box-shadow: 0 2px 6px var(--black-a40), inset 0 1px 0 var(--white-a55);
}
.shop-foot { display: grid; gap: 10px; padding-top: 4px; }
.shop-foot-btns { display: flex; gap: 8px; }
.shop-foot-btns .btn { flex: 1 1 0; min-width: 0; }

/* ---------- packs */
.shop-packs { display: grid; gap: 12px; }
.shop-pack { display: grid; gap: 10px; overflow: hidden; }
.shop-pack-head { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; }
.shop-pack-art { width: 84px; height: 84px; }
.shop-pack-art .shop-art { width: 88%; height: 88%; }
.shop-pack-info { min-width: 0; display: grid; gap: 4px; }
.shop-pack-title { font: 20px/1.1 var(--font-display); letter-spacing: 0.01em; text-shadow: 0 2px 0 var(--black-a40); }
.shop-pack-desc { font-size: 13.5px; line-height: 1.35; color: var(--text-2); }
.shop-pack-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.shop-pack-note { min-width: 0; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.shop-pack-foot .btn { flex: none; }
.shop-pack.is-done { opacity: 0.72; }
.shop-pack-starter {
  border-color: var(--ember);
  background: radial-gradient(90% 120% at 0% 0%, var(--ember-glow), transparent 60%), linear-gradient(180deg, var(--panel-2), var(--panel));
}
.shop-pack-card {
  border-color: var(--epic-hi);
  background: radial-gradient(100% 120% at 0% 0%, var(--epic-lo), transparent 70%), linear-gradient(180deg, var(--panel-2), var(--panel));
}
.shop-pack-hero { border-color: var(--rare-hi); }
.shop-mcard {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border-radius: var(--r);
  background: var(--black-a25);
  border: 1px solid var(--line-soft);
}
.shop-mcard-info { flex: 1 1 auto; min-width: 0; }
.shop-mcard-days { font: 20px/1.1 var(--font-display); color: var(--gem); }
.shop-mcard-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.shop-mcard .btn { flex: none; }

/* ---------- VIP */
.shop-vip-hero {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  border-color: var(--legendary-hi);
  background:
    radial-gradient(110% 100% at 0% 0%, var(--legendary-lo), transparent 62%),
    linear-gradient(180deg, var(--panel-2), var(--panel));
}
.shop-vip-crest { display: grid; place-items: center; filter: drop-shadow(0 4px 6px var(--black-a55)); }
.shop-crest { display: block; overflow: visible; }
.shop-crest-vip { font: 15px var(--font-display); letter-spacing: 0.06em; }
.shop-crest-lv { font: 30px var(--font-display); fill: var(--text); }
.shop-vip-main { min-width: 0; }
.shop-vip-lv { font: 30px/1 var(--font-display); letter-spacing: 0.02em; color: var(--legendary); text-shadow: 0 2px 0 var(--black-a55); }
.shop-vip-bar { height: 18px; margin: 8px 0 6px; }
.shop-vip-next { font-size: 13px; color: var(--muted); }
.shop-vip-daily, .shop-hint {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
}
.shop-vip-daily { border-color: var(--legendary-hi); }
.shop-vip-daily-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r); background: var(--black-a25); }
.shop-hint > .ico { margin-inline: 4px; }
.shop-perks { display: grid; gap: 2px; padding: 6px 10px; }
.shop-perk {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto 64px;
  gap: 8px;
  align-items: center;
  min-height: 36px;
  border-bottom: 1px solid var(--line-soft);
}
.shop-perk:last-child { border-bottom: 0; }
.shop-perk-head { min-height: 26px; font: 11px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.shop-perk-head > span:nth-child(3), .shop-perk-head > span:nth-child(4) { text-align: right; }
.shop-perk-ico { display: grid; place-items: center; }
.shop-perk-up { color: var(--good); }
.shop-perk-clock { color: var(--ice); }
.shop-perk-name { font-size: 14px; font-weight: 600; color: var(--text-2); min-width: 0; }
.shop-perk-val { font: 16px/1 var(--font-display); text-align: right; white-space: nowrap; }
.shop-perk-next { display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; font: 13px/1 var(--font-display); color: var(--good); white-space: nowrap; }
.shop-perk.is-off .shop-perk-val { color: var(--dim); }
.shop-perk.is-off .shop-perk-ico { opacity: 0.55; }
.shop-vlist { display: grid; gap: 10px; }
.shop-vlv { display: grid; gap: 8px; }
.shop-vlv.is-current {
  border-color: var(--legendary);
  background: radial-gradient(100% 120% at 0% 0%, var(--legendary-lo), transparent 70%), linear-gradient(180deg, var(--card-2), var(--card));
  box-shadow: 0 0 0 1px var(--legendary-hi), 0 0 18px var(--black-a40), inset 0 1px 0 var(--white-a12);
}
.shop-vlv.is-locked .shop-vlv-head, .shop-vlv.is-locked .shop-vlv-perks { opacity: 0.7; }
.shop-vlv-head { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.shop-vlv-name { font: 18px/1.05 var(--font-display); letter-spacing: 0.02em; }
.shop-vlv-pts { font-size: 12.5px; color: var(--muted); }
.shop-vlv-state {
  padding: 4px 8px;
  border-radius: 5px;
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  color: var(--gold-ink);
  font: 11px/1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.shop-vlv:not(.is-current) .shop-vlv-state { background: var(--white-a12); color: var(--text-2); }
.shop-vlv-lock { color: var(--muted); }
.shop-vlv-perks { margin: 0; padding: 0 0 0 2px; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--text-2); }
.shop-vlv-perks li { position: relative; padding-left: 14px; }
.shop-vlv-perks li::before { content: ""; position: absolute; left: 2px; top: 0.55em; width: 5px; height: 5px; border-radius: 2px; background: var(--line-strong); }
.shop-vlv-perks li.is-new::before { background: var(--good); }
.shop-vlv-perks b { font-weight: 700; color: var(--text); }
.shop-vlv-perks li.is-new b { color: var(--good); }
.shop-vlv-gift {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "label btn" "tiles btn";
  gap: 4px 10px;
  align-items: center;
  padding: 8px;
  border-radius: var(--r-sm);
  background: var(--black-a25);
}
.shop-vlv-gift-label { grid-area: label; font: 12px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.shop-vlv-tiles { grid-area: tiles; display: flex; flex-wrap: wrap; gap: 5px; }
.shop-vlv-tiles .tile { width: 38px; }
.shop-vlv-tiles .tile .tile-count { font-size: 10.5px; right: 2px; bottom: 1px; }
.shop-vlv-gift .btn { grid-area: btn; min-width: 86px; }

/* ---------- gem shop */
.shop-gift {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  grid-template-areas: "art info" "tiles tiles" "btn btn";
  gap: 10px 12px;
  align-items: center;
  border-color: var(--green-2);
  background: radial-gradient(100% 120% at 0% 0%, var(--green-3), transparent 65%), linear-gradient(180deg, var(--panel-2), var(--panel));
}
.shop-gift-art { grid-area: art; width: 72px; height: 72px; }
.shop-gift-info { grid-area: info; min-width: 0; display: grid; gap: 4px; }
.shop-gift-tiles { grid-area: tiles; display: flex; flex-wrap: wrap; gap: 6px; }
.shop-gift-tiles .tile { width: 46px; }
.shop-gift-btn { grid-area: btn; width: 100%; }
.shop-gs-head { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.shop-gs-head .section-title { flex: 1 1 auto; margin: 0; }
.shop-reset { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.shop-reset .ico { color: var(--ice); }
.shop-gs-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shop-gs {
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 4px;
  padding: 12px 6px 4px;
  text-align: center;
  overflow: hidden;
}
.shop-gs .tile { width: 54px; }
.shop-gs-name { display: grid; place-items: center; min-height: 2.4em; font: 13px/1.15 var(--font-display); letter-spacing: 0.01em; }
.shop-gs-left { font-size: 11.5px; color: var(--muted); }
.shop-gs-buy { width: 100%; padding-inline: 6px; }
.shop-gs.is-done .tile, .shop-gs.is-done .shop-gs-name { opacity: 0.55; }
.shop-gs-tag {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 1;
  padding: 4px 6px;
  border-radius: 0 var(--r) 0 var(--r);
  background: linear-gradient(180deg, var(--red), var(--red-2));
  color: var(--red-ink);
  font: 11px/1 var(--font-display);
}

/* ---------- test-store purchase sheet */
.shop-pay { display: grid; gap: 12px; }
.shop-pay-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--r);
  border: 1px solid var(--line-soft);
  background: var(--black-a25);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
}
.shop-pay-env {
  margin-left: auto;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--warn);
  color: var(--gold-ink);
  font: 11px/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.shop-pay-prod { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; align-items: center; }
.shop-pay-art { width: 80px; height: 80px; }
.shop-pay-art .shop-art { width: 86%; height: 86%; }
.shop-pay-info { min-width: 0; display: grid; gap: 3px; }
.shop-pay-title { font: 20px/1.1 var(--font-display); }
.shop-pay-price { font: 28px/1.05 var(--font-display); color: var(--gold); text-shadow: 0 2px 0 var(--black-a55); }
.shop-pay-vip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.shop-pay-test {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px dashed var(--warn);
  background: var(--black-a25);
  color: var(--warn);
  font-size: 15px;
  font-weight: 700;
}
.shop-pay-bonus { margin-top: -4px; font-size: 13px; font-weight: 700; color: var(--good); text-align: center; }
.shop-pay-busy { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--text-2); }
.shop-pay-busy[hidden] { display: none; }
.shop-spin {
  display: inline-block;
  flex: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid currentColor;
  border-right-color: transparent;
  animation: shop-spin 0.7s linear infinite;
}
@keyframes shop-spin { to { transform: rotate(360deg); } }

/* ---------- gem shop buy sheet */
.shop-buy { display: grid; gap: 12px; }
.shop-buy-top { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.shop-buy-top .tile { width: 64px; }
.shop-buy-name { font: 18px/1.1 var(--font-display); }
.shop-buy-owned { font-size: 13px; color: var(--muted); margin-top: 2px; }
.shop-buy-desc { font-size: 14px; color: var(--text-2); margin-top: 6px; line-height: 1.4; }
.shop-buy-qty { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px 3.5ch; align-items: center; gap: 8px; }
.shop-buy-qty input[type="range"] { width: 100%; accent-color: var(--ice-2); }
.shop-buy-n { font: 16px/1 var(--font-display); text-align: right; }
.shop-buy-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--r);
  background: var(--black-a25);
  border: 1px solid var(--line-soft);
  font-weight: 600;
  color: var(--text-2);
}
.shop-buy-cost { display: inline-flex; align-items: center; gap: 5px; font: 22px/1 var(--font-display); color: var(--text); }
.shop-buy-limit { font-size: 13px; color: var(--muted); }

/* ---------- purchase history */
.shop-hist { display: grid; gap: 8px; }
.shop-hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.shop-hist-title { font: 15px/1.15 var(--font-display); }
.shop-hist-meta { font-size: 12.5px; color: var(--muted); }
.shop-hist-tx { font-size: 11.5px; color: var(--dim); letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-hist-side { display: grid; justify-items: end; gap: 4px; }
.shop-hist-price { font: 16px/1 var(--font-display); }
.shop-hist-test { padding: 2px 6px; border-radius: 4px; background: var(--warn); color: var(--gold-ink); font: 10px/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.shop-empty { padding: 28px 8px; text-align: center; color: var(--muted); }

/* ---------- daily gift sheet (city side button) */
.shop-giftsheet { display: grid; gap: 12px; justify-items: center; }
.shop-giftsheet-art { position: relative; display: grid; place-items: center; width: 120px; height: 104px; }
.shop-giftsheet-art .shop-feature-rays { left: 50%; top: 50%; }
.shop-giftsheet-art > .ico { position: relative; filter: drop-shadow(0 4px 6px var(--black-a55)); }
.shop-giftsheet-sub { color: var(--text-2); text-align: center; font-weight: 600; }
.shop-giftsheet .shop-items-grid { width: 100%; }

@media (max-width: 374px) {
  .shop-gem-amt { font-size: 20px; }
  .shop-pack-head { grid-template-columns: 72px minmax(0, 1fr); }
  .shop-pack-art { width: 72px; height: 72px; }
  .shop-price { min-width: 100px; }
  .shop-perk { grid-template-columns: 22px minmax(0, 1fr) auto 56px; gap: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .shop-feature-rays, .shop-spin { animation: none !important; }
  .shop-flash { animation: none; box-shadow: 0 0 0 3px var(--ice); }
}

/* ===== modules/progress.css ===== */
/* Last Furnace progress module (owner: progress agent): the chapter quest banner on the City screen, the Events
   screen (Chapter, Daily, Login), mail sheets and the chief profile. Core tokens only. */

/* ---------- shared bits */
.prog-kicker {
  font: 600 11px/1.2 var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ice);
}
.prog-title {
  font: 22px/1.1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--text);
  text-shadow: 0 2px 0 var(--black-a40);
  margin-top: 2px;
}
.prog-blurb { margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--text-2); }
.prog-note { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
.prog-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: radial-gradient(90% 90% at 50% 30%, var(--panel-3), var(--panel-deep));
  box-shadow: inset 0 1px 0 var(--white-a12), 0 2px 4px var(--black-a40);
}
.prog-ico .ico { filter: drop-shadow(0 1px 1px var(--black-a55)); }
.prog-reset {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 600 12px/1.2 var(--font-body);
  color: var(--muted);
  white-space: nowrap;
}
.prog-reset .ico { color: var(--ice); }
.prog-reset > span > span { color: var(--text); font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; }

/* ---------- City banner (chapter quest) */
.prog-banner {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 58px;
  padding: 6px 8px 9px 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: var(--panel);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 95%, transparent), color-mix(in srgb, var(--panel-deep) 95%, transparent));
  box-shadow: inset 0 1px 0 var(--white-a20), 0 8px 22px var(--black-a55);
  overflow: hidden;
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.prog-banner.is-claim {
  border-color: var(--green-2);
  box-shadow: inset 0 1px 0 var(--white-a20), 0 0 0 1px var(--green-3), 0 8px 22px var(--black-a55);
}
.prog-banner-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 2px 4px 2px 2px;
  border: 0;
  border-radius: var(--r);
  background: transparent;
  color: var(--text);
  text-align: left;
}
.prog-banner-main:active { background: var(--white-a06); }
.prog-banner-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--gold-2);
  border-radius: var(--r);
  background: radial-gradient(90% 90% at 50% 30%, var(--panel-3), var(--panel-deep));
  box-shadow: inset 0 1px 0 var(--white-a20), 0 2px 5px var(--black-a40);
}
.prog-banner.is-claim .prog-banner-ico { border-color: var(--green); }
.prog-banner-txt { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.prog-banner-kicker {
  font: 600 11px/1.15 var(--font-body);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prog-banner.is-claim .prog-banner-kicker { color: var(--green); }
.prog-banner-task {
  font: 600 14px/1.2 var(--font-body);
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prog-banner-num {
  flex: none;
  font: 15px/1 var(--font-display);
  color: var(--text-2);
  letter-spacing: 0.01em;
}
.prog-banner-num:empty { display: none; }
.prog-banner-act { flex: none; min-width: 64px; }
.prog-banner-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--track);
}
.prog-banner-bar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--gold-2), var(--gold));
  transition: width 0.3s ease;
}
.prog-banner.is-claim .prog-banner-bar i { background: linear-gradient(90deg, var(--green-2), var(--green)); }
.prog-banner.is-claim .prog-banner-act { animation: prog-pulse 1.8s ease-in-out infinite; }
/* glow only (no transform), so the button never moves under a finger or a test click */
@keyframes prog-pulse {
  0%, 100% { filter: none; box-shadow: inset 0 1px 0 var(--white-a55), inset 0 -2px 0 var(--black-a15), 0 3px 0 var(--btn-edge), 0 5px 10px var(--black-a40); }
  50% { filter: brightness(1.12); box-shadow: inset 0 1px 0 var(--white-a55), inset 0 -2px 0 var(--black-a15), 0 3px 0 var(--btn-edge), 0 0 0 3px var(--green-3), 0 0 18px var(--green-2); }
}

/* ---------- Events screen */
.prog-events { display: grid; gap: 12px; }
.prog-subtabs > button { position: relative; flex: 1 1 0; }
.prog-subtabs .badge-dot { position: absolute; top: 3px; right: 5px; }
.prog-view { display: grid; gap: 10px; align-content: start; }
.prog-list { display: grid; gap: 8px; }
.prog-list-head { display: flex; align-items: center; gap: 10px; }
.prog-list-head .section-title { flex: 1 1 auto; margin: 4px 0; }
.prog-list-head .btn { flex: none; margin-bottom: 3px; }

/* chapter header */

.prog-row-text { font-weight: 600; font-size: 14px; line-height: 1.25; color: var(--text); }
.prog-meter { display: flex; align-items: center; gap: 8px; }

.prog-meter-num { flex: none; min-width: 3.2em; text-align: right; font: 13px/1 var(--font-display); color: var(--text-2); letter-spacing: 0.01em; }
.prog-row-rw .cost-list { gap: 4px; }
.prog-row-rw .res-chip { min-height: 22px; font-size: 13px; padding: 1px 6px 1px 2px; }
.prog-row-rw .res-chip svg { width: 16px; height: 16px; }
.prog-row-act { display: flex; justify-content: flex-end; min-width: 64px; }
.prog-row-act .btn { min-width: 64px; }
.prog-donetag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font: 13px/1 var(--font-display);
  color: var(--good);
}
.prog-pts {
  flex: none;
  display: grid;
  place-items: center;
  min-width: 38px;
  height: 26px;
  padding: 0 6px;
  border: 1px solid var(--ember-3);
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, var(--ember), var(--ember-2));
  color: var(--gold-ink);
  font: 13px/1 var(--font-display);
  box-shadow: inset 0 1px 0 var(--white-a35);
}
.prog-row.is-claimed .prog-pts { filter: grayscale(0.7); }

/* daily activity */
.prog-act { display: grid; gap: 10px; }
.prog-act-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.prog-act-pts { font: 30px/1 var(--font-display); color: var(--text); margin-top: 3px; text-shadow: 0 2px 0 var(--black-a40); }
.prog-act-max { font-size: 18px; color: var(--muted); }
.prog-act-chests { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.prog-dchest-cell { display: grid; justify-items: end; gap: 3px; }
.prog-dchest-cell:first-child { justify-items: center; }
.prog-dchest {
  position: relative;
  width: 50px;
  padding: 0;
  border: 0;
  border-radius: var(--r);
  background: transparent;
}
.prog-dchest .tile { width: 50px; }
.prog-dchest .tile svg { width: 70%; height: 70%; }
.prog-dchest .badge-dot { position: absolute; top: -4px; right: -4px; }
.prog-dchest.is-locked .tile { filter: saturate(0.4) brightness(0.75); }
.prog-dchest.is-open .tile { filter: grayscale(0.7) brightness(0.7); }
.prog-dchest.is-ready .tile { box-shadow: inset 0 1px 0 var(--white-a35), 0 0 0 2px var(--gold), 0 0 14px var(--ember-glow); }
.prog-dchest.is-ready .tile svg { animation: prog-bob 1.6s ease-in-out infinite; }
.prog-dchest-check {
  position: absolute;
  left: 50%;
  top: 50%;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border-radius: 50%;
  background: var(--green-2);
  color: var(--green-ink);
  box-shadow: 0 0 0 2px var(--panel-deep);
}
.prog-dchest-at { width: 50px; text-align: center; font: 13px/1 var(--font-display); color: var(--text-2); }
.prog-dchest-cell:first-child .prog-dchest-at { width: auto; }
.prog-act-bar { height: 12px; }

/* login calendar */
.prog-login { display: grid; gap: 12px; }
.prog-login-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.prog-icon-lg { flex: none; filter: drop-shadow(0 3px 4px var(--black-a55)); }
.prog-days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.prog-day-n { font: 13px/1 var(--font-display); letter-spacing: 0.02em; color: var(--text-2); }
.prog-day-tiles { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }

.prog-day-more { font: 12px/1 var(--font-display); color: var(--muted); }

.prog-day-check {
  position: absolute;
  left: 50%;
  top: 50%;

  place-items: center;
  width: 30px;
  height: 30px;

  border-radius: 50%;

}

.prog-day.is-next { border-color: var(--line-strong); }
.prog-day.is-locked .prog-day-tiles { filter: saturate(0.55) brightness(0.8); }
.prog-day-flag {

  top: -7px;
  right: -4px;
  padding: 3px 6px 2px;

  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  color: var(--gold-ink);

  letter-spacing: 0.02em;
  box-shadow: 0 2px 4px var(--black-a40);
}
.prog-day:active { transform: translateY(1px); }
.prog-login-claim { margin-top: 2px; }
.prog-login-next { justify-self: center; }

/* all chapters done */
.prog-alldone { display: grid; justify-items: center; gap: 8px; padding: 22px 16px; text-align: center; }
.prog-alldone-ico { filter: drop-shadow(0 4px 6px var(--black-a55)); }
.prog-alldone .btn { margin-top: 6px; }

/* reward previews (sheets) */
.prog-preview { display: grid; gap: 12px; }
.prog-preview-p { color: var(--text-2); font-size: 14px; line-height: 1.45; text-align: center; }
.prog-rw-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 12px 8px;
  justify-items: center;
  padding: 4px 0;
}

/* ---------- mail */
.prog-mail { display: grid; gap: 8px; }
.prog-mail-list { display: grid; gap: 8px; }
.prog-mail-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  color: var(--text);

}
.prog-mail-row:active { transform: translateY(1px); }

.prog-mail-row:not(.is-unread) .prog-mail-title { font-weight: 600; color: var(--text-2); }
.prog-mail-from { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-mail-row .badge-dot { flex: none; }
.prog-mail-chev { flex: none; color: var(--muted); display: grid; }
.prog-empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.prog-letter { display: grid; gap: 10px; }

.prog-letter-p { font-size: 15px; line-height: 1.5; color: var(--text); }
.prog-letter-rw.is-claimed { filter: grayscale(0.8); opacity: 0.6; }
.prog-letter-claimed { display: flex; align-items: center; justify-content: center; gap: 5px; font: 14px/1 var(--font-display); color: var(--good); }

/* ---------- chief profile */
.prog-profile { display: grid; gap: 12px; }
.prog-prof-top { display: flex; align-items: center; gap: 12px; }
.prog-prof-top .btn { margin-bottom: 0; padding-left: 8px; }
.prog-prof-h { font: 20px/1.1 var(--font-display); letter-spacing: 0.02em; color: var(--text); }
.prog-prof-card {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);

  align-items: center;
}

  height: 88px;

}

.prog-prof-id { min-width: 0; display: grid; gap: 5px; }
.prog-label { font: 600 12px/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.prog-name-row { display: flex; gap: 6px; min-width: 0; }
.prog-name-row input {
  flex: 1 1 auto;
  min-width: 0;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--panel-deep);
  box-shadow: inset 0 2px 4px var(--black-a40);
  color: var(--text);
  font: 600 16px/1 var(--font-body);
}
.prog-name-row input[aria-invalid="true"] { border-color: var(--bad); }
.prog-name-row .btn { flex: none; margin-bottom: 3px; }
.prog-name-hint { font-size: 12px; color: var(--muted); min-height: 1.2em; }
.prog-prof-power {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: var(--chip-bg);
}
.prog-prof-power-l { font: 600 12px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.prog-prof-power-v { margin-left: auto; font: 24px/1 var(--font-display); color: var(--text); text-shadow: 0 1px 0 var(--black-a70); }
.prog-avatars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.prog-av {
  position: relative;
  aspect-ratio: 1;
  padding: 0;
  border: 2px solid var(--line);
  border-radius: var(--r);
  background: var(--panel-deep);
  overflow: hidden;
  box-shadow: 0 2px 5px var(--black-a40);
}
.prog-av svg { display: block; width: 100%; height: 100%; }
.prog-av[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-3), 0 0 12px var(--ember-glow); }
.prog-av[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 2px var(--panel-deep);
}
.prog-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.prog-stat { display: flex; align-items: center; gap: 9px; padding: 9px 10px; min-width: 0; }
.prog-stat-ico { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--panel-deep); }
.prog-stat-txt { min-width: 0; display: grid; gap: 3px; }
.prog-stat-l { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-stat-v { font: 17px/1.05 var(--font-display); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.01em; }
.prog-prof-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.prog-prof-links .badge-dot { position: absolute; top: -4px; right: -4px; }

@media (max-width: 374px) {
  .prog-row { gap: 8px; padding: 8px; }
  .prog-row[data-mission] { grid-template-columns: 38px minmax(0, 1fr) auto auto; }
  .prog-row .prog-ico, .prog-row[data-mission] .prog-ico { width: 38px; height: 38px; }
  .prog-row { grid-template-columns: 38px minmax(0, 1fr) auto; }
  .prog-days { gap: 6px; }
  .prog-day-tiles .tile { width: 42px; }
  .prog-dchest, .prog-dchest .tile, .prog-dchest-at { width: 44px; }
  .prog-avatars { gap: 6px; }
  .prog-prof-card { grid-template-columns: 72px minmax(0, 1fr); }
  .prog-prof-avatar { width: 72px; height: 72px; }
}

/* ---------- reduced motion: no ambient pulses or bobbing */
@media (prefers-reduced-motion: reduce) {
  .prog-banner.is-claim .prog-banner-act,
  .prog-chest.is-ready .tile svg,
  .prog-dchest.is-ready .tile svg,
  .prog-day.is-ready .tile { animation: none !important; }
}

<script>
/* ===== core.js ===== */

/* Last Furnace core: window.Game.

const Game = {};
window.Game = Game;
Game.version = 2;

const SAVE_KEY = 'last-furnace-v2';
const RES = ['meat', 'wood', 'coal', 'iron'];
const RES_KEYS = ['meat', 'wood', 'coal', 'iron', 'gems'];
const CORE_KEYS = new Set(['v', 'meta', 'res', 'items', 'timers']);
const OFFLINE_CAP_SEC = 12 * 3600;
const TICK_MS = 250;
const AUTOSAVE_MS = 5000;
const START_RES = { meat: 2500, wood: 2500, coal: 500, iron: 100, gems: 250 };
const START_ITEMS = { speedup_1m: 5, speedup_5m: 3, speedup_1h: 1, crate_meat: 1, crate_wood: 1 };

const RES_INFO = {
  meat: { name: 'Meat', icon: 'meat', building: 'hunter', buildingName: "Hunter's Hut", desc: "Feeds survivors and troops. Hunted at the Hunter's Hut." },
  wood: { name: 'Wood', icon: 'wood', building: 'sawmill', buildingName: 'Sawmill', desc: 'Goes into almost every construction. Cut at the Sawmill.' },
  coal: { name: 'Coal', icon: 'coal', building: 'coalmine', buildingName: 'Coal Mine', desc: 'Fuel for the Furnace and higher-level buildings. Dug at the Coal Mine.' },
  iron: { name: 'Iron', icon: 'iron', building: 'ironmine', buildingName: 'Iron Mine', desc: 'Needed for advanced buildings and troops. Mined at the Iron Mine.' },
  gems: { name: 'Gems', icon: 'gem', desc: 'Premium currency. Finishes timers at once and buys items in the Shop.' },
};
Game.RES = RES.slice();
Game.resInfo = RES_INFO;

// ---------------------------------------------------------------- utilities
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const num = v => (typeof v === 'number' && Number.isFinite(v) ? v : 0);

function clone(v) {
  if (v === undefined) return undefined;
  try { return JSON.parse(JSON.stringify(v)); } catch (e) { return v; }
}
function deepMerge(base, over) {
  if (over === undefined) return base;
  if (!isObj(base) || !isObj(over)) return clone(over);

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}
function setText(node, text) {
  const s = String(text);
  if (node && node.textContent !== s) node.textContent = s;

Game.el = el;
Game.setText = setText;
Game.clamp = clamp;

const reported = new Set();
function reportOnce(key, err) {
  if (reported.has(key)) return;
  reported.add(key);
  console.error(`[Game] ${key} failed`, err);

  get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { window.localStorage.setItem(key, String(value)); return true; } catch (e) { return false; } },
  remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ } },

let isReady = false;

  if (typeof fn !== 'function') return () => {};
  if (!listeners.has(evt)) listeners.set(evt, new Set());
  listeners.get(evt).add(fn);
  if (evt === 'ready' && isReady) queueMicrotask(() => { try { fn({}); } catch (e) { console.error("[Game] 'ready' handler failed", e); } });

  const set = listeners.get(evt);
  if (!set || !set.size) return;
  const p = payload ?? {};
  for (const fn of [...set]) {
    try { fn(p); } catch (e) { console.error(`[Game] '${evt}' handler failed`, e); }

function starPath(cx, cy, R, r, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / n;
    const rr = i % 2 ? r : R;

  for (let i = 0; i < 8; i++) {

// ---------------------------------------------------------------- formatting
Game.fmt = n => {
  n = Number(n);
  if (!Number.isFinite(n)) return '0';
  const neg = n < 0;
  const a = Math.abs(n);
  let s;
  if (a < 10000) s = Math.floor(a).toLocaleString('en-US');
  else {
    for (const [v, u] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) {
      if (a >= v) {
        const x = a / v;
        s = (x < 100 ? Math.floor(x * 10) / 10 : Math.floor(x)) + u;
        break;
      }
    }
  }
  return (neg && s !== '0' ? '-' : '') + s;
};
Game.fmtFull = n => {
  n = Number(n);
  if (!Number.isFinite(n)) return '0';
  return Math.floor(n).toLocaleString('en-US');
};
Game.fmtTime = sec => {
  sec = Math.max(0, Math.ceil(Number(sec) || 0));
  const p = v => String(v).padStart(2, '0');
  if (sec < 60) return sec + 's';
  if (sec < 3600) return `${Math.floor(sec / 60)}m ${p(sec % 60)}s`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}h ${p(Math.floor((sec % 3600) / 60))}m`;
  return `${Math.floor(sec / 86400)}d ${Math.floor((sec % 86400) / 3600)}h`;
};

// ---------------------------------------------------------------- time and debug
let S = null;
Game.S = null;
let booted = false;
let noSave = false;
Game.debug = {
  offsetMs: 0,
  skip(sec) {
    sec = Math.max(0, Number(sec) || 0);
    if (!booted || !S) { Game.debug.offsetMs += sec * 1000; return; }
    let left = sec;
    while (left > 0) {
      const step = Math.min(60, left);
      left -= step;
      Game.debug.offsetMs += step * 1000;
      tickModules(step, Game.now());
      processTimers();
      checkDay();
    }
    lastWall = Game.now();
    S.meta.lastSeen = lastWall;
    render();
  },
  grant(rewards) { Game.grant(rewards, { source: 'debug' }); },
  reset() {
    noSave = true;
    if (loopTimer) clearInterval(loopTimer);
    Game.storage.remove(SAVE_KEY);
    try { window.location.reload(); } catch (e) { /* reload blocked */ }
  },
};
Game.now = () => Date.now() + (Number(Game.debug.offsetMs) || 0);
function todayKey() {
  const d = new Date(Game.now());
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
Game.today = todayKey;

const rmq = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
Game.reducedMotion = !!(rmq && rmq.matches);
try {
  rmq?.addEventListener?.('change', e => {
    Game.reducedMotion = e.matches;
    Game.emit('motion:changed', { reduced: e.matches });
  });
} catch (e) { /* old browsers */ }

// ---------------------------------------------------------------- modules and state
const modules = [];
Game.registerModule = def => {
  if (!def || !def.id) { console.error('[Game] registerModule needs an id'); return; }
  const i = modules.findIndex(m => m.id === def.id);
  if (i >= 0) modules.splice(i, 1, def); else modules.push(def);
  if (booted && S) initSlice(def, S[def.id]);
};
Game.modules = () => modules.map(m => m.id);

function newCoreState() {
  const now = Game.now();
  return {
    v: 2,
    meta: {
      createdAt: now,
      lastSeen: now,
      day: null,
      chiefName: 'Chief ' + (1000 + Math.floor(Math.random() * 9000)),
      avatar: Math.floor(Math.random() * AVATARS.length),
    },
    res: { ...START_RES },
    items: { ...START_ITEMS },
    timers: [],
  };
}

function validTimer(t) {
  return isObj(t) && t.id != null && typeof t.kind === 'string' && Number.isFinite(t.endAt);
}

let isNewGame = false;
function buildState(src) {
  const st = newCoreState();
  const fresh = !(isObj(src) && src.v === 2);
  const s = fresh ? {} : clone(src);
  if (!fresh) {
    // keep slices of modules that are not part of this build so a partial build never erases them
    for (const k of Object.keys(s)) if (!CORE_KEYS.has(k) && !modules.some(m => m.id === k)) st[k] = s[k];
    if (isObj(s.meta)) {
      const m = s.meta;
      for (const k of Object.keys(m)) if (!['createdAt', 'lastSeen', 'day', 'chiefName', 'avatar'].includes(k)) st.meta[k] = m[k];
      if (Number.isFinite(m.createdAt)) st.meta.createdAt = m.createdAt;
      if (Number.isFinite(m.lastSeen)) st.meta.lastSeen = m.lastSeen;
      if (typeof m.day === 'string' || m.day === null) st.meta.day = m.day;
      if (typeof m.chiefName === 'string' && m.chiefName.trim()) st.meta.chiefName = m.chiefName.trim().slice(0, 24);
      if (Number.isInteger(m.avatar)) st.meta.avatar = m.avatar;
    }
    if (isObj(s.res)) for (const k of RES_KEYS) if (Number.isFinite(s.res[k])) st.res[k] = Math.max(0, s.res[k]);
    st.items = {};
    if (isObj(s.items)) for (const [id, n] of Object.entries(s.items)) if (Number.isFinite(n) && n >= 1) st.items[id] = Math.floor(n);
    st.timers = Array.isArray(s.timers)
      ? s.timers.filter(validTimer).map(t => ({
        id: String(t.id),
        kind: t.kind,
        label: String(t.label ?? ''),
        startAt: Number.isFinite(t.startAt) ? t.startAt : t.endAt,
        endAt: t.endAt,
        data: t.data ?? null,
      }))
      : [];
  }
  S = st;
  Game.S = st;
  for (const m of modules) initSlice(m, fresh ? undefined : s[m.id]);
  isNewGame = fresh;
  return st;
}

function initSlice(m, saved) {
  let slice = {};
  try { slice = typeof m.initState === 'function' ? m.initState() : {}; } catch (e) { console.error(`[Game] ${m.id}.initState failed`, e); }
  if (!isObj(slice)) slice = {};
  if (isObj(saved)) {
    slice = deepMerge(slice, clone(saved));
    if (typeof m.migrate === 'function') {
      try {
        const r = m.migrate(slice);
        if (isObj(r)) slice = r;
      } catch (e) { console.error(`[Game] ${m.id}.migrate failed`, e); }
    }
  }
  S[m.id] = slice;
}

function loadSaved() {
  const raw = Game.storage.get(SAVE_KEY);
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    return isObj(data) ? data : null;
  } catch (e) { return null; }
}

Game.power = () => {
  let p = 0;
  for (const m of modules) {
    if (typeof m.power !== 'function') continue;
    try { p += num(Number(m.power())); } catch (e) { reportOnce(`${m.id}.power`, e); }
  }
  return Math.floor(p);
};

// ---------------------------------------------------------------- resources
function costParts(cost) {
  const res = {};
  const items = {};
  if (!isObj(cost)) return { res, items };
  for (const k of RES_KEYS) { const v = num(cost[k]); if (v > 0) res[k] = v; }
  if (isObj(cost.items)) for (const [id, n] of Object.entries(cost.items)) { const v = num(n); if (v > 0) items[id] = v; }
  return { res, items };
}
Game.has = cost => {
  if (!S) return false;
  const { res, items } = costParts(cost);
  for (const [k, v] of Object.entries(res)) if (num(S.res[k]) < v) return false;
  for (const [id, v] of Object.entries(items)) if (num(S.items[id]) < v) return false;
  return true;
};
Game.missing = cost => {
  const out = {};
  if (!S) return out;
  const { res, items } = costParts(cost);
  for (const [k, v] of Object.entries(res)) { const d = v - num(S.res[k]); if (d > 0) out[k] = Math.ceil(d); }
  for (const [id, v] of Object.entries(items)) {
    const d = v - num(S.items[id]);
    if (d > 0) (out.items ||= {})[id] = Math.ceil(d);
  }
  return out;
};
Game.spend = (cost, reason = '') => {
  if (!Game.has(cost)) return false;
  const { res, items } = costParts(cost);
  for (const [k, v] of Object.entries(res)) S.res[k] = Math.max(0, num(S.res[k]) - v);
  for (const [id, v] of Object.entries(items)) {
    S.items[id] = num(S.items[id]) - v;
    if (S.items[id] <= 0) delete S.items[id];
  }
  if (res.gems) Game.emit('gems:spent', { amount: res.gems, reason: String(reason || '') });
  Game.emit('spent', { cost: { ...res, items }, reason: String(reason || '') });
  return true;
};
Game.grant = (rewards, opts = {}) => {
  if (!S || !isObj(rewards)) return;
  const { res, items } = costParts(rewards);
  for (const [k, v] of Object.entries(res)) S.res[k] = num(S.res[k]) + v;
  for (const [id, v] of Object.entries(items)) S.items[id] = num(S.items[id]) + Math.floor(v);
  const o = isObj(opts) ? opts : {};
  Game.emit('granted', { rewards, source: o.source || '' });
  if (o.popup) Game.rewardPopup(rewards, o.title);
};

// ---------------------------------------------------------------- items
Game.itemDefs = {};
Game.defineItem = (id, def = {}) => {
  if (!id) return null;
  Game.itemDefs[id] = { name: id, icon: 'crate', desc: '', ...def, id };
  return Game.itemDefs[id];
};
Game.itemCount = id => num(S?.items?.[id]);
Game.itemDesc = id => {
  const d = Game.itemDefs[id];
  if (!d) return '';
  try { return typeof d.desc === 'function' ? String(d.desc()) : String(d.desc ?? ''); } catch (e) { return ''; }
};
Game.useItem = (id, count = 1) => {
  const def = Game.itemDefs[id];
  const n = Math.floor(Number(count) || 0);
  if (!S || !def || typeof def.use !== 'function' || n < 1 || Game.itemCount(id) < n) return false;
  S.items[id] -= n;
  if (S.items[id] <= 0) delete S.items[id];
  let r;
  try { r = def.use(n); } catch (e) { console.error(`[Game] item ${id} use failed`, e); r = false; }
  if (r === false) {
    S.items[id] = num(S.items[id]) + n;
    return false;
  }
  Game.emit('item:used', { id, count: n });
  return true;
};

const CRATE_BASE = { meat: 1000, wood: 1000, coal: 300, iron: 80 };
Game.crateAmount = type => {
  const fl = Math.max(1, Math.floor(Number(Game.furnaceLevel()) || 1));
  const f = (1 + (fl - 1) * 0.35) * Math.pow(1.08, fl - 1);
  return Math.round(((CRATE_BASE[type] || 0) * f) / 10) * 10;
};

[
  ['speedup_1m', 60, '1m Speedup', '', 'Cuts 1 minute from any build or training timer.'],
  ['speedup_5m', 300, '5m Speedup', '', 'Cuts 5 minutes from any build or training timer.'],
  ['speedup_1h', 3600, '1h Speedup', 'rare', 'Cuts 1 hour from any build or training timer.'],

const ITEM_GROUPS = [
  { id: 'all', label: 'All' },

function itemGroup(def) {

  if (num(def.speedupSec) > 0) return 'speedup';
  if (/^crate_/.test(def.id)) return 'resource';

}

  const gb = ITEM_GROUPS.findIndex(g => g.id === itemGroup(b.def));

// ---------------------------------------------------------------- perks
const PERK_BASE = { builders: 1, freeFinishSec: 60, productionPct: 0, idleCapHours: 8, trainSpeedPct: 0, buildSpeedPct: 0 };
const perkFns = new Map();
Game.registerPerk = (name, fn) => {

  perkFns.get(name).push(fn);
};
Game.perk = name => {

  for (const fn of perkFns.get(name) || []) {
    try {
      const x = Number(fn());
      if (Number.isFinite(x)) v += x;
    } catch (e) { reportOnce(`perk ${name}`, e); }
  }
  if (name === 'builders') v = Math.min(2, Math.max(1, Math.floor(v)));
  return v;
};
Game.furnaceLevel = () => {
  let lv = 1;
  try { lv = Number(Game.city?.level?.('furnace') ?? 1); } catch (e) { lv = 1; }
  return Number.isFinite(lv) && lv >= 1 ? lv : 1;
};
Game.gemCostForSeconds = sec => {

  return Math.max(1, Math.ceil(1.5 * Math.pow(s / 60, 0.85)));

// ---------------------------------------------------------------- timers (wall clock, persisted)
const timerHandlers = new Map();
let timerSeq = 0;
function completeTimer(t) {
  if (!S) return false;
  const i = S.timers.indexOf(t);
  if (i < 0) return false;
  S.timers.splice(i, 1);
  for (const fn of timerHandlers.get(t.kind) || []) {
    try { fn(t); } catch (e) { console.error(`[Game] timer '${t.kind}' onComplete failed`, e); }
  }
  Game.emit('timer:completed', { timer: t });
  return true;
}
function processTimers() {
  if (!S || !S.timers.length) return;
  const now = Game.now();
  const due = S.timers.filter(t => t.endAt <= now && timerHandlers.has(t.kind));
  if (!due.length) return;
  due.sort((a, b) => a.endAt - b.endAt);
  for (const t of due) completeTimer(t);
}
Game.timers = {
  start({ id, kind, label = '', durationSec = 0, data = null } = {}) {
    if (!S) throw new Error('Game.timers.start called before boot');
    if (!kind) throw new Error('Game.timers.start needs a kind');
    const now = Game.now();
    const tid = id != null && id !== '' ? String(id) : `${kind}-${now.toString(36)}-${++timerSeq}`;
    const old = S.timers.findIndex(t => t.id === tid);
    if (old >= 0) S.timers.splice(old, 1);
    const t = { id: tid, kind: String(kind), label: String(label ?? ''), startAt: now, endAt: now + Math.max(0, Number(durationSec) || 0) * 1000, data: data ?? null };
    S.timers.push(t);
    if (t.endAt <= now) queueMicrotask(processTimers);
    return t;
  },
  onComplete(kind, fn) {
    if (!kind || typeof fn !== 'function') return;
    if (!timerHandlers.has(kind)) timerHandlers.set(kind, []);
    timerHandlers.get(kind).push(fn);
    if (booted) queueMicrotask(processTimers);
  },
  get(id) { return S ? S.timers.find(t => t.id === String(id)) || null : null; },
  list(kind) {
    if (!S) return [];
    return S.timers.filter(t => kind == null || t.kind === kind).sort((a, b) => a.endAt - b.endAt);
  },
  remaining(id) {
    const t = Game.timers.get(id);
    return t ? Math.max(0, Math.ceil((t.endAt - Game.now()) / 1000)) : 0;
  },
  progress(id) {
    const t = Game.timers.get(id);
    if (!t) return 1;
    const total = t.endAt - t.startAt;
    return total <= 0 ? 1 : clamp((Game.now() - t.startAt) / total, 0, 1);
  },
  reduce(id, sec) {
    const t = Game.timers.get(id);
    if (!t) return false;
    t.endAt -= Math.max(0, Number(sec) || 0) * 1000;
    if (t.endAt <= Game.now()) completeTimer(t);
    return true;
  },
  finishNow(id) {
    const t = Game.timers.get(id);
    if (!t) return false;
    t.endAt = Math.min(t.endAt, Game.now());
    return completeTimer(t);
  },
  cancel(id) {
    const t = Game.timers.get(id);
    if (!t) return null;
    S.timers.splice(S.timers.indexOf(t), 1);
    return t;
  },
};

// ---------------------------------------------------------------- screens, navigation, badges
const screens = new Map();
const navs = new Map();
const badges = {};
let currentScreen = null;
let lastTab = 'city';
let pendingNav = null;

Game.registerScreen = (id, def = {}) => {
  if (!id) return;
  const rec = { id: String(id), def: def || {}, el: null, mounted: false };
  const old = screens.get(rec.id);
  if (old?.el) old.el.remove();
  screens.set(rec.id, rec);
  if (booted) {
    mountScreen(rec);
    buildTabbar();
  }
};
Game.registerNav = (prefix, fn) => {

};
Game.screen = () => currentScreen;

function tabScreens() {
  return [...screens.values()].filter(r => r.def.tab).sort((a, b) => num(a.def.tab.order ?? 99) - num(b.def.tab.order ?? 99));
}
function firstScreenId() {
  if (screens.has('city')) return 'city';
  return tabScreens()[0]?.id ?? screens.keys().next().value ?? null;
}
function mountScreen(rec) {
  if (rec.mounted) return;
  const host = document.getElementById('screens');
  if (!host) return;
  const sec = document.createElement('section');
  sec.className = 'screen' + (rec.def.fullBleed ? ' full-bleed' : '');
  sec.id = 'screen-' + rec.id;
  sec.dataset.screen = rec.id;
  sec.hidden = true;
  sec.setAttribute('aria-label', rec.def.tab?.label || rec.def.title || rec.id);
  host.appendChild(sec);
  rec.el = sec;
  rec.mounted = true;
  try { rec.def.mount?.(sec); } catch (e) { console.error(`[Game] screen '${rec.id}' failed to mount`, e); }
}
function runScreenUpdate(rec) {
  if (!rec || !rec.el || typeof rec.def.update !== 'function') return;
  try { rec.def.update(rec.el); } catch (e) { reportOnce(`screen '${rec.id}' update`, e); }
}

  if (!rec.mounted) mountScreen(rec);
  for (const r of screens.values()) if (r.el) r.el.hidden = r.id !== id;
  const changed = currentScreen !== id;
  currentScreen = id;
  if (rec.def.tab) lastTab = id;
  syncTabbar();
  runScreenUpdate(rec);
  if (changed) Game.emit('screen:shown', { id });
  return true;
}
Game.navigate = target => {
  const t = String(target || 'city');
  if (!booted || !isReady) { pendingNav = t; return; }
  closeAllSheets();
  const head = t.split(':')[0];
  let best = null;
  for (const prefix of navs.keys()) {
    if ((t === prefix || t.startsWith(prefix + ':')) && (!best || prefix.length > best.length)) best = prefix;
  }
  const screenId = screens.has(t) ? t : screens.has(head) ? head : null;
  if (screenId) showScreen(screenId);
  else if (!best) showScreen(firstScreenId());
  if (best) {
    const rest = t === best ? '' : t.slice(best.length + 1);
    try { navs.get(best)(rest, t); } catch (e) { console.error(`[Game] nav '${best}' failed`, e); }
  }
  Game.emit('nav', { target: t });
};
Game.back = () => Game.navigate(lastTab || 'city');
Game.badge = (tabId, n) => {
  const v = n === true ? 1 : Math.max(0, Math.floor(Number(n) || 0));
  if ((badges[tabId] || 0) === v) return;
  badges[tabId] = v;
  applyBadge(tabId);
};
Game.badgeCount = tabId => badges[tabId] || 0;
function applyBadge(tabId) {
  const bar = document.getElementById('tabbar');
  const btn = bar?.querySelector(`[data-tab="${CSS.escape(tabId)}"]`);
  if (!btn) return;
  const v = badges[tabId] || 0;
  const dot = btn.querySelector('.badge-dot');
  const sr = btn.querySelector('.tab-sr');
  dot.hidden = v === 0;
  dot.classList.toggle('has-count', v > 1);
  dot.textContent = v > 1 ? (v > 99 ? '99+' : String(v)) : '';

}
function buildTabbar() {

    const tab = r.def.tab;
    return `<button type="button" class="tab" id="tab-${esc(r.id)}" data-tab="${esc(r.id)}"><span class="tab-icon">${Game.icon(tab.icon || 'star', 28)}<span class="badge-dot" aria-hidden="true" hidden></span></span><span class="tab-label">${esc(tab.label || r.id)}</span><span class="sr-only tab-sr"></span></button>`;
  }).join('')}</div>`;
  bar.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => Game.navigate(b.dataset.tab)));

}

const sheetStack = [];

function syncAction(a) {
  const d = a.def;
  let label = '';
  let kind = 'gold';
  let dis = false;
  try {
    label = String((typeof d.label === 'function' ? d.label() : d.label) ?? '');
    kind = String((typeof d.kind === 'function' ? d.kind() : d.kind) || 'gold');
    dis = !!(typeof d.disabled === 'function' ? d.disabled() : d.disabled);
  } catch (e) { reportOnce('sheet action state', e); }

Game.sheet = (opts = {}) => {
  const n = ++sheetSeq;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap' + (opts.className ? ' ' + opts.className : '');
  wrap.style.zIndex = String(++zTop);
  wrap.innerHTML = `<div class="sheet-scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-${n}-title" tabindex="-1"><div class="sheet-head"><h2 class="sheet-title" id="sheet-${n}-title"></h2><button type="button" class="sheet-close" aria-label="Close">${Game.icon('close', 18)}</button></div><div class="sheet-body"></div><div class="sheet-actions" hidden></div></section>`;
  const panel = wrap.querySelector('.sheet');
  const body = wrap.querySelector('.sheet-body');
  const actionsEl = wrap.querySelector('.sheet-actions');
  const titleEl = wrap.querySelector('.sheet-title');
  titleEl.textContent = opts.title ?? '';
  if (opts.body instanceof Node) body.appendChild(opts.body);
  else if (opts.body != null) body.innerHTML = String(opts.body);
  const prevFocus = document.activeElement;
  const acts = [];
  let closed = false;
  const handle = {
    el: wrap,
    body,
    panel,
    get closed() { return closed; },
    close,
    refresh,
    setTitle(t) { titleEl.textContent = t ?? ''; },
  };
  function close() {
    if (closed) return;
    const wasTop = sheetStack[sheetStack.length - 1] === handle;
    closed = true;
    const i = sheetStack.indexOf(handle);
    if (i >= 0) sheetStack.splice(i, 1);
    wrap.classList.remove('open');
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), Game.reducedMotion ? 0 : 240);
    try { opts.onClose?.(handle); } catch (e) { console.error('[Game] sheet onClose failed', e); }
    if (wasTop && !rewardOpen && prevFocus && prevFocus.isConnected && typeof prevFocus.focus === 'function') {
      try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }
  function refresh() {
    if (closed) return;
    if (typeof opts.update === 'function') {
      try { opts.update(body, handle); } catch (e) { reportOnce(`sheet '${opts.title || ''}' update`, e); }
    }
    if (closed) return;
    for (const a of acts) syncAction(a);
  }
  for (const def of (opts.actions || []).filter(Boolean)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    if (def.id) btn.dataset.action = def.id;
    const a = { def, btn, label: null, kind: null };
    btn.addEventListener('click', () => {
      if (btn.disabled || closed) return;

  return handle;
};

      let total = 0;

        ? `${Game.icon('check', 18)}<span>Free</span>`
        : `<span>Finish now</span><span class="btn-cost">${Game.icon('gem', 18)}${Game.fmtFull(Game.gemCostForSeconds(Game.timers.remaining(id)))}</span>`),
      kind: () => (free() ? 'green' : 'gold'),
      onClick: () => {
        const t = Game.timers.get(id);
        if (!t) return undefined;
        const rem = Game.timers.remaining(id);
        if (rem <= Game.perk('freeFinishSec')) {
          Game.timers.finishNow(id);
          Game.emit('speedup:used', { seconds: rem, timerId: id, kind: t.kind, free: true });
          return undefined;

        if (!Game.spend({ gems: cost }, 'speedup')) { Game.needGems(cost); return false; }
        Game.timers.finishNow(id);

      },

  }

  }

  lastWall = now;
  if (gap > 20 || dt > 20) {
    // the page was suspended or the clock moved: settle timers, then hand the gap to offline()
    processTimers();
    runOffline(Math.min(OFFLINE_CAP_SEC, Math.max(gap, dt)));
    dt = TICK_MS / 1000;
  }
  tickModules(clamp(dt, 0, 5), now);

  try { buildState(src); } catch (e) {
    console.error('[Game] saved game could not be loaded, starting a new game', e);
    buildState(null);
  }
  Game.isNew = isNewGame;
  const now = Game.now();
  const elapsed = isNewGame ? 0 : Math.min(OFFLINE_CAP_SEC, Math.max(0, (now - num(S.meta.lastSeen)) / 1000));
  processTimers();
  runOffline(elapsed);
  if (isNewGame) Game.emit('game:new', {});
  checkDay();
  buildHud();
  toastHost();
  for (const rec of screens.values()) mountScreen(rec);
  buildTabbar();
  showScreen(firstScreenId());
  isReady = true;
  Game.isReady = true;
  Game.emit('ready', {});
  updateHud();
  if (pendingNav) {

  }
  S.meta.lastSeen = Game.now();
  lastPerf = performance.now();
  lastWall = Game.now();
  lastSave = lastPerf;
  loopTimer = setInterval(frame, TICK_MS);

// ================================================================ small helpers
const esc = s => Game.esc(s);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const S = () => Game.S;
const C = () => Game.S.city;
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

}
function nice(n) {
