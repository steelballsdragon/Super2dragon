function openReveal(results, n) {
  const multi = results.length > 1;
  const body = Game.el(`<div class="mil-reveal ${multi ? 'is-multi' : 'is-single'}">
    <div class="mil-reveal-rays" aria-hidden="true"></div>
    <div class="mil-rgrid">${results.map(revealCardHtml).join('')}</div>
    <div class="mil-rsum" hidden aria-live="polite"></div>
    <div class="mil-rbar">
      <button type="button" class="btn ghost" data-act="skip" id="mil-reveal-skip">Skip</button>
      <button type="button" class="btn gold" data-act="again" id="mil-reveal-again" hidden></button>
      <button type="button" class="btn green" data-act="ok" id="mil-reveal-ok" hidden>OK</button>
    </div>
  </div>`);
  const timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const cards = [...body.querySelectorAll('.mil-rc')];
  let done = false;
  const flip = i => cards[i]?.classList.add('is-flipped');
  function finish() {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    cards.forEach(c => c.classList.add('is-flipped'));
    const fresh = results.filter(r => r.isNew).map(r => HERO[r.heroId]);
    const shardN = results.filter(r => !r.isNew).length;
    const parts = [];
    if (fresh.length) parts.push(`New ${fresh.length === 1 ? 'hero' : 'heroes'}: <b>${fresh.map(h => `<span class="rarity-${h.rarity} rarity-text">${esc(h.name)}</span>`).join(', ')}</b>`);
    if (shardN) parts.push(`${shardN} shard ${shardN === 1 ? 'drop' : 'drops'}`);
    parts.push(`Legendary hero within ${pityLeft()} ${pityLeft() === 1 ? 'pull' : 'pulls'}`);
    const sum = body.querySelector('.mil-rsum');
    sum.innerHTML = parts.map(x => `<span>${x}</span>`).join('<span class="mil-dotsep" aria-hidden="true"></span>');
    sum.hidden = false;
    body.querySelector('#mil-reveal-skip').hidden = true;
    const again = body.querySelector('#mil-reveal-again');
    again.innerHTML = `<span>Again x${n}</span><span class="btn-cost">${costLabel(n)}</span>`;
    again.hidden = false;
    body.querySelector('#mil-reveal-ok').hidden = false;
    try { body.querySelector('#mil-reveal-ok').focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  body.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.act === 'skip') finish();
    else if (b.dataset.act === 'ok') sheet.close();
    else if (b.dataset.act === 'again') { sheet.close(); startRecruit(n); }
  });
  const sheet = Game.sheet({ title: multi ? 'Recruit x10' : 'Recruit', body, className: 'mil-reveal-sheet', onClose: () => { timers.forEach(clearTimeout); } });
  if (reduced()) { body.classList.add('is-instant'); finish(); return sheet; }
  let t = 380;
  cards.forEach((c, i) => {
    const leg = results[i].rarity === 'legendary';
    const epic = results[i].rarity === 'epic';
    if (leg || (epic && !multi)) { later(t, () => c.classList.add('is-charging')); t += leg ? 650 : 380; }
    later(t, () => flip(i));
    t += multi ? 210 : 300;
  });
  later(t + 280, finish);
  return sheet;
}

// ================================================================ explore screen
const MAP_PTS = [[12, 58], [36, 61], [61, 57], [86, 53], [72, 35], [46, 37], [20, 32], [28, 12], [55, 15], [83, 11]];
const MAP_H = 72;
function mapPathD(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}

// ================================================================ battle
function planBattle(squad, foes, myPow, foePow, win) {
  const pos = ['mid', 'top', 'bot'];
  const A = squad.slice().sort((a, b) => CLASS_ORDER.indexOf(HERO[a].cls) - CLASS_ORDER.indexOf(HERO[b].cls))
    .map((id, i) => ({ side: 'a', id, pos: pos[i], w: Math.max(1, heroPower(id)), cls: HERO[id].cls }));
  const B = foes.map((f, i) => ({ side: 'b', type: f.type, boss: !!f.boss, pos: pos[i], w: f.boss ? 1.7 : 1 }));
  const split = (units, total) => {
    const w = units.reduce((t, u) => t + u.w, 0);
    units.forEach(u => { u.max = Math.max(10, Math.round((total * u.w) / w)); u.hp = u.max; });
  };
  split(A, Math.max(40, Math.round(myPow * 4)));
  split(B, Math.max(40, Math.round(foePow * 4)));
  const W = win ? A : B;
  const L = win ? B : A;
  const ratioW = Math.max(0.5, win ? myPow / foePow : foePow / myPow);
  const keep = clamp(1 - 0.75 / ratioW, 0.12, 0.9);
  const rnd = () => 0.8 + Math.random() * 0.4;
  // winner hits: kill every loser in order
  const hitsW = 7;
  const wq = [];
  L.forEach((u, i) => {
    const k = Math.floor(hitsW / L.length) + (i >= L.length - (hitsW % L.length) ? 1 : 0);
    const ws = Array.from({ length: k }, rnd);
    const tw = ws.reduce((t, v) => t + v, 0);
    let left = u.max;
    ws.forEach((wv, j) => {
      const dmg = j === k - 1 ? left : Math.max(1, Math.round((u.max * wv) / tw));
      left -= dmg;
      wq.push({ t: i, d: Math.max(1, dmg) });
    });
  });
  // loser hits: wound the winners, nobody falls
  const hitsL = 5;
  const lq = [];
  const counts = W.map(() => 0);
  const start = Math.floor(Math.random() * W.length);
  for (let j = 0; j < hitsL; j++) counts[(start + j) % W.length]++;
  const order = [];
  W.forEach((u, i) => {
    if (!counts[i]) return;
    const loss = u.max * (1 - keep);
    for (let j = 0; j < counts[i]; j++) order.push({ t: i, d: Math.max(1, Math.round((loss / counts[i]) * rnd())) });
  });
  order.sort(() => Math.random() - 0.5);
  lq.push(...order);
  // interleave: the player strikes first, the winner lands the final blows
  const aQ = win ? wq : lq;
  const bQ = win ? lq : wq;
  const seq = [];
  let ai = 0;
  let bi = 0;
  while (ai < aQ.length || bi < bQ.length) {
    if (ai < aQ.length) seq.push(['a', aQ[ai++]]);
    if (bi < bQ.length) seq.push(['b', bQ[bi++]]);
  }
  // simulate to pick live attackers and the final state
  const hp = { a: A.map(u => u.max), b: B.map(u => u.max) };
  const events = [];
  for (const [side, hit] of seq) {
    const foeSide = side === 'a' ? 'b' : 'a';
    const tgtList = foeSide === 'a' ? A : B;
    const winSide = win ? 'a' : 'b';
    let ti = hit.t;
    if (hp[foeSide][ti] <= 0) ti = tgtList.findIndex((u, i) => hp[foeSide][i] > 0);
    if (ti < 0) continue;
    let d = hit.d;
    if (side !== winSide) d = Math.min(d, Math.max(0, hp[foeSide][ti] - Math.ceil(tgtList[ti].max * 0.06)));
    const alive = (side === 'a' ? A : B).map((u, i) => i).filter(i => hp[side][i] > 0);
    if (!alive.length) continue;
    const from = alive[Math.floor(Math.random() * alive.length)];
    hp[foeSide][ti] = Math.max(0, hp[foeSide][ti] - d);
    events.push({ side, from, to: ti, dmg: Math.max(1, Math.round(d)), crit: Math.random() < 0.18, hpAfter: hp[foeSide][ti] });
  }
  // make sure the loser side is fully down at the end
  const loserSide = win ? 'b' : 'a';
  hp[loserSide].forEach((v, i) => { if (v > 0) { const winSide = win ? 'a' : 'b'; const al = hp[winSide].findIndex(x => x > 0); events.push({ side: winSide, from: Math.max(0, al), to: i, dmg: Math.round(v), crit: true, hpAfter: 0 }); hp[loserSide][i] = 0; } });
  return { A, B, events, final: hp };
}

function openBattle() {
  if (!Game.S) return null;
  const s = mil();
  const stage = s.stage + 1;
  if (stage > MAX_STAGE) { Game.toast('Every stage is cleared'); return null; }
  const squad = squadIds();
  if (!squad.length) { Game.navigate('heroes:squad'); return null; }
  const myPow = battlePower();
  const foePow = enemyPower(stage);
  const ratio = myPow / Math.max(1, foePow);
  const win = ratio * (0.92 + Math.random() * 0.16) >= 1;
  const foes = stageEnemies(stage);
  const plan = planBattle(squad, foes, myPow, foePow, win);
  const unitHtml = u => (u.side === 'a'
    ? `<div class="mil-unit is-ally pos-${u.pos}" data-side="a"><div class="mil-unit-fig">${porHtml(u.id)}${clsBadge(u.id, 11)}</div><div class="mil-hp"><i></i></div></div>`
    : `<div class="mil-unit is-foe pos-${u.pos}${u.boss ? ' is-boss' : ''}" data-side="b"><div class="mil-unit-fig">${enemySvg(u.type, u.boss)}</div><div class="mil-hp is-foe"><i></i></div></div>`);
  const body = Game.el(`<div class="mil-battle">
    <div class="mil-bhead">
      <div class="mil-bside"><span class="mil-bside-k">Your squad</span><span class="mil-bside-v">${Game.icon('power', 16)}${fmtFull(myPow)}</span></div>
      <span class="mil-bvs">${Game.icon('sword', 22)}</span>
      <div class="mil-bside is-foe"><span class="mil-bside-k">${esc(isBoss(stage) ? ENEMIES[foes[0].type].boss : ENEMIES[foes[0].type].plural)}</span><span class="mil-bside-v">${Game.icon('power', 16)}${fmtFull(foePow)}</span></div>
    </div>
    <div class="mil-arena is-intro">
      ${arenaBgSvg()}
      ${plan.A.map(unitHtml).join('')}
      ${plan.B.map(unitHtml).join('')}
      <span class="chip mil-troopchip">${Game.icon('troop_infantry', 16)}${fmtFull(totalTroops())} troops</span>
      <div class="mil-fx" aria-hidden="true"></div>
      <div class="mil-banner" hidden><span class="mil-banner-t"></span></div>
    </div>
    <div class="mil-bres" hidden aria-live="polite"></div>
    <div class="mil-bbar">
      <button type="button" class="btn ghost" data-act="skip" id="mil-battle-skip">Skip</button>
      <button type="button" class="btn ghost" data-act="close" id="mil-battle-close" hidden>Continue</button>
      <button type="button" class="btn gold" data-act="again" id="mil-battle-next" hidden></button>
    </div>
  </div>`);
  const arena = body.querySelector('.mil-arena');
  const fx = body.querySelector('.mil-fx');
  const els = { a: [...body.querySelectorAll('.mil-unit[data-side="a"]')], b: [...body.querySelectorAll('.mil-unit[data-side="b"]')] };
  const units = { a: plan.A, b: plan.B };
  const timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  let resolved = false;
  let shown = false;
  let rewards = null;
  let heroGift = null;

  function resolve() {
    if (resolved) return;
    resolved = true;
    const first = win && mil().stage === stage - 1;
    if (first) {
      mil().stage = stage;
      rewards = stageRewards(stage);
      Game.grant(rewards, { source: 'stage' });
      const hid = STAGE_HEROES[stage];
      if (hid) heroGift = { id: hid, result: grantHero(hid, 'stage') };
    }
    Game.emit('battle:fought', { stage, win: !!win });
    if (first) Game.emit('stage:cleared', { stage });
    updateBadges(true);
  }

function lossTips(stage) {

  }
  const books = Game.itemCount('xp_book');
  const cap = maxLevel();
  const levelable = sq.filter(id => heroRec(id).lv < cap).sort((a, b) => heroRec(a).lv - heroRec(b).lv);
  if (levelable.length && books > 0) tips.push({ icon: 'xp', title: 'Level up heroes', text: `You have ${fmtFull(books)} XP ${books === 1 ? 'Book' : 'Books'} to use.`, go: 'heroes:hero:' + levelable[0] });

    case 'builder':

function canBuy(p) {
  if (!p) return { ok: false, code: 'unknown', label: 'Unavailable' };
  if (!ready()) return { ok: false, code: 'not-ready', label: usd(p.usd) };
  const s = sh();

  if (p.kind === 'builder' && vipLevel() >= VIP_BUILDER_LV) return { ok: false, code: 'included', label: 'In VIP 6' };
  if (p.limit && num(s.counts[p.id]) >= p.limit) return { ok: false, code: 'sold-out', label: 'Sold out' };
  if (p.dailyLimit) {
    ensureDay();
    if (num(s.dayCounts[p.id]) >= p.dailyLimit) return { ok: false, code: 'daily-limit', label: 'Tomorrow' };
  }
  return { ok: true, code: 'ok', label: priceOf(p) };
}
const REASONS = {
  owned: 'Already purchased.',
  included: 'Your VIP 6 already includes a second builder.',
  'sold-out': 'Sold out.',
  'daily-limit': 'Already bought today. Back tomorrow.',
  unknown: 'That offer is not available.',
  'not-ready': 'The store is still loading.',
};

function viewOf(p) {
  const c = canBuy(p);
  return {
    id: p.id,
    type: p.type,
    kind: p.kind,
    title: p.title,
    description: p.desc || '',
    price: priceOf(p),
    priceUsd: p.usd,
    currency: 'USD',
    vipPoints: vipPtsFor(p),
    limit: p.limit || null,
    dailyLimit: p.dailyLimit || null,
    contents: contentsOf(p),
    purchasable: c.ok,
    reason: c.ok ? null : c.code,
  };
}

// applies a product's effect and returns what the reward popup shows
function applyProduct(p) {
  const s = sh();
  switch (p.kind) {
    case 'gems': {
      const first = !s.first[p.id];
      s.first[p.id] = true;
      return { rewards: { gems: first ? p.gems * 2 : p.gems }, title: first ? 'Gems doubled' : p.title };
    }
    case 'card': {
      const c = s.card;
      const t = today();
      if (c.end != null && t <= c.end) c.end += p.days;
      else {
        c.start = t;
        c.end = t + p.days - 1;
        c.last = null;
      }
      return { rewards: contentsOf(p), title: p.title };
    }
    default:
      return { rewards: contentsOf(p), title: p.title };
  }
}

// Grants a paid product once per transaction id. Real providers may call this again for the same transaction
// (pending or unacknowledged purchases re-reported at startup); the second call does nothing.
function deliver(productId, transactionId, meta = {}) {
  const p = product(productId);
  if (!p) return { ok: false, error: 'unknown-product' };
  if (!ready()) return { ok: false, error: 'not-ready' };
  const s = sh();
  const tx = String(transactionId || 'LOCAL-' + randId());
  if (s.txs.includes(tx)) return { ok: true, duplicate: true, transactionId: tx };
  s.txs.push(tx);
  if (s.txs.length > TX_MAX) s.txs.splice(0, s.txs.length - TX_MAX);
  const before = vipLevel();
  const { rewards, title } = applyProduct(p);
  s.counts[p.id] = num(s.counts[p.id]) + 1;
  if (p.dailyLimit) {
    ensureDay();
    s.dayCounts[p.id] = num(s.dayCounts[p.id]) + 1;
  }
  if (p.type === 'non_consumable') s.owned[p.id] = true;
  const pts = vipPtsFor(p);
  s.vipPts = vipPoints() + pts;
  s.spentUsd = Math.round((num(s.spentUsd) + p.usd) * 100) / 100;
  s.history.unshift({ tx, id: p.id, title: p.title, usd: p.usd, at: Game.now(), test: !!meta.test });
  if (s.history.length > HISTORY_MAX) s.history.length = HISTORY_MAX;
  rewards.custom = (rewards.custom || []).concat({ icon: 'vip', name: 'VIP Points', count: '+' + fmtFull(pts), rarity: 'legendary' });
  Game.grant(rewards, { source: 'purchase', popup: meta.popup !== false, title });
  const after = vipLevel();
  if (after > before) vipUp(before, after);
  Game.emit('purchase:completed', { productId: p.id, transactionId: tx, priceUsd: p.usd, test: !!meta.test });
  try { Game.save?.(); } catch (e) { /* core saves again within 5 s */ }
  refreshNow();
  return { ok: true, transactionId: tx };
}

async function purchase(productId) {
  const p = product(productId);
  if (!p) return { ok: false, error: 'unknown-product' };
  if (!ready()) return { ok: false, error: 'not-ready' };
  const c = canBuy(p);
  if (!c.ok) {
    Game.toast(REASONS[c.code] || 'Not available right now.');
    return { ok: false, error: c.code };
  }
  if (inFlight) return { ok: false, error: 'busy' };
  if (!provider || typeof provider.purchase !== 'function') return { ok: false, error: 'no-provider' };
  inFlight = p.id;
  refreshNow();
  let res;
  try {
    res = await provider.purchase(viewOf(p));
  } catch (e) {
    console.error('[shop] purchase failed', e);
    res = { ok: false, error: 'failed' };
  } finally {
    inFlight = null;
  }
  if (!res || !res.ok) {
    const error = res?.error || 'cancelled';
    if (error !== 'cancelled') Game.toast('The purchase did not go through.', 'bad');
    refreshNow();
    return { ok: false, error };
  }
  const d = deliver(p.id, res.transactionId, { test: !!provider.isTest });
  if (d.ok && typeof provider.finish === 'function') {
    try { await provider.finish({ ...res, productId: p.id, type: p.type }); } catch (e) { console.error('[shop] finish failed', e); }
  }
  return d.ok ? { ok: true, transactionId: d.transactionId } : { ok: false, error: d.error };
}

async function restore() {
  if (!ready() || !provider) return { ok: false, error: 'not-ready', restored: 0 };
  let list = [];
  try { list = typeof provider.restore === 'function' ? await provider.restore() : []; } catch (e) {
    console.error('[shop] restore failed', e);
    return { ok: false, error: 'failed', restored: 0 };
  }
  const s = sh();
  let restored = 0;
  for (const r of Array.isArray(list) ? list : []) {
    const p = product(r?.productId);
    if (!p || p.type !== 'non_consumable' || s.owned[p.id]) continue;
    s.owned[p.id] = true;
    s.counts[p.id] = Math.max(1, num(s.counts[p.id]));
    if (r.transactionId && !s.txs.includes(String(r.transactionId))) s.txs.push(String(r.transactionId));
    restored++;
  }
  if (restored) {
    try { Game.save?.(); } catch (e) { /* saved by the loop */ }
    refreshNow();
  }
  return { ok: true, restored };
}

function setProvider(p) {
  if (!p || typeof p.purchase !== 'function') {
    console.error('[shop] a store provider needs a purchase(product) method');

  try {
    const r = p.init?.({ products: PRODUCTS.map(x => ({ id: x.id, type: x.type, title: x.title, priceUsd: x.usd })), deliver });
    if (r && typeof r.then === 'function') r.then(() => refreshNow(), e => console.error('[shop] provider init failed', e));
  } catch (e) { console.error('[shop] provider init failed', e); }
  refreshNow();
  return provider;
}

function limitNote(p) {
  const s = sh();
  if (p.kind === 'builder') {
    if (s.owned[p.id]) return 'Active. You have two builders.';
    if (vipLevel() >= VIP_BUILDER_LV) return 'Included with your VIP 6.';
    return `Permanent. Also unlocked at VIP ${VIP_BUILDER_LV}.`;
  }
  if (p.type === 'non_consumable') return s.owned[p.id] ? 'Purchased. Thank you, Chief.' : 'One per chief.';
  if (p.limit) {
    const left = Math.max(0, p.limit - num(s.counts[p.id]));
    return left ? `${left} of ${p.limit} left` : 'Sold out';
  }
  if (p.dailyLimit) {
    ensureDay();
    const bought = num(s.dayCounts[p.id]) >= p.dailyLimit;
    return `${bought ? 'Bought today. ' : ''}New deal in ${Game.fmtTime(secsToMidnight())}`;
  }
  return '';
}

function renderPacks() {
  // the starter pack leads while it is available, then the monthly card; finished one-time offers sink to the end
  const list = [STARTER_ID, BUILDER_ID, DAILY_ID, HERO_ID].map(product);
  const isDone = p => ['owned', 'included'].includes(canBuy(p).code);

  return `<div class="shop-packs">${head.map(packPanel).join('')}${cardPanel()}${avail.map(packPanel).join('')}${list.filter(isDone).map(packPanel).join('')}</div>`;
}

    render: renderPacks,
    sig: () => [sh().owned[STARTER_ID], sh().owned[BUILDER_ID], vipLevel() >= VIP_BUILDER_LV, cardActive(), canBuy(product(HERO_ID)).ok].map(Boolean).join(','),
  },
  vip: { render: renderVip, sig: () => [vipLevel(), Game.perk('builders'), sh().owned[BUILDER_ID] ? 1 : 0].join(',') },
  items: { render: renderItems, sig: () => String(today()) },
};

function renderSection(id, force = false) {
  const host = ui.secs[id];
  if (!host || !ready()) return;
  const sig = SECTION[id].sig();
  if (!force && ui.sigs[id] === sig) return;
  ui.sigs[id] = sig;
  const a = document.activeElement;
  const key = a && host.contains(a) ? a.getAttribute('data-k') : null;
  host.innerHTML = SECTION[id].render();
  if (key) {
    const again = host.querySelector(`[data-k="${CSS.escape(key)}"]`);
    try { again?.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  updateSection(id);
}

function syncBuyButtons(host) {
  host.querySelectorAll('[data-buy]').forEach(b => {
    const p = product(b.dataset.buy);
    const c = canBuy(p);
    const label = (c.ok ? b.dataset.prefix || '' : '') + c.label;
    setText(b.querySelector('.shop-price-txt'), label);
    const dis = !c.ok || !!inFlight;
    if (b.disabled !== dis) b.disabled = dis;
    b.classList.toggle('is-done', !c.ok);
  });
}

function updateSection(id) {
  const host = ui.secs[id];
  if (!host || !ready()) return;
  syncBuyButtons(host);
  if (id === 'packs') {
    host.querySelectorAll('[data-limit]').forEach(n => setText(n, limitNote(product(n.dataset.limit))));
    const days = host.querySelector('[data-card-days]');
    if (days) {
      const left = cardClaimsLeft();
      const can = cardClaimable();
      setText(days, `${left} ${left === 1 ? 'claim' : 'claims'} left`);
      setText(host.querySelector('[data-card-sub]'), can ? `Today: ${product(CARD_ID).daily} Gems ready` : `Next claim in ${Game.fmtTime(secsToMidnight())}`);
      setText(host.querySelector('[data-card-btn]'), can ? `Claim ${product(CARD_ID).daily}` : 'Claimed');
      const b = host.querySelector('[data-claim="card"]');
      if (b.disabled !== !can) b.disabled = !can;
    }
  } else if (id === 'vip') {
    const lv = vipLevel();
    const pts = vipPoints();
    const cur = vipRow(lv).pts;
    const next = lv < VIP_MAX ? vipRow(lv + 1).pts : null;
    host.querySelector('[data-vip-bar]').style.width = (next ? Math.min(100, ((pts - cur) / (next - cur)) * 100) : 100).toFixed(1) + '%';
    setText(host.querySelector('[data-vip-pts]'), next ? `${fmtFull(pts)} / ${fmtFull(next)}` : `${fmtFull(pts)} points`);
    setText(host.querySelector('[data-vip-next]'), next ? `${fmtFull(next - pts)} points to VIP ${lv + 1}` : 'Highest VIP level reached.');
    const can = vipDailyReady();
    const st = can ? vipStreakNext() : num(sh().vipStreak);
    setText(host.querySelector('[data-vip-daily-sub]'), can
      ? `Day ${st} streak: +${vipDailyPts(st)} points`
      : `Day ${st} streak. Tomorrow +${vipDailyPts(st + 1)}, in ${Game.fmtTime(secsToMidnight())}`);
    setText(host.querySelector('[data-vip-daily-btn]'), can ? `Claim +${vipDailyPts(st)}` : 'Claimed');
    const db = host.querySelector('[data-claim="vipday"]');
    if (db.disabled !== !can) db.disabled = !can;
    host.querySelectorAll('[data-claim^="vipgift:"]').forEach(b => {
      const L = Number(b.dataset.claim.split(':')[1]);
      const claimed = !!sh().vipGifts[L];
      const reached = lv >= L;
      setHtml(b.querySelector('[data-gift-lbl]'), claimed ? 'Claimed' : reached ? 'Claim' : `${Game.icon('lock', 14)} VIP ${L}`);
      const dis = claimed || !reached;
      if (b.disabled !== dis) b.disabled = dis;
      b.classList.toggle('ghost', dis);
      b.classList.toggle('green', !dis);
    });
  } else if (id === 'items') {
    const can = giftReady();
    setText(host.querySelector('[data-gift-sub]'), can ? 'Free once a day. Ready now.' : `Next gift in ${Game.fmtTime(secsToMidnight())}`);
    setText(host.querySelector('[data-gift-btn]'), can ? 'Claim' : 'Claimed');
    const gb = host.querySelector('[data-claim="gift"]');
    if (gb.disabled !== !can) gb.disabled = !can;
    setText(host.querySelector('[data-reset]'), `Resets in ${Game.fmtTime(secsToMidnight())}`);
    const gems = num(Game.S.res.gems);
    host.querySelectorAll('[data-gscard]').forEach(cardEl => {
      const g = gsDef(cardEl.dataset.gscard);
      const left = gsLeft(g);
      const cost = gsCost(g);
      setText(cardEl.querySelector('[data-gs-left]'), left === Infinity ? 'No daily limit' : `${left}/${g.limit} today`);
      const b = cardEl.querySelector('[data-gs]');
      setHtml(b, left > 0 ? `${Game.icon('gem', 16)}<span class="${gems < cost ? 'shop-short' : ''}">${fmtFull(cost)}</span>` : 'Sold out');
      if (b.disabled !== (left <= 0)) b.disabled = left <= 0;
      cardEl.classList.toggle('is-done', left <= 0);
    });
  }

function updateSegDots() {
  if (!ui.root) return;
  const c = claimables();
  const per = { gems: 0, packs: c.card, vip: c.vip, items: c.gift };
  for (const s of SECTIONS) {
    const dot = ui.root.querySelector(`[data-sec="${s.id}"] .badge-dot`);
    if (dot) dot.hidden = !per[s.id];
  }
}

function showSection(id, opts = {}) {
  if (!ui.root) return;
  if (!SECTIONS.some(s => s.id === id)) id = 'gems';
  const changed = ui.cur !== id;
  ui.cur = id;
  Game.storage.set(SEC_KEY, id);
  for (const s of SECTIONS) {
    ui.secs[s.id].hidden = s.id !== id;
    ui.root.querySelector(`[data-sec="${s.id}"]`).setAttribute('aria-pressed', String(s.id === id));
  }
  renderSection(id);
  updateSection(id);
  updateSegDots();
  if (opts.focus) focusCard(opts.focus);
  else if (changed && opts.scroll !== false) ui.root.scrollTop = 0;
}

function focusCard(elId) {
  const target = ui.root && ui.root.querySelector('#' + CSS.escape(elId));
  if (!target) return;
  const top = ui.root.querySelector('.shop-top');
  const offset = (top ? top.offsetHeight : 0) + 10;
  const dy = target.getBoundingClientRect().top - ui.root.getBoundingClientRect().top - offset;
  ui.root.scrollTop += dy;
  target.classList.remove('shop-flash');
  void target.offsetWidth;
  target.classList.add('shop-flash');
  setTimeout(() => target.classList.remove('shop-flash'), 1800);
}

function refreshNow() {
  if (!ready()) return;
  updateBadges();
  syncOfferButton();
  if (!ui.root || !ui.cur) return;
  renderSection(ui.cur);
  updateSection(ui.cur);
  updateSegDots();
}

function claim(what) {
  if (what === 'card') return claimCard();
  if (what === 'gift') return claimGift();
  if (what === 'vipday') return claimVipDaily();
  if (what.startsWith('vipgift:')) return claimVipGift(Number(what.split(':')[1]));
  return false;
}

async function doRestore() {
  const r = await restore();
  if (!r.ok) Game.toast('Could not reach the store. Try again later.', 'bad');
  else if (r.restored) Game.toast(`Restored ${r.restored} purchase${r.restored > 1 ? 's' : ''}.`, 'good');
  else Game.toast('Nothing to restore. Your purchases are up to date.');
}

function onScreenClick(e) {
  const b = e.target.closest('button');
  if (!b || b.disabled || !ui.root.contains(b)) return;
  const d = b.dataset;
  if (d.sec) showSection(d.sec);
  else if (d.buy) purchase(d.buy);
  else if (d.gs) gemShopSheet(d.gs);
  else if (d.claim) claim(d.claim);
  else if (d.go) Game.navigate(d.go);
  else if (d.act === 'restore') doRestore();
  else if (d.act === 'history') historySheet();
}

function gemShopSheet(id) {
  const g = gsDef(id);
  if (!g || !ready()) return null;
  const d = Game.itemDefs[g.item] || { name: g.item, icon: 'crate' };
  const startLeft = gsLeft(g);
  if (startLeft <= 0) { Game.toast('Sold out for today.'); return null; }
  const cost0 = gsCost(g);
  const max = Math.max(1, Math.min(99, startLeft, Math.floor(num(Game.S.res.gems) / cost0) || 1));
  let qty = 1;
  const body = Game.el(`<div class="shop-buy">
    <div class="shop-buy-top">${Game.itemTileHtml(g.item)}<div><div class="shop-buy-name${d.rarity ? ' rarity-text rarity-' + esc(d.rarity) : ''}">${esc(d.name)}</div><div class="shop-buy-owned">Owned <span data-owned></span></div><p class="shop-buy-desc">${esc(Game.itemDesc(g.item))}</p></div></div>
    ${max > 1 ? `<div class="shop-buy-qty">
      <button type="button" class="icon-btn" data-q="-1" aria-label="One less">${Game.icon('minus', 16)}</button>
      <input type="range" id="shop-buy-qty" min="1" max="${max}" value="1" aria-label="Amount to buy">
      <button type="button" class="icon-btn" data-q="1" aria-label="One more">${Game.icon('plus', 16)}</button>
      <span class="shop-buy-n" data-n>1</span>
    </div>` : ''}
    <div class="shop-buy-total"><span>Total</span><span class="shop-buy-cost">${Game.icon('gem', 20)}<span data-total></span></span></div>
    <p class="shop-buy-limit" data-limit></p>
  </div>`);
  const total = () => gsCost(g) * qty;
  const setQty = v => {
    qty = Math.max(1, Math.min(max, Math.floor(Number(v) || 1)));
    const r = body.querySelector('#shop-buy-qty');
    if (r && Number(r.value) !== qty) r.value = String(qty);
    sheet.refresh();
  };
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-q]');
    if (b) setQty(qty + Number(b.dataset.q));
  });
  body.addEventListener('input', e => { if (e.target.id === 'shop-buy-qty') setQty(e.target.value); });
  const sheet = Game.sheet({
    title: 'Buy with Gems',
    body,
    className: 'shop-buy-sheet',
    update: el => {
      setText(el.querySelector('[data-owned]'), fmtFull(Game.itemCount(g.item)));
      const n = el.querySelector('[data-n]');
      if (n) setText(n, 'x' + qty);
      const t = el.querySelector('[data-total]');
      setText(t, fmtFull(total()));
      t.classList.toggle('shop-short', num(Game.S.res.gems) < total());
      const left = gsLeft(g);
      setText(el.querySelector('[data-limit]'), left === Infinity ? `You have ${fmtFull(Game.S.res.gems)} Gems.` : `${left} left today. You have ${fmtFull(Game.S.res.gems)} Gems.`);
    },
    actions: [
      { id: 'gs-cancel', label: 'Cancel', kind: 'ghost', onClick: () => {} },
      {
        id: 'gs-buy',
        label: () => `<span>Buy</span><span class="btn-cost">${Game.icon('gem', 18)}${fmtFull(total())}</span>`,
        kind: 'gold',
        disabled: () => gsLeft(g) < qty,
        onClick: () => {
          const n = qty;
          const cost = total();
          if (gsLeft(g) < n) { Game.toast('Daily limit reached.', 'bad'); return false; }
          if (!Game.spend({ gems: cost }, 'shop:' + g.item)) { Game.needGems(cost); return false; }
          ensureDay();
          if (g.limit) sh().gs[g.id] = num(sh().gs[g.id]) + n;
          Game.grant({ items: { [g.item]: n } }, { source: 'shop:gems', popup: true, title: 'Purchased' });
          Game.emit('shop:bought', { id: g.id, item: g.item, count: n, gems: cost });
          refreshNow();
          return undefined;
        },
      },
    ],
  });
  return sheet;
}

function day2ShardId() {
  const defs = Object.values(Game.itemDefs).filter(d => /^shard_/.test(d.id));
  if (!defs.length) return null;
  const rank = { legendary: 3, epic: 2, rare: 1 };
  let pool = defs.filter(d => d.rarity === 'epic');
  if (!pool.length) {
    const best = Math.max(...defs.map(d => rank[d.rarity] || 0));
    pool = defs.filter(d => (rank[d.rarity] || 0) === best);
  }
  const unowned = pool.filter(d => !call(() => Game.mil?.owns?.(d.id.slice(6)), false));
  const list = (unowned.length ? unowned : pool).slice().sort((a, b) => num(a.sort) - num(b.sort) || a.id.localeCompare(b.id));
  return list[0].id;
}
function day2Rewards() {
  const sid = day2ShardId();
  return sid ? R({ [sid]: DAY2_SHARDS, xp_book: 3 }) : R({ ticket_recruit: 2, xp_book: 3 });
}

function newState() {
  const now = Game.now();
  return {
    v: 1,
    cnt: {},
    seen: { lv: {} },
    stats: { maxStage: 0, maxHeroLv: 1, gemsEarned: 0, days: 0, heroes: [] },
    ch: { idx: 0, base: {}, done: {}, claimed: {}, startAt: now },
    daily: { day: null, cnt: {}, claimed: {}, chests: {} },
    login: { round: 1, claimed: 0, last: null },
    mail: [welcomeMail(now), testModeMail(now - 1000)],
    mailSeq: 0,
    flags: { supply: {} },
  };
}
function numMap(o) {
  const out = {};
  if (isObj(o)) for (const [k, v] of Object.entries(o)) if (Number.isFinite(v) && v > 0) out[k] = v;
  return out;
}
function boolMap(o) {
  const out = {};
  if (isObj(o)) for (const [k, v] of Object.entries(o)) if (v) out[k] = true;
  return out;
}
function migrate(s) {
  const d = newState();
  if (!isObj(s)) return d;
  s.v = 1;
  s.cnt = numMap(s.cnt);
  if (!isObj(s.seen)) s.seen = { lv: {} };
  s.seen.lv = numMap(s.seen.lv);
  if (!isObj(s.stats)) s.stats = d.stats;
  s.stats.maxStage = int(s.stats.maxStage);
  s.stats.maxHeroLv = Math.max(1, int(s.stats.maxHeroLv));
  s.stats.gemsEarned = int(s.stats.gemsEarned);
  s.stats.days = int(s.stats.days);
  s.stats.heroes = Array.isArray(s.stats.heroes) ? [...new Set(s.stats.heroes.filter(x => typeof x === 'string'))] : [];
  if (!isObj(s.ch)) s.ch = d.ch;
  s.ch.idx = Math.min(CHAPTERS.length, int(s.ch.idx));
  s.ch.base = numMap(s.ch.base);
  s.ch.done = boolMap(s.ch.done);
  s.ch.claimed = boolMap(s.ch.claimed);
  if (!Number.isFinite(s.ch.startAt)) s.ch.startAt = Game.now();
  if (!isObj(s.daily)) s.daily = d.daily;
  s.daily.day = typeof s.daily.day === 'string' ? s.daily.day : null;
  s.daily.cnt = numMap(s.daily.cnt);
  s.daily.claimed = boolMap(s.daily.claimed);
  s.daily.chests = boolMap(s.daily.chests);
  if (!isObj(s.login)) s.login = d.login;
  s.login.round = Math.max(1, int(s.login.round));
  s.login.claimed = Math.min(LOGIN_DAYS, int(s.login.claimed));
  s.login.last = typeof s.login.last === 'string' ? s.login.last : null;
  s.mail = Array.isArray(s.mail)
    ? s.mail.filter(m => isObj(m) && m.id != null).map(m => ({
      id: String(m.id),
      from: String(m.from ?? ''),
      title: String(m.title ?? ''),
      body: Array.isArray(m.body) ? m.body.map(String) : [String(m.body ?? '')],
      rewards: isObj(m.rewards) ? m.rewards : null,
      go: isObj(m.go) && m.go.target ? { label: String(m.go.label || 'Go'), target: String(m.go.target) } : null,
      at: Number.isFinite(m.at) ? m.at : Game.now(),
      read: !!m.read,
      claimed: !!m.claimed,
    }))
    : d.mail;
  s.mailSeq = int(s.mailSeq);
  if (!isObj(s.flags)) s.flags = { supply: {} };
  s.flags.supply = boolMap(s.flags.supply);
  return s;
}

// ================================================================ chapter logic
function chapter() {
  const p = P();
  return p && p.ch.idx < CHAPTERS.length ? CHAPTERS[p.ch.idx] : null;
}
function chapterCount(key) {
  const p = P();
  return p ? Math.max(0, num(p.cnt[key]) - num(p.ch.base[key])) : 0;
}
const taskText = t => String(call(t.text, ''));
function taskCur(t) { return Math.max(0, num(Number(call(t.cur, 0)))); }
function taskState(t) {
  const ch = P()?.ch;
  if (!ch) return 'open';
  if (ch.claimed[t.id]) return 'claimed';
  if (ch.done[t.id]) return 'ready';
  return 'open';
}
// Progress for display: a finished task always reads n/n, even if the live value moved (workers, for example).
function taskShown(t) {
  const st = taskState(t);
  return st === 'open' ? Math.min(t.n, taskCur(t)) : t.n;
}
function evalChapter() {
  const c = chapter();
  if (!c) return;
  const ch = P().ch;
  let newly = null;
  for (const t of c.tasks) {
    if (ch.done[t.id] || ch.claimed[t.id]) continue;
    if (taskCur(t) >= t.n) {
      ch.done[t.id] = true;
      newly ||= t;
    }
  }
  if (newly && Game.isReady && Game.screen?.() !== 'city' && Game.screen?.() !== 'events') Game.toast(`Quest complete: ${taskText(newly)}`, 'good');
}
function chapterComplete() {
  const c = chapter();
  return !!c && c.tasks.every(t => P().ch.claimed[t.id]);
}
function chapterClaimedCount() {
  const c = chapter();
  return c ? c.tasks.filter(t => P().ch.claimed[t.id]).length : 0;
}
function claimTask(id) {
  const c = chapter();
  const t = c?.tasks.find(x => x.id === id);
  if (!t || taskState(t) !== 'ready') return false;
  const p = P();
  p.ch.claimed[t.id] = true;
  delete p.ch.done[t.id];
  Game.grant(t.rewards, { source: 'quest', popup: true, title: 'Quest reward' });
  Game.emit('mission:claimed', { id: `chapter${p.ch.idx + 1}:${t.id}` });
  afterClaim();
  return true;
}
function claimChapterChest() {
  if (!chapterComplete()) return false;
  const p = P();
  const i = p.ch.idx;
  const c = CHAPTERS[i];
  p.ch = { idx: i + 1, base: { ...p.cnt }, done: {}, claimed: {}, startAt: Game.now() };
  Game.grant(c.chest, { source: 'chapter', popup: true, title: `Chapter ${i + 1} complete` });
  Game.emit('mission:claimed', { id: `chapter${i + 1}:chest` });
  evalChapter();
  if (CHAPTERS[i + 1]) Game.toast(`Chapter ${i + 2}: ${CHAPTERS[i + 1].title}`, 'info');
  afterClaim();
  return true;
}
function sortedTasks(c) {
  const rank = { ready: 0, open: 1, claimed: 2 };
  return c.tasks.map((t, i) => ({ t, i })).sort((a, b) => rank[taskState(a.t)] - rank[taskState(b.t)] || a.i - b.i).map(x => x.t);
}
function chestPreview(i) {
  const c = CHAPTERS[i];
  if (!c) return;
  Game.sheet({
    title: `Chapter ${i + 1} chest`,
    body: `<div class="prog-preview"><p class="prog-preview-p">Claim every task in ${esc(c.title)} to open this chest.</p><div class="prog-rw-grid">${Game.rewardsHtml(c.chest)}</div></div>`,
    actions: [{ label: 'OK', kind: 'ghost', onClick: () => {} }],
  });
}

// ================================================================ daily logic
function dailyCount(key) { return num(P()?.daily?.cnt?.[key]); }
function missionState(m) {
  const d = P()?.daily;
  if (!d) return 'open';
  if (d.claimed[m.id]) return 'claimed';
  return dailyCount(m.key) >= m.n ? 'ready' : 'open';
}
function activity() {
  const d = P()?.daily;
  return d ? Math.min(MAX_POINTS, DAILY.reduce((t, m) => t + (d.claimed[m.id] ? m.pts : 0), 0)) : 0;
}
function chestState(c) {
  const d = P()?.daily;
  if (d?.chests[c.at]) return 'open';
  return activity() >= c.at ? 'ready' : 'locked';
}
function claimMission(id, quiet) {
  const m = DAILY.find(x => x.id === id);
  if (!m || missionState(m) !== 'ready') return 0;
  P().daily.claimed[m.id] = true;
  Game.emit('mission:claimed', { id: 'daily:' + m.id });
  if (!quiet) Game.toast(`+${m.pts} activity`, 'good');
  afterClaim();
  return m.pts;
}
function claimAllMissions() {
  let pts = 0;
  for (const m of DAILY) pts += claimMission(m.id, true);
  if (pts) Game.toast(`+${pts} activity`, 'good');
  return pts;
}
function claimDailyChest(at) {
  const c = CHESTS.find(x => x.at === Number(at));
  if (!c || chestState(c) !== 'ready') return false;
  P().daily.chests[c.at] = true;

}
function dailyChestPreview(c) {

// ================================================================ login logic
// One claim per calendar day. After day 7 a new round starts on the next day.
function loginState() {
  const L = P().login;
  if (L.claimed >= LOGIN_DAYS && L.last !== Game.today()) {
    L.claimed = 0;
    L.round += 1;
  }
  return L;
}
function loginReady() {
  if (!P()) return false;
  const L = loginState();
  return L.claimed < LOGIN_DAYS && L.last !== Game.today();
}
function claimLogin() {
  if (!loginReady()) return false;
  const L = P().login;
  const day = L.claimed + 1;
  const rw = loginRewards(day);
  L.claimed = day;
  L.last = Game.today();
  Game.grant(rw, { source: 'login', popup: true, title: `Day ${day} reward` });
  bump('login');
  Game.emit('login:claimed', { day, round: L.round });
  afterClaim();
  return true;
}
function loginPreview(day) {
  const L = loginState();
  let msg;
  if (day <= L.claimed) msg = 'Claimed.';
  else if (day === L.claimed + 1 && loginReady()) msg = 'Ready to claim today.';
  else if (day === L.claimed + 1) msg = 'Ready tomorrow.';
  else msg = `Unlocks after day ${day - 1}. Sign in once a day to move along.`;
  Game.sheet({
    title: `Day ${day}`,
    body: `<div class="prog-preview"><p class="prog-preview-p">${esc(msg)}</p><div class="prog-rw-grid">${Game.rewardsHtml(loginRewards(day))}</div></div>`,
    actions: day === L.claimed + 1 && loginReady()
      ? [{ label: 'Claim', kind: 'gold', onClick: () => { claimLogin(); } }]
      : [{ label: 'OK', kind: 'ghost', onClick: () => {} }],
  });
}

// ================================================================ mail logic
function mails() {
  const p = P();
  return p ? p.mail.slice().sort((a, b) => b.at - a.at) : [];
}
const mailHasGift = m => !!m.rewards && !m.claimed;
function mailBadge() {
  const p = P();
  return p ? p.mail.filter(m => !m.read || mailHasGift(m)).length : 0;
}
function addMail(def) {
  const p = P();
  if (!p || !isObj(def)) return null;
  p.mailSeq += 1;
  const m = {
    id: String(def.id || 'mail-' + p.mailSeq),
    from: String(def.from || 'Council of Survivors'),
    title: String(def.title || 'Mail'),
    body: Array.isArray(def.body) ? def.body.map(String) : [String(def.body || '')],
    rewards: isObj(def.rewards) ? def.rewards : null,
    go: isObj(def.go) && def.go.target ? { label: String(def.go.label || 'Go'), target: String(def.go.target) } : null,
    at: Game.now(),
    read: false,
    claimed: false,
  };
  p.mail = p.mail.filter(x => x.id !== m.id);
  p.mail.push(m);
  if (Game.isReady) Game.toast(`New mail: ${m.title}`, 'info');
  return m;
}
function checkSupplyMail(L) {
  const p = P();
  if (!p) return;
  for (const k of Object.keys(SUPPLY).map(Number).sort((a, b) => a - b)) {
    if (L < k || p.flags.supply[k]) continue;
    p.flags.supply[k] = true;
    addMail({
      id: 'supply-' + k,
      from: 'Council of Survivors',
      title: `Supply drop: Furnace Lv ${k}`,
      body: [`Word of your Lv ${k} Furnace has spread across the snow. Traders left these supplies at the gate.`],
      rewards: SUPPLY[k],
    });
  }
}
function claimMail(id) {
  const m = P()?.mail.find(x => x.id === id);
  if (!m || !mailHasGift(m)) return false;
  m.claimed = true;
  m.read = true;
  Game.grant(m.rewards, { source: 'mail', popup: true, title: 'Mail' });
  afterClaim();
  return true;
}
function claimAllMail() {
  const p = P();
  if (!p) return false;
  const list = p.mail.filter(mailHasGift);
  if (!list.length) return false;
  const total = { items: {} };
  for (const m of list) {
    m.claimed = true;
    m.read = true;
    for (const k of RES_KEYS) if (num(m.rewards[k]) > 0) total[k] = num(total[k]) + m.rewards[k];
    for (const [id, n] of Object.entries(m.rewards.items || {})) total.items[id] = num(total.items[id]) + n;
  }
  for (const m of p.mail) m.read = true;
  Game.grant(total, { source: 'mail', popup: true, title: 'Mail' });
  afterClaim();
  return true;
}

// ================================================================ badges
function claimables() {
  const p = P();
  if (!p) return { chapter: 0, daily: 0, login: 0, total: 0 };
  let chN = 0;
  const c = chapter();
  if (c) {
    for (const t of c.tasks) if (taskState(t) === 'ready') chN++;
    if (chapterComplete()) chN++;
  }
  let dN = 0;
  for (const m of DAILY) if (missionState(m) === 'ready') dN++;
  for (const x of CHESTS) if (chestState(x) === 'ready') dN++;
  const lN = loginReady() ? 1 : 0;
  return { chapter: chN, daily: dN, login: lN, total: chN + dN + lN };
}
function refreshBadges() {
  Game.badge('events', claimables().total);
}
function afterClaim() {
  refreshBadges();
  updateBanner();
  try { Game.render(); } catch (e) { /* render is best effort */ }
}

function bannerModel() {
  const p = P();
  if (!p) return null;
  const c = chapter();
  if (c) {
    const kicker = `Chapter ${p.ch.idx + 1} · ${c.title}`;
    const ready = c.tasks.find(t => taskState(t) === 'ready');
    if (ready) return { kind: 'task', id: ready.id, lv: !!ready.lv, kicker, text: taskText(ready), cur: ready.n, n: ready.n, claim: true, icon: ready.icon, go: ready.go };
    const open = c.tasks.find(t => taskState(t) === 'open');
    if (open) {
      const busy = open.hl && call(() => Game.city?.isUpgrading?.(open.hl), false);
      return { kind: 'task', id: open.id, lv: !!open.lv, kicker, text: taskText(open), cur: taskShown(open), n: open.n, claim: false, icon: open.icon, go: open.go, hl: busy ? null : open.hl || null };
    }
    return { kind: 'chest', id: 'chest', kicker, text: 'Chapter complete. Open the chest', cur: 1, n: 1, claim: true, icon: 'chest' };
  }
  const kicker = `Daily missions · ${activity()}/${MAX_POINTS}`;
  const readyM = DAILY.find(m => missionState(m) === 'ready');
  if (readyM) return { kind: 'mission', id: readyM.id, kicker, text: readyM.text, cur: readyM.n, n: readyM.n, claim: true, icon: readyM.icon };
  const chest = CHESTS.find(x => chestState(x) === 'ready');
  if (chest) return { kind: 'dchest', id: String(chest.at), kicker, text: `Activity chest ${chest.at} is ready`, cur: 1, n: 1, claim: true, icon: 'chest' };
  const openM = DAILY.find(m => missionState(m) === 'open');
  if (openM) return { kind: 'mission', id: openM.id, kicker, text: openM.text, cur: Math.min(openM.n, dailyCount(openM.key)), n: openM.n, claim: false, icon: openM.icon, go: openM.go };
  return { kind: 'daydone', id: 'done', kicker, text: 'All daily missions done. New ones after the reset', cur: 1, n: 1, claim: false, icon: 'check', view: true };
}

// ================================================================ Events screen
const SUBS = [
  { id: 'chapter', label: 'Chapter' },
  { id: 'daily', label: 'Daily' },
  { id: 'login', label: 'Login' },
];

function mountEvents(el) {
  ui.root = el;
  el.innerHTML = `<div class="prog-events">
    <div class="seg prog-subtabs" role="group" aria-label="Event sections">${SUBS.map(s => `<button type="button" id="prog-sub-${s.id}" data-sub="${s.id}" aria-pressed="false"><span>${s.label}</span><span class="badge-dot" aria-hidden="true" hidden></span></button>`).join('')}</div>
    ${SUBS.map(s => `<div class="prog-view" data-view="${s.id}" hidden></div>`).join('')}
  </div>`;
  for (const s of SUBS) ui.views[s.id] = el.querySelector(`[data-view="${s.id}"]`);
  el.addEventListener('click', onEventsClick);
  setSub(ui.sub, true);
}
function setSub(id, keepScroll) {
  if (!SUBS.some(s => s.id === id)) return;
  ui.sub = id;
  Game.storage.set(SUB_KEY, id);
  const el = ui.root;
  if (!el) return;
  el.querySelectorAll('.prog-subtabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sub === id)));
  for (const s of SUBS) ui.views[s.id].hidden = s.id !== id;
  if (!keepScroll) el.scrollTop = 0;
  updateEvents(el);
}
function onEventsClick(e) {
  const b = e.target.closest('button');
  if (!b || b.disabled || !ui.root.contains(b)) return;
  if (b.dataset.sub) { setSub(b.dataset.sub); return; }
  const act = b.dataset.act;
  const id = b.dataset.id;
  if (act === 'task-go') { const t = chapter()?.tasks.find(x => x.id === id); if (t) runGo(t.go); }
  else if (act === 'task-claim') claimTask(id);
  else if (act === 'chest') { if (chapterComplete()) claimChapterChest(); else chestPreview(P().ch.idx); }
  else if (act === 'm-go') { const m = DAILY.find(x => x.id === id); if (m) runGo(m.go); }
  else if (act === 'm-claim') claimMission(id);
  else if (act === 'm-all') claimAllMissions();
  else if (act === 'dchest') {
    const c = CHESTS.find(x => String(x.at) === id);
    if (c) { if (chestState(c) === 'ready') claimDailyChest(c.at); else dailyChestPreview(c); }
  } else if (act === 'day') {
    const day = Number(id);
    if (day === P().login.claimed + 1 && loginReady()) claimLogin(); else loginPreview(day);
  } else if (act === 'login') claimLogin();
  else if (act === 'go') Game.navigate(b.dataset.go);
  if (ui.root) updateEvents(ui.root);
}
function updateEvents(el) {
  if (!P() || !el) return;
  const cl = claimables();
  el.querySelectorAll('.prog-subtabs button').forEach(b => {
    const n = cl[b.dataset.sub] || 0;
    const dot = b.querySelector('.badge-dot');
    if (dot.hidden !== (n === 0)) dot.hidden = n === 0;
    const lab = `${SUBS.find(s => s.id === b.dataset.sub).label}${n ? `, ${n} to claim` : ''}`;
    if (b.getAttribute('aria-label') !== lab) b.setAttribute('aria-label', lab);
  });
  if (ui.sub === 'chapter') updateChapterView(ui.views.chapter);
  else if (ui.sub === 'daily') updateDailyView(ui.views.daily);
  else updateLoginView(ui.views.login);
}

    const cur = missionState(m) === 'open' ? Math.min(m.n, dailyCount(m.key)) : m.n;
    setText(row.querySelector('[data-f="num"]'), `${fmtFull(cur)}/${fmtFull(m.n)}`);
    const b = row.querySelector('.progress .bar');
    const bw = ((cur / m.n) * 100).toFixed(1) + '%';
    if (b.style.width !== bw) b.style.width = bw;
  }
}

// ---------- login view
function loginSig() {
  const L = loginState();
  return `${L.round}:${L.claimed}:${loginReady() ? 1 : 0}:${day2ShardId() || ''}`;
}
function dayTiles(rw, max) {
  const list = rewardEntries(rw);
  const shown = list.slice(0, max).map(x => Game.tileHtml({ icon: x.icon, rarity: x.rarity, count: x.count })).join('');
  const more = list.length > max ? `<span class="prog-day-more">+${list.length - max}</span>` : '';
  return shown + more;
}
function renderLoginView(view) {
  const L = loginState();
  const ready = loginReady();
  const next = L.claimed + 1;
  const cards = [];
  for (let d = 1; d <= LOGIN_DAYS; d++) {
    const st = d <= L.claimed ? 'claimed' : d === next && ready ? 'ready' : d === next ? 'next' : 'locked';
    const names = rewardEntries(loginRewards(d)).map(x => `${x.name} ${x.count}`).join(', ');
    const stTxt = st === 'claimed' ? 'claimed' : st === 'ready' ? 'ready to claim' : st === 'next' ? 'ready tomorrow' : 'locked';
    cards.push(`<button type="button" class="prog-day is-${st}${d === LOGIN_DAYS ? ' is-big' : ''}" data-act="day" data-id="${d}" aria-label="Day ${d}, ${stTxt}: ${esc(names)}">
      <span class="prog-day-n">Day ${d}</span>
      <span class="prog-day-tiles">${dayTiles(loginRewards(d), d === LOGIN_DAYS ? 3 : 1)}</span>
      ${st === 'claimed' ? `<span class="prog-day-check">${Game.icon('check', 18)}</span>` : ''}
      ${st === 'ready' ? '<span class="prog-day-flag">Today</span>' : ''}
    </button>`);
  }
  view.innerHTML = `<section class="panel prog-login">
      <div class="prog-login-head">
        <div>
          <div class="prog-kicker">7-day login · Round ${L.round}</div>
          <h2 class="prog-title">Daily supplies</h2>
        </div>
        <span class="prog-icon-lg">${Game.icon('calendar', 40)}</span>
      </div>
      <p class="prog-blurb">Sign in on 7 different days to claim every reward. Day 2 brings shards of an Epic hero, day 7 the biggest haul.</p>
      <div class="prog-days">${cards.join('')}</div>
      <button type="button" class="btn gold wide prog-login-claim" id="prog-login-claim" data-act="login"${ready ? '' : ' disabled'}>${ready ? `Claim day ${next}` : 'Claimed today'}</button>
      <div class="prog-reset prog-login-next" data-f="next"></div>
    </section>`;
}
function updateLoginView(view) {
  const s = loginSig();
  if (ui.sig.login !== s) { ui.sig.login = s; renderLoginView(view); }
  const L = loginState();
  const nextEl = view.querySelector('[data-f="next"]');
  if (loginReady()) setHtml(nextEl, `${Game.icon('gift', 14)}<span>Day ${L.claimed + 1} is ready</span>`);
  else {
    const t = Game.fmtTime(secToReset());
    const what = L.claimed >= LOGIN_DAYS ? 'New round in' : `Day ${L.claimed + 1} in`;
    setHtml(nextEl, `${Game.icon('clock', 14)}<span>${what} ${esc(t)}</span>`);
  }
}

// ================================================================ mail sheets
let mailSheet = null;
function mailSig() {
  return mails().map(m => `${m.id}:${m.read ? 1 : 0}${m.claimed ? 1 : 0}`).join(',');
}
function renderMailList(body) {
  const list = mails();
  const host = body.querySelector('[data-f="list"]');
  host.innerHTML = list.map(m => {
    const gift = mailHasGift(m);
    const flags = [!m.read ? 'unread' : '', gift ? 'has an attachment' : ''].filter(Boolean).join(', ');
    return `<button type="button" class="prog-mail-row card${m.read ? '' : ' is-unread'}" data-mail="${esc(m.id)}" aria-label="${esc(m.title)}, from ${esc(m.from)}${flags ? ', ' + flags : ''}">
      <span class="prog-mail-ico">${Game.icon(gift ? 'gift' : 'mail', 28)}</span>
      <span class="prog-mail-txt">
        <span class="prog-mail-title">${esc(m.title)}</span>
        <span class="prog-mail-from">${esc(m.from)} · <span data-at="${m.at}">${esc(ago(m.at))}</span></span>
      </span>
      ${!m.read || gift ? '<span class="badge-dot" aria-hidden="true"></span>' : ''}
      <span class="prog-mail-chev">${Game.icon('chevron_right', 16)}</span>
    </button>`;
  }).join('');
  body.querySelector('[data-f="empty"]').hidden = list.length > 0;
}
function openMail() {
  if (mailSheet && !mailSheet.closed) return mailSheet;
  const body = Game.el(`<div class="prog-mail">
    <div class="prog-mail-list" data-f="list"></div>
    <p class="prog-empty" data-f="empty" hidden>No mail yet.</p>
  </div>`);
  let sig = '';
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-mail]');
    if (b) openLetter(b.dataset.mail);
  });
  mailSheet = Game.sheet({
    title: 'Mail',
    body,
    className: 'prog-mail-sheet',
    update: el => {
      const s = mailSig();
      if (s !== sig) { sig = s; renderMailList(el); }
      el.querySelectorAll('[data-at]').forEach(n => setText(n, ago(Number(n.dataset.at))));
    },
    actions: [
      { id: 'mail-read', label: 'Read all', kind: 'ghost', disabled: () => !P()?.mail.some(m => !m.read && !m.rewards), onClick: () => { for (const m of P().mail) if (!m.rewards) m.read = true; afterClaim(); return false; } },
      { id: 'mail-claim-all', label: 'Claim all', kind: 'green', disabled: () => !P()?.mail.some(mailHasGift), onClick: () => { claimAllMail(); return false; } },
    ],
    onClose: () => { mailSheet = null; },
  });
  return mailSheet;
}
function openLetter(id) {
  const m = P()?.mail.find(x => x.id === id);
  if (!m) return null;
  m.read = true;
  afterClaim();
  const body = Game.el(`<div class="prog-letter">
    <div class="prog-letter-from">${Game.icon('mail', 18)}<span>From <b>${esc(m.from)}</b> · ${esc(ago(m.at))}</span></div>
    ${m.body.map(x => `<p class="prog-letter-p">${esc(x)}</p>`).join('')}
    ${m.rewards ? `<h3 class="section-title">Attachments</h3><div class="prog-rw-grid prog-letter-rw">${Game.rewardsHtml(m.rewards)}</div><p class="prog-letter-claimed" hidden>${Game.icon('check', 14)} Claimed</p>` : ''}
  </div>`);
  const actions = [];
  if (m.go) actions.push({ id: 'mail-go', label: m.go.label, kind: 'blue', onClick: () => Game.navigate(m.go.target) });
  if (m.rewards) {
    actions.push({
      id: 'mail-claim',
      label: () => (m.claimed ? 'Claimed' : 'Claim'),
      kind: () => (m.claimed ? 'ghost' : 'green'),
      disabled: () => m.claimed,
      onClick: () => { claimMail(m.id); return false; },
    });
  } else if (!m.go) actions.push({ label: 'OK', kind: 'ghost', onClick: () => {} });
  return Game.sheet({
    title: m.title,
    body,
    className: 'prog-letter-sheet',
    update: el => {
      const rw = el.querySelector('.prog-letter-rw');
      if (rw) rw.classList.toggle('is-claimed', !!m.claimed);
      const c = el.querySelector('.prog-letter-claimed');
      if (c) c.hidden = !m.claimed;
    },
    actions,
  });
}

// ================================================================ chief profile
const NAME_MIN = 2;
const NAME_MAX = 16;
// Letters (any script, with their combining marks), digits, spaces and . _ ' -. Emoji and their joiners are refused.
const NAME_BAD = /[^\p{L}\p{M}\p{N} ._'-]|[\u200D\uFE0E\uFE0F\u20E3]/gu;
function nameCheck(raw) {
  const v = String(raw ?? '').replace(/\s+/g, ' ').trim();
  const stripped = v.replace(NAME_BAD, '').replace(/\s+/g, ' ').trim();
  if (stripped !== v) return { ok: false, name: stripped.slice(0, NAME_MAX), msg: "Letters, numbers, spaces and . _ ' - only." };
  if (v.length < NAME_MIN || v.length > NAME_MAX) return { ok: false, name: v.slice(0, NAME_MAX), msg: `Use ${NAME_MIN} to ${NAME_MAX} characters.` };
  return { ok: true, name: v, msg: '' };
}
function saveName(input) {
  const chk = nameCheck(input.value);
  if (!chk.ok || !Game.S) return false;
  if (chk.name === Game.S.meta.chiefName) { input.value = chk.name; return false; }
  Game.S.meta.chiefName = chk.name;
  input.value = chk.name;
  Game.refreshHud();
  Game.save();
  Game.toast('Name saved', 'good');
  return true;
}
const STATS = [
  { id: 'days', label: 'Days played', icon: 'calendar', val: () => fmtFull(Math.max(1, int(P()?.stats?.days))) },
  { id: 'furnace', label: 'Furnace level', icon: 'flame', val: () => 'Lv ' + Math.max(1, level('furnace')) },
  { id: 'blv', label: 'Building levels', icon: 'hammer', val: () => fmtFull(totalBuildingLevels()) },
  { id: 'heroes', label: 'Heroes owned', icon: 'hero', val: () => fmtFull(heroesOwned()) },
  { id: 'stage', label: 'Highest stage', icon: 'map', val: () => (highestStage() ? stageLabel(highestStage()) : 'None yet') },
  { id: 'gems', label: 'Gems earned', icon: 'gem', val: () => fmtFull(int(P()?.stats?.gemsEarned)) },
  { id: 'chapters', label: 'Chapters done', icon: 'trophy', val: () => `${Math.min(CHAPTERS.length, int(P()?.ch?.idx))}/${CHAPTERS.length}` },
  { id: 'since', label: 'Chief since', icon: 'clock', val: () => sinceText() },
];
function sinceText() {
  const t = num(Game.S?.meta?.createdAt);
  if (!t) return '-';
  try { return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return '-'; }
}
function mountProfile(el) {
  const n = Math.max(1, int(Game.avatarCount) || 6);
  el.innerHTML = `<div class="prog-profile">
    <div class="prog-prof-top">
      <button type="button" class="btn ghost small" id="prog-prof-back">${Game.icon('chevron_left', 16)}<span>Back</span></button>
      <h2 class="prog-prof-h">Chief profile</h2>
    </div>
    <section class="panel prog-prof-card">
      <span class="prog-prof-avatar" data-f="avatar"></span>
      <div class="prog-prof-id">
        <label class="prog-label" for="prog-name">Chief name</label>
        <div class="prog-name-row">
          <input id="prog-name" name="chief-name" type="text" maxlength="${NAME_MAX}" autocomplete="off" autocapitalize="words" spellcheck="false" aria-describedby="prog-name-hint">
          <button type="button" class="btn gold small" id="prog-name-save">Save</button>
        </div>
        <div class="prog-name-hint" id="prog-name-hint">${NAME_MIN} to ${NAME_MAX} characters.</div>
      </div>
      <div class="prog-prof-power">${Game.icon('power', 22)}<span class="prog-prof-power-l">Power</span><span class="prog-prof-power-v" data-f="power">0</span></div>
    </section>
    <h3 class="section-title">Portrait</h3>
    <div class="prog-avatars" role="group" aria-label="Portrait">${Array.from({ length: n }, (_, i) => `<button type="button" class="prog-av" id="prog-av-${i}" data-av="${i}" aria-pressed="false" aria-label="Portrait ${i + 1}">${Game.avatarSvg(i, 56)}</button>`).join('')}</div>
    <h3 class="section-title">Record</h3>
    <div class="prog-stats">${STATS.map(s => `<div class="card prog-stat" data-stat="${s.id}"><span class="prog-stat-ico">${Game.icon(s.icon, 20)}</span><span class="prog-stat-txt"><span class="prog-stat-l">${s.label}</span><span class="prog-stat-v" data-f="v"></span></span></div>`).join('')}</div>
    <div class="prog-prof-links">
      <button type="button" class="btn blue" id="prog-prof-mail">${Game.icon('mail', 20)}<span>Mail</span><span class="badge-dot" aria-hidden="true" hidden></span></button>
      <button type="button" class="btn blue" id="prog-prof-events">${Game.icon('calendar', 20)}<span>Events</span></button>
    </div>
  </div>`;
  const input = el.querySelector('#prog-name');
  const save = el.querySelector('#prog-name-save');
  const hint = el.querySelector('#prog-name-hint');
  const syncHint = () => {
    const chk = nameCheck(input.value);
    hint.textContent = chk.ok ? `${NAME_MIN} to ${NAME_MAX} characters.` : chk.msg;
    hint.classList.toggle('bad-text', !chk.ok);
    input.setAttribute('aria-invalid', String(!chk.ok));
    save.disabled = !chk.ok || chk.name === Game.S?.meta?.chiefName;
  };
  input.addEventListener('input', syncHint);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveName(input); syncHint(); input.blur(); }
    if (e.key === 'Escape') { input.value = Game.S?.meta?.chiefName ?? ''; syncHint(); }
  });
  input.addEventListener('change', () => { saveName(input); syncHint(); });
  save.addEventListener('click', () => { saveName(input); syncHint(); });
  el.querySelector('#prog-prof-back').addEventListener('click', () => Game.back());
  el.querySelector('#prog-prof-mail').addEventListener('click', () => openMail());
  el.querySelector('#prog-prof-events').addEventListener('click', () => Game.navigate('events'));
  el.querySelector('.prog-avatars').addEventListener('click', e => {
    const b = e.target.closest('[data-av]');
    if (!b || !Game.S) return;
    Game.S.meta.avatar = Number(b.dataset.av);
    Game.refreshHud();
    updateProfile(el);
  });
  ui.prof = { el, input, syncHint };
  syncProfileInput();
}
function syncProfileInput() {
  const pr = ui.prof;
  if (!pr || !Game.S) return;
  if (document.activeElement !== pr.input) pr.input.value = Game.S.meta.chiefName ?? '';
  pr.syncHint();
}
function updateProfile(el) {
  if (!Game.S) return;
  setHtml(el.querySelector('[data-f="avatar"]'), Game.avatarSvg(Game.S.meta.avatar, 88));
  setText(el.querySelector('[data-f="power"]'), fmtFull(Game.power()));
  el.querySelectorAll('[data-av]').forEach(b => {
    const on = String(Number(b.dataset.av) === Game.S.meta.avatar);
    if (b.getAttribute('aria-pressed') !== on) b.setAttribute('aria-pressed', on);
  });
  for (const s of STATS) setText(el.querySelector(`[data-stat="${s.id}"] [data-f="v"]`), call(s.val, '-'));
  const dot = el.querySelector('#prog-prof-mail .badge-dot');
  const mb = mailBadge();
  if (dot.hidden !== (mb === 0)) dot.hidden = mb === 0;
  // the HUD and other tabs can change the name too; never overwrite what the chief is typing
  if (ui.prof && document.activeElement !== ui.prof.input && ui.prof.input.value !== Game.S.meta.chiefName) syncProfileInput();
}

// ================================================================ screens, navigation, wiring
Game.registerScreen('events', {
  tab: { label: 'Events', icon: 'calendar', order: 4 },
  mount: mountEvents,
  update: updateEvents,
});
Game.registerScreen('profile', {
  tab: null,
  title: 'Chief profile',
  mount: mountProfile,
  update: updateProfile,
});
Game.registerNav('events', rest => {
  const sub = String(rest || '').split(':')[0];
  setSub(SUBS.some(s => s.id === sub) ? sub : ui.sub);
});
Game.registerNav('profile', () => {
  syncProfileInput();
  if (ui.prof) ui.prof.el.scrollTop = 0;
});
Game.registerNav('mail', () => openMail());

Game.on('ready', () => {
  if (!P()) return;
  checkSupplyMail(level('furnace'));
  evalChapter();
  if (typeof Game.city?.setBanner === 'function') {
    ui.banner = buildBanner();
    updateBanner();
    call(() => Game.city.setBanner(ui.banner));
  }
  call(() => Game.city?.addSideButton?.({ id: 'prog-mail', icon: 'mail', label: 'Mail', onClick: openMail, badge: () => mailBadge() }));
  call(() => Game.city?.addSideButton?.({ id: 'prog-login', icon: 'calendar', label: 'Login', onClick: () => Game.navigate('events:login'), badge: () => (loginReady() ? 1 : 0) }));
  refreshBadges();
});

Game.prog = {
  openMail,
  openLetter,
  sendMail: def => addMail(def),
  mailUnread: () => mailBadge(),
  claimables: () => claimables(),
  chapter: () => {
    const p = P();
    const c = chapter();
    if (!p) return null;
    return {
      index: p.ch.idx,
      total: CHAPTERS.length,
      title: c ? c.title : null,
      complete: !c,
      tasks: c ? c.tasks.map(t => ({ id: t.id, text: taskText(t), cur: taskShown(t), n: t.n, state: taskState(t) })) : [],
    };
  },
  current: () => bannerModel(),
  daily: () => ({ points: activity(), max: MAX_POINTS, missions: DAILY.map(m => ({ id: m.id, text: m.text, cur: Math.min(m.n, dailyCount(m.key)), n: m.n, pts: m.pts, state: missionState(m) })) }),
  loginReady: () => loginReady(),
  claimTask,
  claimChapterChest,
  claimMission,
  claimDailyChest,
  claimLogin,
  claimMail,
};
} catch (e) { console.error('[build] modules/progress.js failed to load', e); }
})();

/* ===== boot ===== */
try { window.claude?.hot?.snapshot?.(() => ({ state: Game.S })) } catch (e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(d => Game.boot(d)); else Game.boot(hot?.data ?? {});

</script>
